const VECTORS={up:{北:[0,-1],東:[1,0],南:[0,1],西:[-1,0]},right:{北:[1,0],東:[0,1],南:[-1,0],西:[0,-1]},left:{北:[-1,0],東:[0,-1],南:[1,0],西:[0,1]}};
const DIRS=['北','東','南','西'];
function place(map,name){const p=MAPS[map].places.find(p=>p[0]===name);if(!p)throw Error('Unknown place '+name);return p;}
function findPlaces(map,from,dir){const p=place(map,from),v=VECTORS[MAPS[map].north][dir];return MAPS[map].places.filter(t=>{const dx=t[1]-p[1],dy=t[2]-p[2];return dx*v[0]+dy*v[1]>0&&Math.abs(dx*v[1]-dy*v[0])<1}).sort((a,b)=>Math.hypot(a[1]-p[1],a[2]-p[2])-Math.hypot(b[1]-p[1],b[2]-p[2])).map(p=>p[0]);}
function findDir(map,from,to){const p=place(map,from),t=place(map,to);return DIRS.find(d=>{const v=VECTORS[MAPS[map].north][d],dx=t[1]-p[1],dy=t[2]-p[2];return dx*v[0]+dy*v[1]>0&&Math.abs(dx*v[1]-dy*v[0])<1});}
const QUESTIONS=[];
function addFind(id,map,from,dir,origin,page){const answers=findPlaces(map,from,dir);if(!answers.length)throw Error('Empty find');QUESTIONS.push({id,map,kind:'find',from,dir,answers,origin,page});}
function addDir(id,map,from,to,origin,page){const dir=findDir(map,from,to);if(!dir)throw Error('Diagonal direction');QUESTIONS.push({id,map,kind:'direction',from,to,dir,answers:[dir+'方'],origin,page});}
function addClaim(id,map,from,to,claimed,page){const dir=findDir(map,from,to);QUESTIONS.push({id,map,kind:'claim',from,to,dir,claimed,answers:[dir===claimed?'同意':'不同意'],origin:page?'ppt':'extra',page});}

function buildAdjust(){$('adjust').innerHTML='';TEAMS.forEach((t,i)=>{const label=document.createElement('label');label.innerHTML=t.icon+' 第'+(i+1)+'組<br>';const input=document.createElement('input');input.type='number';input.min='0';input.max='999';input.value=teamScore(i);input.setAttribute('aria-label','第'+(i+1)+'組分數');input.onchange=()=>{let n=Number(input.value);if(!Number.isInteger(n)||n<0||n>999){input.value=teamScore(i);return;}const earned=[...STATES.values()].filter(s=>s.solved&&s.team===i).reduce((n,s)=>n+s.points,0);TEAMS[i].adjust=n-earned;updateStats();saveGame()};label.append(input);$('adjust').append(label)});}

function drawCompassQuestion(q){const st=state(q),v=VECTORS[q.north],n=v.北,t=v[q.dir];let h='<rect x="15" y="15" width="970" height="970" rx="35" fill="#f0f8ff"/><g transform="translate(500 500)"><path d="M-190 0H190M0-190V190" stroke="#284f48" stroke-width="11" stroke-linecap="round"/>';h+=`<path d="M${n[0]*185-n[1]*22} ${n[1]*185+n[0]*22}L${n[0]*230} ${n[1]*230}L${n[0]*185+n[1]*22} ${n[1]*185-n[0]*22}" fill="#284f48"/><text x="${n[0]*305}" y="${n[1]*305+34}" text-anchor="middle" font-size="100" font-weight="900" fill="#147b9c">北</text><text x="${t[0]*305}" y="${t[1]*305+34}" text-anchor="middle" font-size="100" font-weight="900" fill="#ed9d28">${st.done?q.dir:'？'}</text></g>`;if(st.hint){h+='<defs><marker id="clockwiseHead" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ed3038"/></marker></defs><path class="clockwiseHint" d="M600 150 A365 365 0 0 1 850 400" fill="none" stroke="#ed3038" stroke-width="14" stroke-linecap="round" marker-end="url(#clockwiseHead)"/><path class="clockwiseHint" d="M850 600 A365 365 0 0 1 600 850" fill="none" stroke="#ed3038" stroke-width="14" stroke-linecap="round" marker-end="url(#clockwiseHead)"/><path class="clockwiseHint" d="M400 850 A365 365 0 0 1 150 600" fill="none" stroke="#ed3038" stroke-width="14" stroke-linecap="round" marker-end="url(#clockwiseHead)"/><path class="clockwiseHint" d="M150 400 A365 365 0 0 1 400 150" fill="none" stroke="#ed3038" stroke-width="14" stroke-linecap="round" marker-end="url(#clockwiseHead)"/><text x="500" y="960" text-anchor="middle" font-size="76" font-weight="900" fill="#a86c12" textLength="900" lengthAdjust="spacingAndGlyphs">北 → 東 → 南 → 西 → 北</text>';}$('map').innerHTML=h;$('map').setAttribute('aria-label','方向標示，北方朝'+({left:'左',right:'右',down:'下'}[q.north]));$('mapHeading').textContent='方向挑戰';$('mapFoot').textContent='看清北方，找出「？」的方向。';$('compassSide').innerHTML='';}




function rememberAnswer(){const states=JSON.parse(JSON.stringify([...STATES]));const entry=states.find(([id])=>id===current().id);if(entry)entry[1].selected=[];undoHistory.push({position,states,adjust:TEAMS.map(t=>t.adjust),from:$('showFrom').checked});if(undoHistory.length>20)undoHistory.shift();}
function undoAnswer(){cancelAutoNext();const before=undoHistory.pop();if(!before)return;if(celebrationTimer)clearTimeout(celebrationTimer);$('celebrate').classList.add('hidden');$('confetti').replaceChildren();STATES.clear();before.states.forEach(([id,st])=>STATES.set(id,st));before.adjust.forEach((v,i)=>TEAMS[i].adjust=v);position=before.position;$('showFrom').checked=before.from;render();saveGame();}
$('undoAnswer').onclick=undoAnswer;

$('home').onclick=()=>{hideFirstTurn();lastFirstTurnKey=null;cancelAutoNext();saveGame();$('celebrate').classList.add('hidden');$('confetti').replaceChildren();$('startScreen').classList.remove('hidden');$('startGame').focus()};
$('startGame').onclick=()=>{$('startScreen').classList.add('hidden');$('teacher').focus();lastFirstTurnKey=null;hideFirstTurn()};
$('roundSelect').onchange=e=>{const r=Number(e.target.value);const i=BANKS[bank].findIndex(id=>QUESTIONS.find(q=>q.id===id)?.round===r);if(i>=0)go(i)};$('check').onclick=submit;$('hint').onclick=hint;$('showFrom').onchange=()=>{drawMap();saveGame()};$('prev').onclick=()=>{if(position>0)go(position-1)};$('next').onclick=()=>{if(position<BANKS[bank].length-1)go(position+1);else showSummary()};$('picker').onchange=e=>{go(Number(e.target.value));$('settings').classList.add('hidden')};$('score').onclick=showSummary;$('closeSummary').onclick=()=>{$('overlay').classList.add('hidden');$('score').focus()};$('retry').onclick=()=>{const i=BANKS[bank].findIndex(id=>!STATES.get(id)?.done);if(i>=0){$('overlay').classList.add('hidden');go(i)}};$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.add('hidden')};$('teacher').onclick=openSettings;$('closeSettings').onclick=()=>{$('settings').classList.add('hidden');$('teacher').focus()};$('settings').onclick=e=>{if(e.target===$('settings'))$('settings').classList.add('hidden')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('overlay').classList.add('hidden');$('settings').classList.add('hidden')}});$('restart').onclick=()=>{cancelAutoNext();if(confirm('開始新一輪？這會清除答題紀錄。')){if(celebrationTimer)clearTimeout(celebrationTimer);$('celebrate').classList.add('hidden');$('confetti').replaceChildren();undoHistory=[];roundOrders={};STATES.clear();TEAMS.forEach(t=>t.adjust=0);position=0;selectedTeam=null;$('settings').classList.add('hidden');render();saveGame()}};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else setFeedback('可把裝置橫向使用，或加入主畫面。')}catch{setFeedback('可用瀏覽器全螢幕功能，或把裝置橫向使用。')}};restoreGame();render();

let compassDrag=null;
const mapPanel=document.querySelector('.mapPanel');
mapPanel.addEventListener('pointerdown',e=>{const ref=e.target.closest('.referenceHint'),side=e.target.closest('#compassSide');const el=ref||side;if(!el||!el.innerHTML)return;e.preventDefault();e.stopPropagation();const svg=ref?$('map'):null;compassDrag={el,svg,id:e.pointerId,x:e.clientX,y:e.clientY,base:ref?(ref.getAttribute('transform')||''):'',left:parseFloat(el.dataset.dragX||0),top:parseFloat(el.dataset.dragY||0)};mapPanel.setPointerCapture(e.pointerId);});
mapPanel.addEventListener('pointermove',e=>{const d=compassDrag;if(!d||e.pointerId!==d.id)return;e.preventDefault();if(d.svg){const matrix=d.svg.getScreenCTM().inverse();const a=new DOMPoint(d.x,d.y).matrixTransform(matrix),b=new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix);d.el.setAttribute('transform','translate('+(b.x-a.x)+' '+(b.y-a.y)+') '+d.base);}else{const scale=document.getElementById('raceViewport').getBoundingClientRect().width/1600;const x=d.left+(e.clientX-d.x)/scale,y=d.top+(e.clientY-d.y)/scale;d.el.style.translate=x+'px '+y+'px';d.el.dataset.dragX=x;d.el.dataset.dragY=y;}});
for(const type of ['pointerup','pointercancel','lostpointercapture'])mapPanel.addEventListener(type,e=>{if(compassDrag?.id===e.pointerId)compassDrag=null;});
</script></div></body></html>
