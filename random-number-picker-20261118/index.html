<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172e50">
<title>課堂隨機抽數字</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#3470ad,transparent 45%),linear-gradient(135deg,#142b4a,#1b3964);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:#173956}main{width:min(100%,740px);padding:clamp(24px,5vw,44px);border-radius:28px;background:#fff;text-align:center;box-shadow:0 25px 80px #06182b77}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.13em;color:#288095}h1{font-size:clamp(30px,5vw,42px);margin:12px 0}p{color:#5c7489;line-height:1.65}.range{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:24px 0}.range label{display:grid;gap:8px;text-align:left;font-size:15px;font-weight:750}.range input{width:135px;max-width:40vw;border:2px solid #d2e1eb;border-radius:12px;background:#f6fbfe;padding:12px;font-size:24px;text-align:center;color:#173956}.result{padding:18px;margin:26px auto 20px;border-radius:24px;background:linear-gradient(120deg,#e6f7fc,#d5f5e9)}.result small{display:block;font-size:15px;font-weight:800;color:#39758c}output{display:block;font-size:clamp(88px,16vw,144px);font-weight:850;line-height:1.2;color:#16688b;font-variant-numeric:tabular-nums}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:15px;padding:16px 24px;min-width:170px;font:inherit;font-size:19px;font-weight:800;cursor:pointer}button:focus-visible{outline:3px solid #f1a142;outline-offset:3px}.draw{background:#137e99;color:#fff}.reset{background:#e9f0f6;color:#325d75}.draw:disabled{background:#9aadb9;cursor:not-allowed}#status{min-height:26px;font-weight:750;color:#39657c;margin-top:20px}.tip{font-size:13px;margin-bottom:0}@media(max-width:440px){body{padding:10px}main{padding:22px 18px}.buttons{flex-direction:column}button{width:100%}} 
</style>
</head>
<body>
<main>
<div class="eyebrow">CLASSROOM TOOL · 課堂小工具</div>
<h1>🎲 隨機抽數字</h1>
<p>輸入範圍，隨機抽取數字；同一輪不會重複。</p>
<div class="range">
<label>最小數字<input id="min" type="number" inputmode="numeric" min="1" max="999" value="1"></label>
<label>最大數字<input id="max" type="number" inputmode="numeric" min="1" max="999" value="32"></label>
</div>
<div class="result"><small id="caption">準備抽取</small><output id="number" aria-live="polite">?</output></div>
<div class="buttons"><button id="draw" class="draw" type="button">🎯 抽一個</button><button id="reset" class="reset" type="button">↻ 重新開始</button></div>
<p id="status" role="status">尚未抽取</p>
<p class="tip">更改範圍會自動重新開始。支援手機、平板、電腦及離線使用。</p>
</main>
<script>
(() => {
"use strict";
const byId = id => document.getElementById(id);
const min = byId("min"), max = byId("max"), result = byId("number");
const button = byId("draw"), status = byId("status"), caption = byId("caption");
let bag = [], total = 0;
function reset() {
  const a = Number(min.value), b = Number(max.value);
  result.textContent = "?";
  caption.textContent = "準備抽取";
  total = 0;
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<1||b>999||a>b||b-a>499) {
    bag = [];button.disabled = true;
    status.textContent = "請輸入有效範圍：1 至 999，最多 500 個數字。";
    return;
  }
  bag = Array.from({length:b-a+1},(_,i)=>a+i);
  button.disabled = false;
  status.textContent = "共有 " + bag.length + " 個數字可抽";
}
function draw() {
  if(!bag.length) return;
  const i = Math.floor(Math.random()*bag.length);
  const n = bag[i];
  bag[i] = bag[bag.length-1];
  bag.pop();
  total++;
  result.textContent = String(n);
  caption.textContent = "本次抽中";
  status.textContent = bag.length ? "已抽 " + total + " 個，剩下 " + bag.length + " 個" : "🎉 全部抽完！按「重新開始」可再抽一輪。";
  button.disabled = bag.length === 0;
}
min.addEventListener("input",reset);
max.addEventListener("input",reset);
button.addEventListener("click",draw);
byId("reset").addEventListener("click",reset);
reset();
})();
</script>
</body>
</html>
