const $ = id => document.getElementById(id);

function openApp(lesson) {
  $('menu').hidden = true;
  $('viewer').hidden = false;
  $('shell').classList.add('viewing');
  $('brand').textContent = lesson.name;
  $('home').hidden = false;
  $('full').hidden = false;
  const frame = document.createElement('iframe');
  frame.title = lesson.name;
  frame.setAttribute('allow', 'fullscreen');
  frame.srcdoc = new TextDecoder().decode(Uint8Array.from(atob(lesson.html), c => c.charCodeAt(0)));
  $('viewer').replaceChildren(frame);
}

function home() {
  $('viewer').replaceChildren();
  $('viewer').hidden = true;
  $('menu').hidden = false;
  $('shell').classList.remove('viewing');
  $('brand').textContent = '🌈 小二數學教具';
  $('home').hidden = true;
  $('full').hidden = true;
}

for (const lesson of lessons) {
  const button = document.createElement('button');
  button.className = 'card';
  button.style.setProperty('--color', lesson.color);
  for (const [role, label] of [
    ['icon', lesson.icon],
    ['number', '第 ' + lesson.num + ' 課'],
    ['title', lesson.title],
    ['description', lesson.name === lesson.title ? '' : lesson.name],
  ]) {
    if (!label) continue;
    const span = document.createElement('span');
    span.className = role;
    span.textContent = label;
    button.append(span);
  }
  button.onclick = () => openApp(lesson);
  $('grid').append(button);
}

$('home').onclick = home;
$('full').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {}
};
document.addEventListener('dblclick', event => event.preventDefault(), { passive: false });
home();
</script></body></html>
