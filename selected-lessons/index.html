<!doctype html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>小二數學</title><style>
:root {
  color-scheme: light;
  font-family: ui-rounded, "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
  color: #25324d;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #fff9ed; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid #3157a3; outline-offset: 3px; }
[hidden] { display: none !important; }
.ios-blur-fix { position: fixed; pointer-events: none; width: 1px; height: 1px; opacity: .001; }

.shell {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(circle at 1px 1px, #e9dbc3 1px, transparent 1.1px) 15px 12px / 23px 23px,
    #fff9ed;
}
.bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 6px max(14px, env(safe-area-inset-right)) 6px max(14px, env(safe-area-inset-left));
  background: #fff;
}
.brand { margin-right: auto; font-size: 17px; font-weight: 900; line-height: 1.12; }
.nav {
  border: 0;
  border-radius: 12px;
  padding: 8px 12px;
  background: #edf3ff;
  font-size: 15px;
  font-weight: 750;
  white-space: nowrap;
}
.nav:hover { background: #dfe9ff; }

.shell:not(.viewing) .bar {
  position: relative;
  width: min(calc(100% - 48px), 1200px);
  min-height: 132px;
  margin: 26px auto 0;
  padding: 18px 32px;
  overflow: hidden;
  isolation: isolate;
  border: 3px solid #fff;
  border-radius: 34px;
  background: #d8ecff;
  box-shadow: 0 6px 0 #b9d8f1;
}
.shell:not(.viewing) .bar::before {
  content: '';
  position: absolute;
  z-index: -1;
  width: 380px;
  height: 380px;
  right: -82px;
  top: -122px;
  border: 25px solid #c2dffa;
  border-radius: 50%;
  opacity: .85;
}
.shell:not(.viewing) .brand { font-size: clamp(35px, 5.4vw, 65px); letter-spacing: .025em; }
.math-icon {
  display: grid;
  place-items: center;
  flex: 0 0 73px;
  height: 73px;
  margin-right: 7px;
  border: 3px solid #fff;
  border-radius: 25px;
  background: #fff0a7;
  box-shadow: 0 4px 0 #a3c3e1;
  font-size: 42px;
  line-height: 1;
  transform: rotate(-8deg);
}
.math-tiles { display: flex; align-items: center; gap: 14px; padding-right: 13px; }
.math-tiles span {
  display: grid;
  width: clamp(42px, 5.3vw, 72px);
  aspect-ratio: 1;
  place-items: center;
  border: 3px solid #fff;
  border-radius: 25%;
  box-shadow: 0 4px 0 #a3c3e1;
  color: #2f3b59;
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 950;
  line-height: 1;
}
.math-tiles span:nth-child(1) { background: #ffdbac; transform: rotate(-12deg); }
.math-tiles span:nth-child(2) { background: #dff5ca; transform: translateY(-9px) rotate(9deg); }
.math-tiles span:nth-child(3) { background: #f6d6ee; transform: translateY(7px) rotate(13deg); }
.viewing .math-icon, .viewing .math-tiles { display: none; }
.viewing .bar { border-bottom: 1px solid #e1e8f4; }
.viewer { flex: 1; min-height: 0; background: #fff; }
.viewer iframe { display: block; width: 100%; height: 100%; border: 0; }

.content {
  flex: 1;
  min-height: 0;
  overflow: auto;
  width: 100%;
  padding: 26px 24px 28px;
}
.grid {
  display: grid;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 19px 16px;
}
.card-entry { position: relative; display: flex; min-width: 0; }
.card {
  position: relative;
  isolation: isolate;
  width: 100%;
  min-height: 191px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 16px 15px 27px;
  border: 3px solid #fff;
  border-radius: 24px;
  overflow: hidden;
  text-align: left;
  background: var(--color);
  box-shadow: 0 5px 0 var(--rim);
  transition: transform .15s, box-shadow .15s;
}
.card::before, .card::after {
  content: '';
  pointer-events: none;
  position: absolute;
  z-index: -1;
  border-radius: 50%;
}
.card::before {
  top: -35px;
  right: -22px;
  width: 140px;
  height: 140px;
  border: 13px solid rgba(255,255,255,.43);
}
.card::after {
  top: 65px;
  right: 18px;
  width: 9px;
  height: 9px;
  background: #fff9;
  box-shadow: -101px -45px 0 -1px #fff9, -91px -10px 0 -2px #fff9, -6px 14px 0 -2px #fff9;
}
@media (hover: hover) {
  button.card:hover { transform: translateY(-3px); box-shadow: 0 8px 0 var(--rim); }
  button.card:hover .icon { transform: rotate(6deg) scale(1.08); }
}
button.card:active { transform: translateY(3px) scale(.985); box-shadow: 0 2px 0 var(--rim); transition-duration: .4s; }
.number {
  position: relative;
  margin: 0 0 30px;
  padding: 4px 10px;
  border-radius: 15px;
  background: #ffffffc4;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.2;
}
.title {
  position: relative;
  max-width: 100%;
  margin-top: 6px;
  font-size: clamp(19px, 2.2vw, 28px);
  font-weight: 900;
  line-height: 1.23;
  overflow-wrap: anywhere;
}
.card .icon {
  display: grid;
  position: absolute;
  top: 10px;
  right: 21px;
  width: 60px;
  height: 60px;
  place-items: center;
  border: 2px solid #fff;
  border-radius: 21px;
  background: var(--sticker);
  box-shadow: 2px 4px 0 var(--rim);
  font-size: 32px;
  line-height: 1;
  transform: rotate(-9deg);
  transition: transform .18s;
}
.card-entry:nth-child(even) .icon { transform: rotate(8deg); }
.card-actions {
  position: absolute;
  right: 9px;
  bottom: 7px;
  display: flex;
  gap: 1px;
}
.card-download, .card-copy {
  position: relative;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #334762;
}
:is(.card-download, .card-copy)::after { content: ''; position: absolute; inset: 5px; border-radius: 5px; background: #ffffffc4; }
:is(.card-download, .card-copy):is(:hover, :active)::after { background: #fff; }
:is(.card-download, .card-copy) svg { z-index: 1; width: 12px; height: 12px; pointer-events: none; }

.card-group {
  padding-bottom: 14px;
}
.card-group .number { margin-bottom: 18px; }
.card-group .title { margin: 0 0 12px; }
.lesson-apps { display: grid; gap: 6px; width: 100%; }
.lesson-app {
  display: flex;
  align-items: center;
  min-width: 0;
  border-radius: 12px;
  background: #ffffffaa;
}
.lesson-open {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  padding: 6px 0 6px 10px;
  border: 0;
  border-radius: 12px 0 0 12px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: 750;
  line-height: 1.25;
  text-align: left;
  overflow-wrap: anywhere;
}
.lesson-open:hover { background: #fff8; }
.lesson-open:active { background: #fff; }
.lesson-app .card-actions {
  position: static;
  flex: 0 0 auto;
  margin-right: 3px;
}
.lesson-app :is(.card-download, .card-copy) {
  width: 34px;
  height: 38px;
}
.lesson-app :is(.card-download, .card-copy)::after { inset: 7px 4px; }
.lesson-app :is(.card-download, .card-copy) svg { width: 15px; height: 15px; }

@media (max-width: 890px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .title { font-size: clamp(19px, 3.2vw, 26px); }
}
@media (max-width: 560px) {
  .shell:not(.viewing) .bar {
    width: calc(100% - 24px);
    min-height: 90px;
    margin-top: 13px;
    padding: 10px 13px;
    gap: 8px;
    border-radius: 24px;
  }
  .shell:not(.viewing) .bar::before { right: -229px; }
  .shell:not(.viewing) .brand { font-size: clamp(28px, 7.4vw, 38px); }
  .math-icon { flex-basis: 44px; height: 44px; font-size: 26px; border-radius: 15px; margin-right: 0; }
  .math-tiles { gap: 4px; padding: 0; }
  .math-tiles span { width: 30px; font-size: 22px; border-width: 2px; }
  .math-tiles span:nth-child(3) { display: none; }
  .content { padding: 19px 12px 20px; }
  .grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .card { min-height: 165px; padding: 13px 10px 26px; border-radius: 20px; }
  .card .icon { width: 42px; height: 42px; top: 9px; right: 12px; border-radius: 14px; font-size: 23px; }
  .number { margin-bottom: 20px; padding: 3px 6px; font-size: 11px; }
  .title { font-size: clamp(16px, 4.6vw, 22px); }
  .card-actions { right: 5px; bottom: 4px; }
  button.card { min-height: 118px; }
  .card-group { padding: 13px 10px 12px; }
  .card-group .number { margin-bottom: 14px; }
  .viewing .brand { font-size: 14px; }
}
@media (min-width: 891px) and (max-height: 660px) {
  .shell:not(.viewing) .bar { min-height: 98px; margin-top: 15px; padding-block: 10px; }
  .shell:not(.viewing) .brand { font-size: 47px; }
  .math-icon { flex-basis: 57px; height: 57px; font-size: 32px; }
  .content { padding-top: 19px; }
  .grid { row-gap: 14px; }
  .card { min-height: 158px; }
  .card .icon { width: 47px; height: 47px; font-size: 26px; }
  .number { margin-bottom: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .card .icon { transition: none; }
}
.card-copy .tick-icon, .card-copy.copied .link-icon { display: none; }
.card-copy.copied .tick-icon { display: block; color: #18734e; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style></head><body><div class="ios-blur-fix" aria-hidden="true"></div><div class="shell" id="shell"><header class="bar" id="toolbar"><span class="math-icon" aria-hidden="true">🧮</span><span class="brand" id="brand">小二數學</span><div class="math-tiles" aria-hidden="true"><span>＋</span><span>×</span><span>△</span></div><button class="nav" id="full" hidden>⛶ 全螢幕</button><button class="nav" id="home" hidden>⌂ 首頁</button></header><main class="content" id="menu" aria-label="小二數學教具選集"><div class="grid" id="grid"></div><div id="copy-status" class="visually-hidden" role="status"></div></main><section class="viewer" id="viewer" hidden aria-label="教學 App"></section></div><script>
const lessons=[{"num": 7, "title": "認識及比較角", "name": "認識及比較角", "icon": "📐", "url": "https://hkluiml.github.io/maths-app/selected-lessons/apps/compare-angles/", "path": "apps/compare-angles/index.html"}, {"num": 8, "title": "直角、銳角和鈍角", "name": "直角、銳角和鈍角", "icon": "🔺", "url": "https://hkluiml.github.io/maths-app/selected-lessons/apps/types-of-angles/", "path": "apps/types-of-angles/index.html"}, {"num": 9, "title": "垂直線", "name": "垂直線", "icon": "📏", "url": "https://hkluiml.github.io/maths-app/selected-lessons/apps/perpendicular-lines/", "path": "apps/perpendicular-lines/index.html"}, {"num": 10, "title": "四個主要方向", "name": "方向轉轉樂", "icon": "🧭", "url": "https://hkluiml.github.io/maths-app/selected-lessons/apps/four-directions/", "path": "apps/four-directions/index.html"}, {"num": 10, "title": "方向尋寶大賽", "name": "方向尋寶大賽", "icon": "💎", "url": "https://hkluiml.github.io/maths-app/direction-treasure/", "path": "../direction-treasure/index.html"}, {"num": 10, "title": "地圖方向探險隊", "name": "地圖方向探險隊", "icon": "🗺️", "url": "https://hkluiml.github.io/maths-app/direction-explorers/", "path": "../direction-explorers/index.html"}, {"num": 12, "title": "乘法的計算（一）", "name": "乘法分組操作台", "icon": "🔢", "url": "https://hkluiml.github.io/maths-app/selected-lessons/apps/multiplication-groups/", "path": "apps/multiplication-groups/index.html"}, {"num": 12, "title": "10、5、2、3、4 的乘法遊戲", "name": "10、5、2、3、4 的乘法遊戲", "icon": "🎮", "url": "https://hkluiml.github.io/maths-app/selected-lessons/apps/multiplication-mix/", "path": "apps/multiplication-mix/index.html"}, {"num": 12, "title": "4 的乘法遊戲", "name": "4 的乘法遊戲", "icon": "🏰", "url": "https://hkluiml.github.io/maths-app/selected-lessons/apps/multiplication-4/", "path": "apps/multiplication-4/index.html"}, {"num": 13, "title": "6 的乘法遊戲", "name": "6 的乘法遊戲", "icon": "🧩", "url": "https://hkluiml.github.io/maths-app/selected-lessons/apps/multiplication-6/", "path": "apps/multiplication-6/index.html"}];

const $ = id => document.getElementById(id);

function openApp(lesson) {
  $('menu').hidden = true;
  $('viewer').hidden = false;
  $('shell').classList.add('viewing');
  $('brand').textContent = lesson.name;
  $('toolbar').hidden = false;
  $('home').hidden = false;
  $('full').hidden = false;
  const frame = document.createElement('iframe');
  frame.title = lesson.name;
  frame.setAttribute('allow', 'fullscreen');
  frame.src = lesson.path;
  $('viewer').replaceChildren(frame);
}

function home() {
  $('viewer').replaceChildren();
  $('viewer').hidden = true;
  $('menu').hidden = false;
  $('shell').classList.remove('viewing');
  $('brand').textContent = '小二數學';
  $('home').hidden = true;
  $('full').hidden = true;
}

const cardPalettes = {
  7: ['#dff4e8', '#aacdba', '#f8e2a4'],
  8: ['#ffebce', '#e3bd93', '#ffd0ae'],
  9: ['#eee4ff', '#c9b8e8', '#d3cbff'],
  10: ['#dcefff', '#a9cce9', '#fff1ad'],
  12: ['#edf4cb', '#c4cf9a', '#d4eec3'],
  13: ['#d9f4ef', '#a2ccc5', '#d4f0b7'],
};

function createActions(lesson) {
  const download = document.createElement('button');
  download.type = 'button';
  download.className = 'card-download';
  download.title = '下載 HTML';
  download.setAttribute('aria-label', '下載「' + lesson.name + '」HTML');
  download.innerHTML = '<svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m-3-3 3 3 3-3M3 12v2h10v-2"/></svg>';
  download.onclick = () => {
    const link = document.createElement('a');
    link.href = lesson.path;
    link.download = lesson.name + '.html';
    document.body.append(link);
    link.click();
    link.remove();
  };

  const copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'card-copy';
  copy.title = '複製連結';
  copy.setAttribute('aria-label', '複製「' + lesson.name + '」連結');
  copy.innerHTML = '<svg class="link-icon" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.4 9.6l3.2-3.2M8.5 4.8l1.8-1.8a2.1 2.1 0 0 1 3 3l-1.8 1.8M7.5 11.2 5.7 13a2.1 2.1 0 0 1-3-3l1.8-1.8"/></svg><svg class="tick-icon" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3 3 7-7"/></svg>';
  let copyFeedback;
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(lesson.url);
    } catch {
      window.prompt('複製連結', lesson.url);
      return;
    }
    copy.classList.add('copied');
    copy.title = '已複製連結';
    $('copy-status').textContent = '已複製「' + lesson.name + '」連結';
    clearTimeout(copyFeedback);
    copyFeedback = setTimeout(() => {
      copy.classList.remove('copied');
      copy.title = '複製連結';
      $('copy-status').textContent = '';
    }, 1600);
  };
  const actions = document.createElement('div');
  actions.className = 'card-actions';
  actions.append(download, copy);
  return actions;
}

const appsByLesson = new Map();
for (const lesson of lessons) {
  if (!appsByLesson.has(lesson.num)) appsByLesson.set(lesson.num, []);
  appsByLesson.get(lesson.num).push(lesson);
}

for (const [number, apps] of appsByLesson) {
  const [firstApp] = apps;
  const grouped = apps.length > 1;
  const [color, rim, sticker] = cardPalettes[number];
  const entry = document.createElement('div');
  entry.className = 'card-entry';

  const card = document.createElement(grouped ? 'article' : 'button');
  card.className = grouped ? 'card card-group' : 'card';
  card.style.setProperty('--color', color);
  card.style.setProperty('--rim', rim);
  card.style.setProperty('--sticker', sticker);

  for (const [role, label] of [
    ['icon', firstApp.icon],
    ['number', '第 ' + number + ' 課'],
    ['title', firstApp.title],
  ]) {
    const element = document.createElement(grouped && role === 'title' ? 'h2' : 'span');
    element.className = role;
    if (role === 'icon') element.setAttribute('aria-hidden', 'true');
    element.textContent = label;
    card.append(element);
  }

  entry.append(card);
  if (grouped) {
    const appList = document.createElement('div');
    appList.className = 'lesson-apps';
    for (const app of apps) {
      const row = document.createElement('div');
      row.className = 'lesson-app';
      const open = document.createElement('button');
      open.type = 'button';
      open.className = 'lesson-open';
      open.textContent = app.name;
      open.onclick = () => openApp(app);
      row.append(open, createActions(app));
      appList.append(row);
    }
    card.append(appList);
  } else {
    card.type = 'button';
    card.onclick = () => openApp(firstApp);
    entry.append(createActions(firstApp));
  }
  $('grid').append(entry);
}

$('home').onclick = home;
$('full').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {}
};
document.addEventListener('dblclick', event => event.preventDefault(), { passive: false });
home();
</script></body></html>
