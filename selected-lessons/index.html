<!doctype html>
<html lang="zh-HK" data-immersive-translate-page-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#50689b">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小二數學">
<title>小二數學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&text=%E7%9B%B4%E7%9C%9F&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  /* 可愛圓潤字體組合：Fredoka（圓潤英數）＋ Noto Sans HK 鎖定「直、真」香港標準字形 ＋ Chiron GoRound TC 昭源圓體 ＋ 備援 */
  --font-cute: "Fredoka", "Noto Sans HK", "Chiron GoRound TC", "Chiron Hei HK", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
  --ink: #32233b;
  --ink-soft: #5a4663;
  --focus-ring: #ff8c42;
  --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-pop: cubic-bezier(0.34, 1.48, 0.64, 1);
  font-family: var(--font-cute);
  color: var(--ink);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body, html {
  height: 100%;
  margin: 0;
}

body {
  background: #5c6ca1;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

.ios-blur-fix {
  position: fixed;
  pointer-events: none;
  width: 1px;
  height: 1px;
  opacity: .001;
}

/* Minecraft 光影模組（BSL / Complementary Shaders）多彩黃金晚霞天空 */
.shell {
  position: relative;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  isolation: isolate;
  background:
    radial-gradient(ellipse 74% 50% at 80% 82%, rgba(255, 232, 158, 0.94) 0%, rgba(255, 184, 122, 0.56) 36%, transparent 72%),
    radial-gradient(ellipse 62% 44% at 18% 12%, rgba(120, 178, 240, 0.45) 0%, transparent 62%),
    radial-gradient(ellipse 60% 42% at 18% 92%, rgba(255, 166, 158, 0.48) 0%, transparent 64%),
    linear-gradient(
      180deg,
      #4f6ba8 0%,
      #7c7db8 22%,
      #bd8eb3 46%,
      #ee9f88 72%,
      #ffd08a 91%,
      #ffe8b8 100%
    );
}

/* Minecraft 日落光影場景層：方塊太陽、體積光束、方塊雲、遠山剪影、漂浮金光微粒 */
.shader-sky {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

/* 方塊日落太陽與多層柔和光暈（Bloom） */
.mc-sun-wrap {
  position: absolute;
  right: 10.5%;
  bottom: 12.5%;
  width: 124px;
  height: 124px;
  display: grid;
  place-items: center;
}

.mc-sun-bloom {
  position: absolute;
  inset: -195px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255, 250, 212, 0.88) 0%,
    rgba(255, 210, 128, 0.52) 28%,
    rgba(252, 148, 114, 0.24) 54%,
    transparent 74%
  );
  filter: blur(8px);
  animation: sunBreathe 7s ease-in-out infinite alternate;
}

.mc-sun-halo {
  position: absolute;
  inset: -18px;
  border-radius: 8px;
  background: rgba(255, 244, 192, 0.45);
  box-shadow: 0 0 44px 14px rgba(255, 210, 128, 0.7);
}

.mc-sun-core {
  position: relative;
  width: 82px;
  height: 82px;
  border-radius: 4px;
  background: linear-gradient(180deg, #fffef2 0%, #fff1b0 55%, #ffcb6b 100%);
  box-shadow:
    inset 0 0 0 6px rgba(255, 255, 255, 0.58),
    0 0 30px 6px rgba(255, 245, 196, 0.92);
}

/* 體積光束（Volumetric God Rays）從日落處斜灑向整個畫面 */
.god-ray {
  position: absolute;
  right: -4%;
  bottom: -18%;
  width: 125%;
  height: 145%;
  transform-origin: 85% 84%;
  background:
    conic-gradient(
      from 225deg at 84% 82%,
      transparent 0deg,
      rgba(255, 242, 196, 0.26) 10deg,
      transparent 20deg,
      rgba(255, 224, 180, 0.18) 32deg,
      transparent 44deg,
      rgba(255, 244, 208, 0.24) 58deg,
      transparent 72deg,
      rgba(255, 218, 174, 0.16) 86deg,
      transparent 102deg,
      transparent 360deg
    );
  filter: blur(14px);
  animation: raySway 12s ease-in-out infinite alternate;
}

/* Minecraft 立體方塊雲層 */
.mc-cloud {
  position: absolute;
  border-radius: 4px;
  background: linear-gradient(180deg, rgba(255, 238, 244, 0.68) 0%, rgba(255, 214, 186, 0.76) 66%, rgba(255, 182, 130, 0.86) 100%);
  box-shadow:
    inset 0 3px 0 rgba(255, 252, 250, 0.62),
    0 6px 0 rgba(126, 78, 114, 0.16),
    0 12px 24px rgba(96, 56, 94, 0.14);
}

.mc-cloud::before,
.mc-cloud::after {
  content: '';
  position: absolute;
  border-radius: 3px;
  background: inherit;
}

.mc-cloud.c1 {
  top: 7%;
  left: 6%;
  width: 170px;
  height: 26px;
  opacity: 0.76;
  animation: cloudDrift 48s linear infinite alternate;
}
.mc-cloud.c1::before { width: 92px; height: 18px; top: -12px; left: 26px; }
.mc-cloud.c1::after { width: 64px; height: 14px; top: 10px; right: -22px; opacity: 0.86; }

.mc-cloud.c2 {
  top: 15%;
  right: 16%;
  width: 210px;
  height: 28px;
  opacity: 0.8;
  animation: cloudDrift 60s linear infinite alternate-reverse;
}
.mc-cloud.c2::before { width: 112px; height: 20px; top: -14px; left: 48px; }
.mc-cloud.c2::after { width: 78px; height: 16px; top: 8px; left: -28px; opacity: 0.86; }

.mc-cloud.c3 {
  top: 30%;
  left: 34%;
  width: 124px;
  height: 18px;
  opacity: 0.48;
  animation: cloudDrift 54s linear infinite alternate;
}
.mc-cloud.c3::before { width: 62px; height: 13px; top: -9px; left: 22px; }

/* 遠方低對比方塊地形剪影 */
.voxel-horizon {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 148px;
  opacity: 0.5;
}

/* 空氣中緩慢升起的金光方塊微粒 */
.mote {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 1.5px;
  background: #fff7cf;
  box-shadow: 0 0 10px 3px rgba(255, 224, 138, 0.85);
  opacity: 0.75;
  animation: moteFloat 9s ease-in-out infinite alternate;
}
.mote.m1 { left: 10%; bottom: 22%; animation-delay: 0s; }
.mote.m2 { left: 26%; bottom: 14%; width: 5px; height: 5px; animation-delay: -2.4s; }
.mote.m3 { left: 52%; bottom: 18%; width: 7px; height: 7px; animation-delay: -4.2s; }
.mote.m4 { right: 24%; bottom: 26%; width: 5px; height: 5px; animation-delay: -1.5s; }
.mote.m5 { right: 8%; bottom: 38%; width: 6px; height: 6px; animation-delay: -3.1s; }
.mote.m6 { left: 72%; top: 24%; width: 4px; height: 4px; opacity: 0.58; animation-delay: -5s; }

.viewing .shader-sky {
  display: none;
}

/* 頂部工具列基礎 */
.bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 50px;
  padding: 6px max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left));
  background: #fffaf5;
}

.brand {
  margin-right: auto;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--ink);
  letter-spacing: 0.03em;
}

/* 立體按鍵感按鈕（全螢幕 / 首頁） */
.nav {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1.5px solid rgba(255, 250, 242, 0.98);
  border-radius: 14px;
  padding: 7px 14px;
  background: linear-gradient(180deg, #ffffff 0%, #f5e8ff 100%);
  box-shadow:
    inset 0 2px 0 #ffffff,
    0 4px 0 #d5c1e8,
    0 6px 12px rgba(74, 46, 82, 0.14);
  font-size: 14.5px;
  font-weight: 700;
  color: #4a3554;
  white-space: nowrap;
  transition: transform .18s var(--ease-pop), box-shadow .18s ease, background .18s ease;
}

.nav:hover {
  transform: translateY(-2px);
  background: #ffffff;
  box-shadow:
    inset 0 2px 0 #ffffff,
    0 6px 0 #d5c1e8,
    0 10px 18px rgba(74, 46, 82, 0.18);
}

.nav:active {
  transform: translateY(3px);
  box-shadow:
    inset 0 1px 0 #ffffff,
    0 1px 0 #d5c1e8,
    0 2px 6px rgba(74, 46, 82, 0.14);
}

#home {
  background: linear-gradient(180deg, #fff6d4 0%, #ffcf75 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.92),
    0 4px 0 #dfa145,
    0 6px 12px rgba(140, 82, 26, 0.18);
  color: #5c3114;
}

#home:hover {
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.95),
    0 6px 0 #dfa145,
    0 10px 18px rgba(140, 82, 26, 0.22);
}

#home:active {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    0 1px 0 #dfa145,
    0 2px 6px rgba(140, 82, 26, 0.16);
}

/* 首頁立體日落粉彩厚層玻璃看板 */
.shell:not(.viewing) .bar {
  position: relative;
  width: min(calc(100% - 48px), 1160px);
  min-height: 128px;
  margin: 24px auto 0;
  padding: 18px 34px;
  overflow: hidden;
  isolation: isolate;
  border: 2.5px solid rgba(255, 253, 248, 0.96);
  border-radius: 28px;
  background:
    linear-gradient(
      118deg,
      #ebf6ff 0%,
      #fff3f7 48%,
      #ffeecc 100%
    );
  /* 厚實 3D 底座邊緣 + 頂部鏡面高光 + 浮空柔影 */
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, 0.96),
    inset 0 -4px 0 rgba(230, 186, 174, 0.38),
    0 7px 0 rgba(212, 168, 176, 0.88),
    0 18px 36px -8px rgba(56, 30, 74, 0.30),
    0 6px 14px rgba(56, 30, 74, 0.14);
}

/* 看板斜射高光層 */
.shell:not(.viewing) .bar::before {
  content: '';
  position: absolute;
  z-index: -1;
  inset: 0;
  background: linear-gradient(
    112deg,
    rgba(255, 255, 255, 0.62) 0%,
    rgba(255, 255, 255, 0.14) 34%,
    transparent 54%,
    rgba(255, 224, 162, 0.36) 100%
  );
  pointer-events: none;
}

/* 看板右下角暖陽柔光暈 */
.shell:not(.viewing) .bar::after {
  content: '';
  position: absolute;
  z-index: -1;
  width: 320px;
  height: 320px;
  right: -70px;
  bottom: -150px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 214, 138, 0.68) 0%, rgba(255, 174, 134, 0.18) 55%, transparent 74%);
  pointer-events: none;
}

/* 主標題：平面清晰、無描邊與立體投影 */
.shell:not(.viewing) .brand {
  display: inline-flex;
  align-items: center;
  font-size: clamp(34px, 4.8vw, 54px);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #3a2542;
}

/* 左側立體算盤方塊徽章 */
.math-icon {
  display: grid;
  place-items: center;
  flex: 0 0 70px;
  height: 70px;
  margin-right: 4px;
  border: 2.5px solid rgba(255, 254, 248, 0.98);
  border-radius: 22px;
  background: linear-gradient(155deg, #fff7cc 0%, #ffc45c 100%);
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, 0.94),
    inset 0 -3px 0 rgba(224, 146, 52, 0.35),
    0 6px 0 #dc993e,
    0 14px 24px -6px rgba(154, 88, 34, 0.38);
  font-size: 38px;
  line-height: 1;
  text-shadow: 0 3px 5px rgba(126, 68, 18, 0.26);
  transform: rotate(-5deg);
  transition: transform .26s var(--ease-pop), box-shadow .26s ease;
}

.shell:not(.viewing) .bar:hover .math-icon {
  transform: rotate(2deg) translateY(-3px) scale(1.06);
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, 0.96),
    inset 0 -3px 0 rgba(224, 146, 52, 0.35),
    0 8px 0 #dc993e,
    0 18px 28px -6px rgba(154, 88, 34, 0.42);
}

/* 右側立體積木感柔彩數學方塊（＋、×、△） */
.math-tiles {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-right: 8px;
  margin-right: 60px;
}

.math-tiles span {
  display: grid;
  width: clamp(42px, 4.6vw, 58px);
  aspect-ratio: 1;
  place-items: center;
  border: 2.2px solid rgba(255, 254, 250, 0.96);
  border-radius: 17px;
  color: #ffffff;
  font-size: clamp(23px, 3vw, 34px);
  font-weight: 700;
  line-height: 1;
  transition: transform .28s var(--ease-pop), box-shadow .28s ease;
}

.math-tiles span:first-child {
  background: linear-gradient(155deg, #ffa4b8 0%, #ee6b8d 100%);
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, 0.72),
    inset 0 -3px 0 rgba(196, 64, 102, 0.32),
    0 5px 0 #cf5275,
    0 12px 18px -5px rgba(176, 56, 94, 0.32);
  transform: rotate(-7deg);
}

.math-tiles span:nth-child(2) {
  background: linear-gradient(155deg, #91d5ff 0%, #52a4eb 100%);
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, 0.72),
    inset 0 -3px 0 rgba(48, 122, 196, 0.32),
    0 5px 0 #3f88cb,
    0 12px 18px -5px rgba(46, 110, 178, 0.32);
  transform: translateY(-6px) rotate(5deg);
}

.math-tiles span:nth-child(3) {
  background: linear-gradient(155deg, #92e4b8 0%, #4db884 100%);
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, 0.72),
    inset 0 -3px 0 rgba(42, 138, 92, 0.32),
    0 5px 0 #3a9c6d,
    0 12px 18px -5px rgba(42, 134, 92, 0.32);
  transform: translateY(5px) rotate(8deg);
}

.shell:not(.viewing) .bar:hover .math-tiles span:first-child { transform: rotate(-2deg) translateY(-4px); }
.shell:not(.viewing) .bar:hover .math-tiles span:nth-child(2) { transform: translateY(-10px) rotate(1deg); }
.shell:not(.viewing) .bar:hover .math-tiles span:nth-child(3) { transform: translateY(1px) rotate(3deg); }

/* 看板右下角整體下載／複製按鈕 */
.portal-actions .card-actions {
  right: 16px;
  bottom: 14px;
  gap: 5px;
}

.portal-actions :is(.card-download, .card-copy, .card-share) {
  width: 36px;
  height: 36px;
}

.portal-actions :is(.card-download, .card-copy, .card-share)::after {
  inset: 2px;
  border-radius: 10px;
}

.portal-actions :is(.card-download, .card-copy, .card-share) svg {
  width: 15px;
  height: 15px;
}

.portal-actions button:disabled {
  opacity: .55;
  cursor: wait;
}

/* 教學 App 檢視模式 */
.viewing .math-icon,
.viewing .math-tiles,
.viewing .portal-actions {
  display: none;
}

.viewing .bar {
  height: 60px;
  min-height: 60px;
  padding: 6px max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left));
  gap: 8px;
  background: linear-gradient(90deg, #ebf6ff 0%, #fceef5 52%, #fff5e2 100%);
  border-bottom: 1.5px solid rgba(196, 152, 168, 0.35);
  box-shadow: 0 6px 20px rgba(74, 46, 78, 0.08);
  z-index: 10;
}

.viewing .brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  color: var(--ink);
}

.viewer {
  flex: 1;
  min-height: 0;
  background: #ffffff;
}

.viewer iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

/* 主內容捲動區 */
.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  width: 100%;
  padding: 30px 24px 52px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 240, 214, 0.65) transparent;
}

.content::-webkit-scrollbar { width: 7px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: rgba(255, 240, 214, 0.65); border-radius: 999px; }

/* 課程卡片網格 */
.grid {
  display: grid;
  width: 100%;
  max-width: 1160px;
  margin: 0 auto;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px 22px;
}

.card-entry {
  position: relative;
  display: flex;
  min-width: 0;
  animation: cardRise .52s var(--ease-soft) backwards;
}

.card-entry:nth-child(1) { animation-delay: .04s; }
.card-entry:nth-child(2) { animation-delay: .09s; }
.card-entry:nth-child(3) { animation-delay: .14s; }
.card-entry:nth-child(4) { animation-delay: .19s; }
.card-entry:nth-child(5) { animation-delay: .24s; }
.card-entry:nth-child(6) { animation-delay: .29s; }

/* 3D 實體厚度感柔彩日落玻璃卡片：頂面高光 + 底部立體厚邊 + 懸浮按壓物理回饋 */
.card {
  position: relative;
  isolation: isolate;
  width: 100%;
  min-height: 192px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 20px 20px 38px;
  border: 2.5px solid rgba(255, 253, 249, 0.96);
  border-radius: 26px;
  overflow: hidden;
  text-align: left;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  /* 清晰立體底座厚邊（7px）＋ 內層高光反光 ＋ 底部環境陰影 ＋ 日落柔光 */
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, 0.96),
    inset 0 -4px 0 var(--inner-lip),
    0 7px 0 var(--edge),
    0 18px 34px -8px rgba(48, 24, 66, 0.30),
    0 8px 20px -4px var(--glow);
  transition: transform .22s var(--ease-pop), box-shadow .22s var(--ease-soft), border-color .22s ease, filter .22s ease;
}

/* 卡片頂端立體柔彩光條 */
.card::before {
  content: '';
  pointer-events: none;
  position: absolute;
  left: 22px;
  top: 0;
  width: 68px;
  height: 6px;
  border-radius: 0 0 9px 9px;
  background: var(--accent);
  box-shadow:
    inset 0 -1.5px 0 rgba(0, 0, 0, 0.14),
    0 2px 6px var(--glow);
  opacity: 0.94;
  transition: width .28s var(--ease-soft), opacity .28s ease;
}

/* 卡片內部右上角夕陽柔光暈 */
.card::after {
  content: '';
  pointer-events: none;
  position: absolute;
  z-index: -1;
  top: -46px;
  right: -36px;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 254, 246, 0.90) 0%, rgba(255, 246, 220, 0.32) 54%, transparent 74%);
  transition: transform .4s var(--ease-soft), opacity .35s ease;
}

@media (hover: hover) {
  button.card:hover {
    transform: translateY(-5px);
    border-color: #ffffff;
    filter: brightness(1.02);
    box-shadow:
      inset 0 3.5px 0 #ffffff,
      inset 0 -4px 0 var(--inner-lip),
      0 11px 0 var(--edge),
      0 26px 46px -10px rgba(48, 24, 66, 0.36),
      0 10px 28px var(--glow);
  }
  button.card:hover::before {
    width: 98px;
    opacity: 1;
  }
  button.card:hover::after {
    transform: scale(1.18) translate(-5px, 5px);
  }
  button.card:hover .icon {
    transform: translateY(-4px) rotate(5deg) scale(1.09);
    box-shadow:
      inset 0 3px 0 rgba(255, 255, 255, 0.96),

];

function loadSubappFonts(doc) {
  for (const href of subappFontUrls) {
    const link = doc.createElement('link');
    link.rel = 'stylesheet';
    // Apply the custom fonts when ready without blocking the app's first paint.
    link.media = 'print';
    link.addEventListener('load', () => { link.media = 'all'; }, { once: true });
    link.href = href;
    doc.head.append(link);
  }
}

function injectPolishIntoDoc(doc) {
  if (!doc || !doc.head || doc.getElementById('sunset-cute-polish')) return;
  const st = doc.createElement('style');
  st.id = 'sunset-cute-polish';
  st.textContent = SUBAPP_POLISH_CSS;
  doc.head.append(st);
  loadSubappFonts(doc);

  const attachChildFrames = () => {
    doc.querySelectorAll('iframe').forEach(subFrame => {

      const applySub = () => {
        try {

      subFrame.addEventListener('load', applySub);
      applySub();

  const bar = child.createElement('div');

function htmlBlobUrl(html) {
  return URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
}

function embeddedJson(value) {
  return JSON.stringify(value).replace(/</g, '\\u003c');
}

async function bundleActivity(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error('Unable to open activity');
  const page = new DOMParser().parseFromString(await response.text(), 'text/html');
  const embedded = page.getElementById('embedded-apps');
  const sources = [...page.querySelectorAll('[data-source]')];
  if (!embedded || !sources.length) throw new Error('Activity sources are missing');
  const documents = await Promise.all(sources.map(async source => {
    const result = await fetch(new URL(source.dataset.source, response.url));
    if (!result.ok) throw new Error('Unable to load activity source');
    return result.text();
  }));
  embedded.textContent = embeddedJson(documents);
  return '<!doctype html>\n' + page.documentElement.outerHTML;
}

async function activityDocument(lesson) {
  if (lesson.document) return lesson.document;
  if (lesson.bundle) return bundleActivity(lesson.path);
  const response = await fetch(lesson.path);
  if (!response.ok) throw new Error('Unable to load activity');
  return response.text();
}

async function downloadPortal() {
  const page = document.documentElement.cloneNode(true);
  page.querySelectorAll('link[rel=manifest], link[rel=apple-touch-icon]').forEach(link => link.remove());
  for (const id of ['grid', 'viewer', 'copy-status', 'portal-actions', 'offline-status']) {
    page.querySelector('#' + id).replaceChildren();
  }
  if (lessons.some(lesson => !lesson.document)) {
    const offlineLessons = await Promise.all(lessons.map(async lesson => ({
      ...lesson,
      document: await activityDocument(lesson),
    })));
    const script = page.querySelector('#portal-script');
    script.textContent = script.textContent.replace(/^const lessons=.*;$/m, () =>
      'const lessons=' + embeddedJson(offlineLessons) + ';'
    );
  }
  return htmlBlobUrl('<!doctype html>\n' + page.outerHTML);
}

function createActions(lesson, downloadPage, includeShare = false) {
  const download = document.createElement('button');
  download.type = 'button';
  download.className = 'card-download';
  download.title = '下載 HTML';
  download.setAttribute('aria-label', '下載「' + lesson.name + '」HTML');
  download.innerHTML = '<svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m-3-3 3 3 3-3M3 12v2h10v-2"/></svg>';
  download.onclick = async () => {
    let href = lesson.path;
    if (downloadPage || lesson.document || lesson.bundle) {
      download.disabled = true;
      try {
        href = downloadPage ? await downloadPage() : htmlBlobUrl(await activityDocument(lesson));
      } catch {
        $('copy-status').textContent = '下載失敗，請再試一次。';
        return;
      } finally {
        download.disabled = false;
      }
    }
    const link = document.createElement('a');
    link.href = href;
    link.download = lesson.name + '.html';
    document.body.append(link);
    link.click();
    link.remove();
    $('copy-status').textContent = '已下載「' + lesson.name + '.html」';
    setTimeout(() => { $('copy-status').textContent = ''; }, 2000);
    if (href.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(href), 30000);
  };

  const copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'card-copy';
  copy.title = '複製連結';
  copy.setAttribute('aria-label', '複製「' + lesson.name + '」連結');
  copy.innerHTML = '<svg class="link-icon" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.4 9.6l3.2-3.2M8.5 4.8l1.8-1.8a2.1 2.1 0 0 1 3 3l-1.8 1.8M7.5 11.2 5.7 13a2.1 2.1 0 0 1-3-3l1.8-1.8"/></svg><svg class="tick-icon" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3 3 7-7"/></svg>';
  let copyFeedback;
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(lesson.url);
    } catch {
      window.prompt('複製連結', lesson.url);
      return;
    }
    copy.classList.add('copied');
    copy.title = '已複製';
    $('copy-status').textContent = '已複製連結';
    clearTimeout(copyFeedback);
    copyFeedback = setTimeout(() => {
      copy.classList.remove('copied');
      copy.title = '複製連結';
      $('copy-status').textContent = '';
    }, 1600);
  };
  let share = null;
  if (includeShare) {
    share = document.createElement('button');
    share.type = 'button';
    share.className = 'card-share';
    share.title = '分享連結';
    share.setAttribute('aria-label', '分享「' + lesson.name + '」');
    share.innerHTML = '<svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2m-3 3 3-3 3 3M3 8v5h10V8"/></svg>';
    share.onclick = async () => {
      const url = lesson.url;
      if (navigator.share) {
        try {
          await navigator.share({ title: lesson.name, url });
          return;
        } catch (error) {
          if (error && error.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(url);
        share.classList.add('copied');
        share.title = '已複製';
        $('copy-status').textContent = '已複製連結';
        clearTimeout(shareFeedback);
        shareFeedback = setTimeout(() => {
          share.classList.remove('copied');
          share.title = '分享連結';
          $('copy-status').textContent = '';
        }, 1800);
      } catch {
        window.prompt('請複製連結', url);
      }
    };
  }
  let shareFeedback;
  const actions = document.createElement('div');
  actions.className = 'card-actions';
  actions.append(download, copy);
  if (share) actions.append(share);
  return actions;
}

async function toggleFullscreen() {

}
document.addEventListener('dblclick', event => event.preventDefault(), { passive: false });
async function prepareOfflineApp() {
  const status = $('offline-status');
  if (lessons.every(lesson => lesson.document)) {
    status.dataset.ready = 'true';
    status.textContent = '全套教具可離線使用';
    return;
  }
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:' && !window.isSecureContext) return;
  status.removeAttribute('data-ready');
  try {
    const registration = await navigator.serviceWorker.register('../selected-lessons-sw.js');
    if (!registration.active && registration.installing) {
      await new Promise((resolve, reject) => {
        const worker = registration.installing;
        function finish() {
          if (worker.state === 'redundant') reject(new Error('Offline installation failed'));
          if (worker.state === 'activated') resolve();
        }
        worker.addEventListener('statechange', finish);
        finish();
      });
    }
    const ready = await navigator.serviceWorker.ready;
    const available = await new Promise((resolve, reject) => {
      const channel = new MessageChannel();
      const replyTimeout = setTimeout(() => {
        channel.port1.close();
        reject(new Error('Offline preparation timed out'));
      }, 60000);
      channel.port1.onmessage = event => {
        clearTimeout(replyTimeout);
        channel.port1.close();
        resolve(event.data.ready);
      };
      ready.active.postMessage('prepare-maths-offline', [channel.port2]);
    });
    if (!available) throw new Error('Offline files unavailable');
    status.dataset.ready = 'true';
    status.textContent = '全套教具可離線使用';
  } catch {
    status.removeAttribute('data-ready');
  }
}
