const $ = id => document.getElementById(id);

function openApp(lesson) {
  $('menu').hidden = true;
  $('viewer').hidden = false;
  $('shell').classList.add('viewing');
  $('brand').textContent = lesson.name;
  $('toolbar').hidden = false;
  $('home').hidden = false;
  $('full').hidden = false;
  const frame = document.createElement('iframe');
  frame.title = lesson.name;
  frame.setAttribute('allow', 'fullscreen');
  // Keep the existing header visible while the lesson arranges its own toolbar.
  frame.style.visibility = 'hidden';
  frame.addEventListener('load', () => {
    if (frame.parentNode !== $('viewer')) return;
    try {
      mergeLessonToolbar(frame, lesson.name);
    } finally {
      frame.style.removeProperty('visibility');
    }
  });
  if (lesson.document) frame.srcdoc = lesson.document;
  else frame.src = lesson.path;
  $('viewer').replaceChildren(frame);
}

function mergeLessonToolbar(frame, title) {
  const child = frame.contentDocument;
  if (!child) return;
  const tabs = [...child.querySelectorAll('nav')].find(nav =>
    nav.classList.contains('tabs') || nav.querySelector('button[data-source]')
  );
  if (!tabs || tabs.classList.contains('portal-lesson-tabs')) return;

  const style = child.createElement('style');
  style.textContent = `

    .portal-lesson-bar{display:flex;align-items:center;flex:0 0 52px;height:52px;min-width:0;gap:8px;padding:4px 9px;background:#fff;color:#26344a;box-sizing:border-box;border-bottom:1px solid #e5eaf1;font-family:ui-rounded,"PingFang HK","Microsoft JhengHei",system-ui,sans-serif}
    .portal-lesson-title{flex:0 1 auto;min-width:80px;max-width:25%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(12px,1.5vw,16px);font-weight:900}
    .portal-lesson-bar>nav.portal-lesson-tabs{display:flex;flex:1 1 0;min-width:0;align-items:center;flex-wrap:nowrap;justify-content:flex-start;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 4px;border:0;background:transparent}
    .portal-lesson-tabs::-webkit-scrollbar{display:none}.portal-lesson-tabs>*{flex:0 0 auto;white-space:nowrap}.portal-lesson-tabs>:first-child{margin-left:auto}.portal-lesson-tabs>:last-child{margin-right:auto}
    .portal-lesson-actions{flex:none;display:flex;align-items:center;gap:5px}.portal-lesson-actions>button{min-height:35px;min-width:35px;padding:5px 9px;border:1px solid #e3eaf5;border-radius:10px;background:#f1f5fc;color:#3b5576;font:800 13px/1.2 system-ui,sans-serif;white-space:nowrap;cursor:pointer;touch-action:manipulation}.portal-lesson-actions>button:hover{background:#e2ebfb}.portal-lesson-action-icon{margin-right:4px}
    @media(max-width:620px){.portal-lesson-bar{gap:4px;padding-inline:4px}.portal-lesson-title{min-width:0;max-width:25%}.portal-lesson-tabs>button{font-size:14px;padding-inline:8px}.portal-lesson-action-label{display:none}.portal-lesson-action-icon{margin-right:0}}
  `;
  child.head.append(style);

  const bar = child.createElement('div');
  bar.className = 'portal-lesson-bar';
  const label = child.createElement('span');
  label.className = 'portal-lesson-title';
  label.textContent = title;
  label.title = title;
  const actions = child.createElement('div');
  actions.className = 'portal-lesson-actions';
  for (const [icon, text, action] of [['⛶', '全螢幕', toggleFullscreen], ['⌂', '首頁', home]]) {
    const button = child.createElement('button');
    button.type = 'button';
    button.title = text;
    button.setAttribute('aria-label', text);
    for (const [cls, value] of [['icon', icon], ['label', text]]) {
      const span = child.createElement('span');
      span.className = 'portal-lesson-action-' + cls;
      span.textContent = value;
      span.setAttribute('aria-hidden', 'true');
      button.append(span);
    }
    button.addEventListener('click', action);
    actions.append(button);
  }
  tabs.before(bar);
  tabs.classList.add('portal-lesson-tabs');
  bar.append(label, tabs, actions);
  $('toolbar').hidden = true;
}

function htmlBlobUrl(html) {
  return URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
}

function embeddedJson(value) {
  return JSON.stringify(value).replace(/</g, '\\u003c');
}

async function bundleActivity(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error('Unable to open activity');
  const page = new DOMParser().parseFromString(await response.text(), 'text/html');
  const embedded = page.getElementById('embedded-apps');
  const sources = [...page.querySelectorAll('[data-source]')];
  if (!embedded || !sources.length) throw new Error('Activity sources are missing');
  const documents = await Promise.all(sources.map(async source => {
    const result = await fetch(new URL(source.dataset.source, response.url));
    if (!result.ok) throw new Error('Unable to load activity source');
    return result.text();
  }));
  embedded.textContent = embeddedJson(documents);
  return '<!doctype html>\n' + page.documentElement.outerHTML;
}

async function activityDocument(lesson) {
  if (lesson.document) return lesson.document;
  if (lesson.bundle) return bundleActivity(lesson.path);
  const response = await fetch(lesson.path);
  if (!response.ok) throw new Error('Unable to load activity');
  return response.text();
}

async function downloadPortal() {
  const page = document.documentElement.cloneNode(true);
  for (const id of ['grid', 'viewer', 'copy-status', 'portal-actions']) {
    page.querySelector('#' + id).replaceChildren();
  }
  if (lessons.some(lesson => !lesson.document)) {
    const offlineLessons = await Promise.all(lessons.map(async lesson => ({
      ...lesson,
      document: await activityDocument(lesson),
    })));
    const script = page.querySelector('#portal-script');
    script.textContent = script.textContent.replace(/^const lessons=.*;$/m, () =>
      'const lessons=' + embeddedJson(offlineLessons) + ';'
    );
  }
  return htmlBlobUrl('<!doctype html>\n' + page.outerHTML);
}

function createActions(lesson, downloadPage, includeShare = false) {
  const download = document.createElement('button');
  download.type = 'button';
  download.className = 'card-download';
  download.title = '下載 HTML';
  download.setAttribute('aria-label', '下載「' + lesson.name + '」HTML');
  download.innerHTML = '<svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m-3-3 3 3 3-3M3 12v2h10v-2"/></svg>';
  download.onclick = async () => {
    let href = lesson.path;
    if (downloadPage || lesson.document || lesson.bundle) {
      download.disabled = true;
      try {
        href = downloadPage ? await downloadPage() : htmlBlobUrl(await activityDocument(lesson));
      } catch {
        $('copy-status').textContent = '下載失敗，請再試一次。';
        return;
      } finally {
        download.disabled = false;
      }
    }
    const link = document.createElement('a');
    link.href = href;
    link.download = lesson.name + '.html';
    document.body.append(link);
    link.click();
    link.remove();
    if (href.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(href), 30000);
  };

  const copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'card-copy';
  copy.title = '複製連結';
  copy.setAttribute('aria-label', '複製「' + lesson.name + '」連結');
  copy.innerHTML = '<svg class="link-icon" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.4 9.6l3.2-3.2M8.5 4.8l1.8-1.8a2.1 2.1 0 0 1 3 3l-1.8 1.8M7.5 11.2 5.7 13a2.1 2.1 0 0 1-3-3l1.8-1.8"/></svg><svg class="tick-icon" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3 3 7-7"/></svg>';
  let copyFeedback;
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(lesson.url);
    } catch {
      window.prompt('複製連結', lesson.url);
      return;
    }
    copy.classList.add('copied');
    copy.title = '已複製連結';
    $('copy-status').textContent = '已複製「' + lesson.name + '」連結';
    clearTimeout(copyFeedback);
    copyFeedback = setTimeout(() => {
      copy.classList.remove('copied');
      copy.title = '複製連結';
      $('copy-status').textContent = '';
    }, 1600);
  };
  let share = null;
  if (includeShare) {
    share = document.createElement('button');
    share.type = 'button';
    share.className = 'card-share';
    share.title = '分享連結';
    share.setAttribute('aria-label', '分享「' + lesson.name + '」');
    share.innerHTML = '<svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2m-3 3 3-3 3 3M3 8v5h10V8"/></svg>';
    share.onclick = async () => {
      const url = lesson.url;
      if (navigator.share) {
        try {
          await navigator.share({ title: lesson.name, url });
          return;
        } catch (error) {
          if (error && error.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(url);
        share.classList.add('copied');
        share.title = '已複製連結';
        $('copy-status').textContent = '此裝置不支援系統分享，已複製「' + lesson.name + '」連結';
        clearTimeout(shareFeedback);
        shareFeedback = setTimeout(() => {
          share.classList.remove('copied');
          share.title = '分享連結';
          $('copy-status').textContent = '';
        }, 1800);
      } catch {
        window.prompt('此裝置不支援系統分享，請複製連結', url);
      }
    };
  }
  let shareFeedback;
  const actions = document.createElement('div');
  actions.className = 'card-actions';
  actions.append(download, copy);
  if (share) actions.append(share);
  return actions;
}

for (const lesson of lessons) {
  const [color, rim, sticker] = cardPalettes[lesson.num];
  const entry = document.createElement('div');
  entry.className = 'card-entry';
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card.style.setProperty('--color',color);
  card.style.setProperty('--tag',rim);
  card.style.setProperty('--tag-ink',sticker);
  card.setAttribute('aria-label','開啟第 '+lesson.num+' 課：'+lesson.title);
  const art = document.createElement('span');
  art.className = 'card-art';
  art.setAttribute('aria-hidden','true');
  art.innerHTML = cardArtwork[lesson.num] || cardArtwork[7];
  const bottom = document.createElement('span');
  bottom.className = 'card-bottom';
  const number = document.createElement('span');
  number.className = 'number';
  number.textContent = '第 '+lesson.num+' 課';
  const title = document.createElement('span');
  title.className = 'title';
  title.textContent = lesson.title;
  title.title = lesson.title;
  bottom.append(number,title);
  card.append(art,bottom);
  card.addEventListener('click',()=>openApp(lesson));
  entry.append(card,createActions(lesson,null,true));
  $('grid').append(entry);
}
