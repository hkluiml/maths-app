<!DOCTYPE html> <html lang="zh-Hant" data-immersive-translate-page-theme="dark"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>9× 🐠</title> <style>:root{--panel-bg:#07192f;--key-bg:#0e2a4a;--key-hover:#163d68;--key-active:#1e4f85;--accent-aqua:#22d3ee;--accent-coral:#fb7185;--accent-gold:#fde047;--accent-green:#34d399;--accent-red:#f43f5e;--text-main:#f0f9ff;--text-dim:#94a3b8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}body,html{margin:0;padding:0;width:100%;height:100dvh;overflow:hidden;background:#041021;color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}#app{display:flex;flex-direction:column;width:100%;height:100dvh;max-width:960px;margin:0 auto;background:#06172c;position:relative;box-shadow:0 0 50px rgba(34,211,238,.22)}.hud{display:flex;align-items:center;gap:10px;padding:10px 12px 6px;z-index:25;flex-shrink:0;background:rgba(4,18,38,.56);backdrop-filter:blur(8px)}.badge-group{display:flex;align-items:center;gap:6px;flex-shrink:0}.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.4px;background:rgba(14,42,74,.85);border:1.5px solid rgba(255,255,255,.22);color:#f0f9ff;white-space:nowrap}.pill-stage{color:#a5f3fc;border-color:rgba(34,211,238,.48);background:rgba(34,211,238,.16)}.pill-combo{color:#fde047;border-color:rgba(253,224,71,.48);background:rgba(253,224,71,.14);transition:transform .15s ease}.pill-combo.pop{transform:scale(1.22)}.pill-mode{color:#7dd3fc;border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.14)}.pill-mode.rand{color:#f9a8d4;border-color:rgba(244,114,182,.5);background:rgba(244,114,182,.18)}.prog-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.prog-bar-outer{position:relative;width:100%;height:24px;background:rgba(4,16,33,.88);border-radius: ;line-height:1;animation:bounceCrown .9s infinite alternate ease-in-out}@keyframes bounceCrown{from{transform:translateY(0) scale(1)}to{transform:translateY(-6px) scale(1.08)}}.victory-score{font-size:24px;font-weight:900;color:#fde047;letter-spacing:.6px}.victory-bottom{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}.victory-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.stat-chip{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:14px;background:rgba(7,25,47,.88);border:1.5px solid rgba(34,211,238,.5);color:#f0f9ff;font-size:17px;font-weight:900;box-shadow:0 0 14px rgba(34,211,238,.25)}.replay-btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 40px;border-radius:999px;border:2px solid rgba(255,255,255,.78);background:linear-gradient(135deg,#06b6d4,#2563eb);color:#fff;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 0 24px rgba(34,211,238,.48);transition:transform .12s,filter .15s}.replay-btn:hover{filter:brightness(1.1)}.replay-btn:active{transform:scale(.94)}.deck{background:var(--panel-bg);border-top:1.5px solid rgba(34,211,238,.24);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;flex-shrink:0;z-index:10}.deck.hidden-victory{display:none}.equation-row{display:flex;align-items:center;justify-content:center;gap:12px}.eq-prompt{font-size:clamp(28px, 6vw, 40px);font-weight:900;letter-spacing:2px;color:var(--text-main);text-shadow:0 0 14px rgba(34,211,238,.35)}.eq-prompt .mul{color:var(--accent-aqua)}.eq-prompt .eq-sign{color:var(--text-dim)}.answer-box{min-width:96px;height:clamp(46px,8vw,56px);padding:0 16px;border-radius:14px;background:#041021;border:2.5px solid var(--accent-aqua);display:inline-flex;align-items:center;justify-content:center;font-size:clamp(28px, 6vw, 38px);font-weight:900;color:#fff;box-shadow:0 0 18px rgba(34,211,238,.25);transition:border-color .15s,background .15s,transform .12s}.answer-box.empty::after{content:"";width:3px;height:26px;background:var(--accent-aqua);border-radius:2px;animation:blink .9s infinite}@keyframes blink{0%,49%{opacity:1}100%,50%{opacity:0}}.answer-box.wrong{border-color:var(--accent-red);background:rgba(244,63,94,.22);animation:shakeX .32s ease}.answer-box.correct{border-color:var(--accent-green);background:rgba(52,211,153,.22);transform:scale(1.08)}@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}.numpad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:640px;width:100%;margin:0 auto}.key{height:clamp(46px,7.5dvh,58px);border-radius:13px;border:1.5px solid rgba(34,211,238,.22);border-bottom:3px solid rgba(0,0,0,.55);background:var(--key-bg);color:var(--text-main);font-size:clamp(20px, 4.2vw, 26px);font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s,transform 80ms;touch-action:manipulation}.key:hover{background:var(--key-hover);border-color:rgba(34,211,238,.55)}.key:active{background:var(--key-active);transform:translateY(2px);border-bottom-width:1px}.key-del{background:#271a36;color:#fda4af}.key-go{background:linear-gradient(135deg,#06b6d4,#2563eb);border-color:rgba(34,211,238,.72);border-bottom-color:#1e3a8a;color:#fff;box-shadow:0 4px 16px rgba(34,211,238,.36)}.key-go:hover{filter:brightness(1.1)}@media (max-width:480px){.numpad{grid-template-columns:repeat(4,1fr)}.vfx-dock{gap:3px;padding:4px 6px}.vfx-dot{width:20px;height:20px;font-size:11px}.hud{gap:6px;padding:8px 8px 4px}.pill{padding:3px 7px;font-size:12px}}</style> </head> <body class=""> <div id="app"> <img id="imgReefBg" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAA
