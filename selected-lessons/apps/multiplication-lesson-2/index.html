th.min(state.combo * 3, 45);\n        const mult = isCrit ? 2.25 : 1;\n        const skillBonus = isSkill ? 1.15 : 1;\n        const gain = Math.round(baseGain * mult * skillBonus);\n\n        if (isCrit && hitIndex === 0) state.crits += 1;\n        else if (isCrit && isSkill && hitIndex === 2) state.crits += 1;\n\n        state.life = Math.min(state.goal, state.life + gain);\n\n        highlightVfxDot(vfxId);\n        playOceanSound(vfxId, isCrit, isSkill && hitIndex === 0);\n\n        const tx = width * (0.28 + Math.random() * 0.44);\n        const ty = height * (0.35 + Math.random() * 0.28);\n\n        spawnVfx(vfxId, tx, ty, isCrit ? 1.3 : 1.0);\n        spawnBubbleBurst(tx, ty, VFX_LIST[vfxId].color, isCrit ? 22 : 12);\n\n        floatTexts.push({\n          x: tx,\n          y: ty - 18 - hitIndex * 24,\n          vy: isCrit ? -80 : -56,\n          text: '+' + gain,\n          tag: isCrit ? '🫧 海洋奇蹟!' : (isSkill && hitIndex === 0 ? '🌊 碧海狂歡!' : ''),\n          color: isCrit ? '#fde047' : (isSkill ? '#f472b6' : '#67e8f9'),\n          scale: isCrit ? 1.38 : (isSkill ? 1.18 : 1.0),\n          life: 0.95,\n          maxLife: 0.95\n        });\n\n        updateHud();\n\n        if (state.life >= state.goal && !state.victory) {\n          handleVictory(false);\n        }\n      }\n\n      function handleVictory(instant) {\n        state.victory = true;\n        spawnBubbleBurst(width * 0.35, height * 0.45, '#fde047', 28);\n        spawnBubbleBurst(width * 0.65, height * 0.45, '#22d3ee', 28);\n        if (!instant) playAquariumFanfare();\n\n        const secs = Math.max(1, Math.round((performance.now() - state.startTime) / 1000));\n        const mm = String(Math.floor(secs / 60)).padStart(2, '0');\n        const ss = String(secs % 60).padStart(2, '0');\n        statScore.textContent = state.goal;\n        statHits.textContent = state.hits;\n        statCrits.textContent = state.crits;\n        statSkills.textContent = state.skills;\n        statTime.textContent = mm + ':' + ss;\n\n        const showOverlay = () => {\n          if (!state.victory) return;\n          controlDeck.classList.add('hidden-victory');\n          vfxDock.classList.add('hidden-victory');\n          victoryOverlay.classList.add('show');\n          resizeCanvas();\n        };\n        if (instant) showOverlay();\n        else setTimeout(showOverlay, 600);\n      }\n\n      /* ================= 10 ANIME OCEAN VFX ================= */\n      function spawnVfx(id, x, y, scale) {\n        activeEffects.push({ id, x, y, scale, t: 0, dur: 0.6, seed: Math.random() * 100 });\n      }\n\n      function spawnBubbleBurst(x, y, color, count) {\n        const palette = [color, '#a5f3fc', '#ffffff', '#fde047', '#f472b6'];\n        for (let i = 0; i \u003c count; i++) {\n          const ang = Math.random() * Math.PI * 2;\n          const spd = 40 + Math.random() * 155;\n          particles.push({\n            x, y,\n            vx: Math.cos(ang) * spd,\n            vy: Math.sin(ang) * spd - 65,\n            r: 3 + Math.random() * 5,\n            color: palette[i % palette.length],\n            life: 0.55 + Math.random() * 0.45,\n            maxLife: 1.0\n          });\n        }\n      }\n\n      function drawStar(cx, cy, spikes, outerR, innerR) {\n        ctx.beginPath();\n        for (let i = 0; i \u003c spikes * 2; i++) {\n          const r = i % 2 === 0 ? outerR : innerR;\n          const a = (i * Math.PI) / spikes - Math.PI / 2;\n          if (i === 0) ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);\n          else ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);\n        }\n        ctx.closePath();\n        ctx.fill();\n      }\n\n      function drawVfx(e) {\n        const p = Math.min(1, e.t / e.dur);\n        const inv = 1 - p;\n        const sc = e.scale;\n        ctx.save();\n\n        switch (e.id) {\n          case 0: { // 1. Bubble Stream\n            for (let i = 0; i \u003c 10; i++) {\n              const bx = e.x + Math.sin(e.seed + i * 1.3 + p * 6) * 44 * sc;\n              const by = e.y + 40 - p * 145 * sc - i * 8;\n              const r = (6 + (i % 3) * 4) * sc;\n              ctx.strokeStyle = `rgba(165, 243, 252, ${inv})`;\n              ctx.fillStyle = `rgba(34, 211, 238, ${inv * 0.25})`;\n              ctx.lineWidth = 2;\n              ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n            }\n            break;\n          }\n          case 1: { // 2. Tropical Swirl\n            for (let i = 0; i \u003c 6; i++) {\n              const a = (i / 6) * Math.PI * 2 + p * 4.5;\n              const rad = (20 + p * 78) * sc;\n              ctx.fillStyle = i % 2 === 0 ? `rgba(251, 146, 60, ${inv})` : `rgba(253, 224, 71, ${inv})`;\n              ctx.beginPath();\n              ctx.ellipse(e.x + Math.cos(a) * rad, e.y + Math.sin(a) * rad * 0.65, 9 * sc, 5 * sc, a, 0, Math.PI * 2);\n              ctx.fill();\n            }\n            break;\n          }\n          case 2: { // 3. Coral Bloom Rings\n            for (let i = 0; i \u003c 3; i++) {\n              ctx.strokeStyle = i % 2 === 0 ? `rgba(251, 113, 133, ${inv})` : `rgba(244, 114, 182, ${inv})`;\n              ctx.lineWidth = (5 - i) * sc;\n              ctx.beginPath(); ctx.arc(e.x, e.y, (20 + i * 15 + p * 75) * sc, 0, Math.PI * 2); ctx.stroke();\n            }\n            break;\n          }\n          case 3: { // 4. Pearl Sparkle\n            for (let i = 0; i \u003c 8; i++) {\n              const a = (i / 8) * Math.PI * 2 + p * 3.5;\n              const rad = (16 + p * 82) * sc;\n              ctx.fillStyle = i % 2 === 0 ? `rgba(254, 240, 138, ${inv})` : `rgba(255, 255, 255, ${inv})`;\n              drawStar(e.x + Math.cos(a) * rad, e.y + Math.sin(a) * rad, 5, 10 * sc * inv, 4 * sc * inv);\n            }\n            break;\n          }\n          case 4: { // 5. Ocean Sunbeam\n            const bw = (42 + Math.sin(p * Math.PI) * 38) * sc;\n            const g = ctx.createLinearGradient(e.x - bw, 0, e.x + bw, 0);\n            g.addColorStop(0, 'rgba(165, 243, 252, 0)');\n            g.addColorStop(0.5, `rgba(224, 242, 254, ${inv * 0.62})`);\n            g.addColorStop(1, 'rgba(165, 243, 252, 0)');\n            ctx.fillStyle = g;\n            ctx.fillRect(e.x - bw, 0, bw * 2, height);\n            break;\n          }\n          case 5: { // 6. Aqua Wave Rings\n            ctx.strokeStyle = `rgba(56, 189, 248, ${inv})`;\n            ctx.lineWidth = 4 * sc;\n            ctx.beginPath(); ctx.ellipse(e.x, e.y, (32 + p * 95) * sc, (14 + p * 42) * sc, 0, 0, Math.PI * 2); ctx.stroke();\n            break;\n          }\n          case 6: { // 7. Shell Shimmer\n            const cols = ['#f472b6', '#fde047', '#38bdf8'];\n            cols.forEach((col, i) => {\n              ctx.strokeStyle = col;\n              ctx.globalAlpha = inv * 0.85;\n              ctx.lineWidth = 4 * sc;\n              ctx.beginPath(); ctx.arc(e.x, e.y + 20, (24 + i * 10 + p * 56) * sc, Math.PI, 0); ctx.stroke();\n            });\n            break;\n          }\n          case 7: { // 8. Jellyfish Glow\n            const g = ctx.createRadialGradient(e.x, e.y, 4, e.x, e.y, (30 + p * 75) * sc);\n            g.addColorStop(0, `rgba(192, 132, 252, ${inv * 0.85})`);\n            g.addColorStop(1, 'rgba(192, 132, 252, 0)');\n            ctx.fillStyle = g;\n            ctx.beginPath(); ctx.arc(e.x, e.y, (30 + p * 75) * sc, 0, Math.PI * 2); ctx.fill();\n            break;\n          }\n          case 8: { // 9. Reef Rainbow\n            const cols = ['#22d3ee', '#34d399', '#fde047', '#fb7185', '#c084fc'];\n            cols.forEach((col, i) => {\n              ctx.strokeStyle = col;\n              ctx.globalAlpha = inv * 0.82;\n              ctx.lineWidth = 4.5 * sc;\n              ctx.beginPath(); ctx.arc(e.x, e.y, (18 + i * 8 + p * 82) * sc, 0, Math.PI * 2); ctx.stroke();\n            });\n            break;\n          }\n          case 9: { // 10. Ocean Starlight\n            ctx.translate(e.x, e.y);\n            ctx.fillStyle = `rgba(254, 240, 138, ${inv * 0.9})`;\n            ctx.shadowColor = '#22d3ee';\n            ctx.shadowBlur = 22;\n            drawStar(0, 0, 8, (32 + p * 88) * sc, (13 + p * 26) * sc);\n            break;\n          }\n        }\n        ctx.restore();\n      }\n\n      /* ================= DRAW LIVING ANIME AQUARIUM ================= */\n      function stageProg(p, s, e) { return Math.max(0, Math.min(1, (p - s) / (e - s))); }\n\n      function drawCoverImage(img, x, y, w, h) {\n        if (!img || !img.complete || img.naturalWidth === 0) return;\n        const ir = img.naturalWidth / img.naturalHeight;\n        const cr = w / h;\n        let dw, dh, dx, dy;\n        if (cr > ir) {\n          dw = w;\n          dh = w / ir;\n          dx = x;\n          dy = y + (h - dh) * 0.65;\n        } else {\n          dh = h;\n          dw = h * ir;\n          dx = x + (w - dw) * 0.5;\n          dy = y;\n        }\n        ctx.drawImage(img, dx, dy, dw, dh);\n      }\n\n      function drawAquariumScene(dt, prog) {\n        // 1. STUDIO-ANIME UNDERWATER CORAL REEF BACKGROUND\n        const bgImg = SPRITES.bg;\n        if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {\n          drawCoverImage(bgImg, 0, 0, width, height);\n          // Progressive lighting: serene deeper blue at 0% -> radiant sunlit aquarium at 100%!\n          const dimAlpha = Math.max(0, 0.42 * (1 - prog));\n          if (dimAlpha > 0.01) {\n            ctx.fillStyle = `rgba(3, 18, 42, ${dimAlpha})`;\n            ctx.fillRect(0, 0, width, height);\n          }\n        } else {\n          const water = ctx.createLinearGradient(0, 0, 0, height);\n          water.addColorStop(0, '#0284c7');\n          water.addColorStop(1, '#082f49');\n          ctx.fillStyle = water;\n          ctx.fillRect(0, 0, width, height);\n        }\n\n        // 2. SHIMMERING ANIMATED SUNBEAMS OVER THE REEF\n        ctx.save();\n        for (let i = 0; i \u003c 5; i++) {\n          const rx = width * (0.14 + i * 0.18) + Math.sin(state.time * 0.55 + i) * 26;\n          const rg = ctx.createLinearGradient(rx, 0, rx + 50, height * 0.85);\n          rg.addColorStop(0, `rgba(254, 249, 195, ${0.08 + prog * 0.14})`);\n          rg.addColorStop(1, 'rgba(186, 230, 253, 0)');\n          ctx.fillStyle = rg;\n          ctx.beginPath();\n          ctx.moveTo(rx - 18, 0);\n          ctx.lineTo(rx + 26, 0);\n          ctx.lineTo(rx + 95, height * 0.85);\n          ctx.lineTo(rx + 15, height * 0.85);\n          ctx.closePath();\n          ctx.fill();\n        }\n        ctx.restore();\n\n        // 3. UNLOCKED ANIME SEA CREATURES (+1 NEW CREATURE EVERY 4 CORRECT ANSWERS!)\n        const unlockedCount = getActiveCreatureCount(prog);\n        const responsiveScale = Math.min(1.15, Math.max(0.58, width / 760));\n\n        for (let i = 0; i \u003c unlockedCount; i++) {\n          const c = fishes[i];\n          c.x += dt * c.spd;\n          if (c.x > 1.18) c.x = -0.18;\n          if (c.x \u003c -0.18) c.x = 1.18;\n\n          const img = SPRITES[c.kind];\n          if (!img || !img.complete || img.naturalWidth === 0) continue;\n\n          const cx = c.x * width;\n          const bobAmp = c.kind === 'jellyfish' ? 16 : (c.kind === 'whale' ? 12 : 8);\n          const bobSpd = c.kind === 'jellyfish' ? 1.8 : (c.kind === 'whale' ? 1.3 : 2.8);\n          const cy = c.y * height + Math.sin(state.time * bobSpd + c.phase) * bobAmp;\n\n          const drawW = c.w * responsiveScale;\n          const drawH = drawW * (img.naturalHeight / img.naturalWidth);\n\n          ctx.save();\n          ctx.translate(cx, cy);\n\n          const isEpic = i >= 12;\n          if (c.kind === 'jellyfish' || c.kind === 'octopus') {\n            const pulse = 1 + Math.sin(state.time * 3.2 + c.phase) * 0.07;\n            ctx.rotate(Math.sin(state.time * 1.4 + c.phase) * 0.1);\n            ctx.scale(pulse, 1 / pulse);\n          } else if (c.kind === 'crab') {\n            const flipX = c.dir === c.baseDir ? 1 : -1;\n            ctx.rotate(Math.sin(state.time * 8 + c.phase) * 0.05);\n            ctx.scale(flipX, 1);\n          } else {\n            const flipX = c.dir === c.baseDir ? 1 : -1;\n            const tilt = Math.cos(state.time * bobSpd + c.phase) * 0.055 * c.dir;\n            ctx.rotate(tilt);\n            ctx.scale(flipX, 1);\n          }\n\n          ctx.shadowColor = isEpic ? 'rgba(253, 224, 71, 0.55)' : 'rgba(14, 42, 74, 0.3)';\n          ctx.shadowBlur = isEpic ? 18 : 8;\n          ctx.shadowOffsetY = isEpic ? 0 : 4;\n          ctx.drawImage(img, -drawW * 0.5, -drawH * 0.5, drawW, drawH);\n          ctx.restore();\n        }\n\n        // 4. RISING CRYSTAL AIR BUBBLES\n        bgBubbles.forEach((b) => {\n          b.y -= dt * b.spd;\n          if (b.y \u003c -0.05) { b.y = 1.05; b.x = Math.random(); }\n          const bx = b.x * width + Math.sin(state.time * 2.4 + b.phase) * 9;\n          const by = b.y * height;\n          ctx.strokeStyle = 'rgba(224, 242, 254, 0.6)';\n          ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';\n          ctx.lineWidth = 1.4;\n          ctx.beginPath(); ctx.arc(bx, by, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n        });\n      }\n\n      /* ================= MAIN RENDER LOOP ================= */\n      function resizeCanvas() {\n        const rect = arenaWrap.getBoundingClientRect();\n        width = Math.max(200, rect.width);\n        height = Math.max(160, rect.height);\n        dpr = Math.min(window.devicePixelRatio || 1, 2);\n        canvas.width = Math.floor(width * dpr);\n        canvas.height = Math.floor(height * dpr);\n        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      }\n\n      function tick(ts) {\n        const dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016);\n        lastTs = ts;\n        state.time += dt;\n\n        state.displayLife += (state.life - state.displayLife) * Math.min(1, dt * 8);\n        const prog = Math.min(1, state.displayLife / state.goal);\n        if (state.skillRays > 0) state.skillRays = Math.max(0, state.skillRays - dt * 1.2);\n\n        ctx.clearRect(0, 0, width, height);\n        drawAquariumScene(dt, prog);\n\n        // Active 10 VFX\n        for (let i = activeEffects.length - 1; i >= 0; i--) {\n          const ef = activeEffects[i];\n          ef.t += dt;\n          if (ef.t >= ef.dur) activeEffects.splice(i, 1);\n          else drawVfx(ef);\n        }\n\n        // Particles\n        for (let i = particles.length - 1; i >= 0; i--) {\n          const pt = particles[i];\n          pt.life -= dt;\n          if (pt.life \u003c= 0) { particles.splice(i, 1); continue; }\n          pt.x += pt.vx * dt;\n          pt.y += pt.vy * dt;\n          const alpha = Math.max(0, Math.min(1, pt.life / pt.maxLife));\n          ctx.fillStyle = pt.color;\n          ctx.globalAlpha = alpha;\n          ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r * (0.45 + alpha * 0.55), 0, Math.PI * 2); ctx.fill();\n          ctx.globalAlpha = 1;\n        }\n\n        // Floating Progress Numbers\n        for (let i = floatTexts.length - 1; i >= 0; i--) {\n          const ft = floatTexts[i];\n          ft.life -= dt;\n          if (ft.life \u003c= 0) { floatTexts.splice(i, 1); continue; }\n          ft.y += ft.vy * dt;\n          ft.vy *= Math.pow(0.2, dt);\n          const alpha = Math.min(1, (ft.life / ft.maxLife) * 1.6);\n          ctx.save();\n          ctx.globalAlpha = alpha;\n          ctx.textAlign = 'center';\n          ctx.font = `900 ${Math.round(28 * ft.scale)}px -apple-system, BlinkMacSystemFont, sans-serif`;\n          ctx.lineWidth = 6;\n          ctx.strokeStyle = 'rgba(4, 18, 38, 0.92)';\n          ctx.strokeText(ft.text, ft.x, ft.y);\n          ctx.fillStyle = ft.color;\n          ctx.fillText(ft.text, ft.x, ft.y);\n\n          if (ft.tag) {\n            ctx.font = `900 ${Math.round(16 * ft.scale)}px -apple-system, BlinkMacSystemFont, sans-serif`;\n            ctx.strokeText(ft.tag, ft.x, ft.y - 28 * ft.scale);\n            ctx.fillStyle = '#fde047';\n            ctx.fillText(ft.tag, ft.x, ft.y - 28 * ft.scale);\n          }\n          ctx.restore();\n        }\n\n        rafId = requestAnimationFrame(tick);\n      }\n\n      /* ================= TEACHER PROGRESS BAR SCRUBBER ================= */\n      if (IS_TEACHER) {\n        teacherSlider.addEventListener('input', () => {\n          const val = parseInt(teacherSlider.value, 10) || 0;\n          state.teacherScrubbed = true;\n          state.life = val;\n          state.displayLife = val;\n          if (val >= state.goal) {\n            if (!state.victory) handleVictory(true);\n          } else {\n            if (state.victory) {\n              state.victory = false;\n              victoryOverlay.classList.remove('show');\n              controlDeck.classList.remove('hidden-victory');\n              vfxDock.classList.remove('hidden-victory');\n              resizeCanvas();\n            }\n          }\n          updateHud();\n        });\n      }\n\n      /* ================= EVENT LISTENERS ================= */\n      numpad.addEventListener('click', (ev) => {\n        const btn = ev.target.closest('.key');\n        if (!btn) return;\n        const num = btn.getAttribute('data-num');\n        const action = btn.getAttribute('data-action');\n        if (num !== null) appendDigit(num);\n        else if (action === 'del') deleteDigit();\n        else if (action === 'submit') submitAnswer();\n      });\n\n      window.addEventListener('keydown', (ev) => {\n        if (ev.key >= '0' && ev.key \u003c= '9') {\n          ev.preventDefault();\n          appendDigit(ev.key);\n        } else if (ev.key === 'Backspace' || ev.key === 'Delete') {\n          ev.preventDefault();\n          deleteDigit();\n        } else if (ev.key === 'Enter' || ev.key === ' ') {\n          ev.preventDefault();\n          if (state.victory) startGame();\n          else submitAnswer();\n        }\n      });\n\n      btnSound.addEventListener('click', () => {\n        soundEnabled = !soundEnabled;\n        soundIconOn.style.display = soundEnabled ? '' : 'none';\n        soundIconOff.style.display = soundEnabled ? 'none' : '';\n        if (soundEnabled) {\n          ensureAudio();\n          playKeySound();\n        }\n      });\n\n      btnReset.addEventListener('click', () => {\n        ensureAudio();\n        playKeySound();\n        startGame();\n      });\n\n      btnReplay.addEventListener('click', () => {\n        ensureAudio();\n        playKeySound();\n        startGame();\n      });\n\n      btnDownload.addEventListener('click', () => {\n        const html = '\u003c!DOCTYPE html>\\n' + document.documentElement.outerHTML;\n        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });\n        const url = URL.createObjectURL(blob);\n        const a = document.createElement('a');\n        a.href = url;\n        a.download = IS_TEACHER ? '9x_anime_ocean_aquarium_teacher.html' : '9x_anime_ocean_aquarium.html';\n        document.body.appendChild(a);\n        a.click();\n        document.body.removeChild(a);\n        setTimeout(() => URL.revokeObjectURL(url), 1000);\n      });\n\n      window.addEventListener('resize', resizeCanvas);\n      window.addEventListener('load', () => {\n        initOceanLife();\n        resizeCanvas();\n        startGame();\n        if (rafId) cancelAnimationFrame(rafId);\n        rafId = requestAnimationFrame(tick);\n      });\n    })();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"]</script>
  <script>
    const sources = JSON.parse(document.getElementById('embedded-apps').textContent);
    const activities = document.getElementById('activities');
    const buttons = [...document.querySelectorAll('[data-source]')];
    const frames = new Map();
    const publicDirectory = 'https://hkluiml.github.io/maths-app/selected-lessons/apps/multiplication-lesson-2/';
    const copyActivity = document.getElementById('copy-activity');
    const shareActivity = document.getElementById('share-activity');
    const shareIcon = shareActivity.innerHTML;
    let current = 0;
    let feedbackTimer;


    document.getElementById('download-activity').onclick = () => {
      const activity = buttons[current];
      const file = sources[current];
      const link = document.createElement('a');
      link.href = file
        ? URL.createObjectURL(new Blob([file], { type: 'text/html;charset=utf-8' }))
        : new URL(activity.dataset.source, publicDirectory).href;
      link.download = activity.textContent + '.html';
      document.body.append(link);
      link.click();
      link.remove();
      if (file) setTimeout(() => URL.revokeObjectURL(link.href), 30000);
    };

    copyActivity.onclick = async () => {
      const url = new URL(buttons[current].dataset.source, publicDirectory).href.replace(/index\.html$/, '');
      try {
        await navigator.clipboard.writeText(url);
      } catch {
        window.prompt('複製連結', url);
        return;
      }
      copyActivity.textContent = '✓';
      clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(() => { copyActivity.textContent = '🔗'; }, 1500);
    };

    shareActivity.onclick = async () => {
      const activity = buttons[current];
      const url = new URL(activity.dataset.source, publicDirectory).href.replace(/index\.html$/, '');
      const title = activity.textContent.trim();
      if (navigator.share) {
        try {
          await navigator.share({ title, url });
          return;
        } catch (error) {
          if (error && error.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(url);
        shareActivity.textContent = '✓';
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => { shareActivity.innerHTML = shareIcon; }, 1500);
      } catch {
        window.prompt('此裝置不支援系統分享，請複製連結', url);
      }
    };

    function selectActivity(selected) {
      current = selected;
      if (!frames.has(selected)) {
        const frame = document.createElement('iframe');
        frame.title = buttons[selected].textContent;
        frame.setAttribute('allow', 'fullscreen');
        if (sources[selected]) frame.srcdoc = sources[selected];
        else frame.src = buttons[selected].dataset.source;
        frames.set(selected, frame);
        activities.append(frame);
      }
      buttons.forEach((button, index) => {
        const active = index === selected;
        button.setAttribute('aria-pressed', String(active));
        if (frames.has(index)) frames.get(index).hidden = !active;
      });
    }

    buttons.forEach((button, index) => {
      button.onclick = () => selectActivity(index);
    });
    document.addEventListener('dblclick', event => event.preventDefault(), { passive: false });
    selectActivity(0);
  </script>
