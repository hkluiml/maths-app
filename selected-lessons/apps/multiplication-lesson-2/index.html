<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>乘法的計算（二）</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #dcefff;
      font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
      color: #243d59;
    }
    .ios-blur-fix { position: fixed; width: 1px; height: 1px; opacity: .001; pointer-events: none; }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 6px 10px;
      background: #eaf5ff;
      border-bottom: 1px solid #c2d9ec;
    }
    button {
      min-height: 36px;
      padding: 5px 14px;
      border: 1px solid #b6d2e8;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-size: clamp(12px, 2.5vw, 16px);
      font-weight: 750;
      touch-action: manipulation;
    }
    button[aria-pressed="true"] { color: #fff; background: #31597c; border-color: #31597c; }
    button:focus-visible { outline: 2px solid #254d73; outline-offset: 2px; }
    button:active { transform: scale(.96); transition: transform .4s; }
    .activity-actions { display: flex; gap: 4px; }
    .activity-actions button { padding-inline: 8px; }
    .activity-actions #share-activity svg { display: block; width: 16px; height: 16px; }
    main { flex: 1; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 480px) {
      nav { gap: 4px; padding-inline: 4px; }
      button { padding-inline: 6px; }
    }
  </style>
</head>
<body>
  <div class="ios-blur-fix" aria-hidden="true"></div>
  <nav aria-label="第 13 課教具">
    <button type="button" aria-pressed="false" data-source="../multiplication-6/index.html">6 的乘法遊戲</button>
    <button type="button" aria-pressed="false" data-source="../multiplication-7/index.html">7 的乘法遊戲</button>
    <button type="button" aria-pressed="false" data-source="../multiplication-8/index.html">8 的乘法遊戲</button>
    <button type="button" aria-pressed="false" data-source="../multiplication-9/index.html?v=20261122-2314">9 的乘法遊戲</button>
    <div class="activity-actions">
      <button type="button" id="download-activity" title="下載目前教具" aria-label="下載目前教具">⤓</button>
      <button type="button" id="copy-activity" title="複製目前教具連結" aria-label="複製目前教具連結">🔗</button>
      <button type="button" id="share-activity" title="分享目前教具" aria-label="分享目前教具"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2m-3 3 3-3 3 3M3 8v5h10V8"/></svg></button>
    </div>
  </nav>
  <main id="activities"></main>
  <script id="embedded-apps" type="application/json">[]</script>
  <script>
    const sources = JSON.parse(document.getElementById('embedded-apps').textContent);
    const activities = document.getElementById('activities');
    const buttons = [...document.querySelectorAll('[data-source]')];
    const frames = new Map();
    const publicDirectory = 'https://hkluiml.github.io/maths-app/selected-lessons/apps/multiplication-lesson-2/';
    const copyActivity = document.getElementById('copy-activity');
    const shareActivity = document.getElementById('share-activity');
    const shareIcon = shareActivity.innerHTML;
    let current = 0;
    let feedbackTimer;


    document.getElementById('download-activity').onclick = () => {
      const activity = buttons[current];
      const file = sources[current];
      const link = document.createElement('a');
      link.href = file
        ? URL.createObjectURL(new Blob([file], { type: 'text/html;charset=utf-8' }))
        : new URL(activity.dataset.source, publicDirectory).href;
      link.download = activity.textContent + '.html';
      document.body.append(link);
      link.click();
      link.remove();
      if (file) setTimeout(() => URL.revokeObjectURL(link.href), 30000);
    };

    copyActivity.onclick = async () => {
      const url = new URL(buttons[current].dataset.source, publicDirectory).href.replace(/index\.html(?=\?|$)/, '');
      try {
        await navigator.clipboard.writeText(url);
      } catch {
        window.prompt('複製連結', url);
        return;
      }
      copyActivity.textContent = '✓';
      clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(() => { copyActivity.textContent = '🔗'; }, 1500);
    };

    shareActivity.onclick = async () => {
      const activity = buttons[current];
      const url = new URL(activity.dataset.source, publicDirectory).href.replace(/index\.html(?=\?|$)/, '');
      const title = activity.textContent.trim();
      if (navigator.share) {
        try {
          await navigator.share({ title, url });
          return;
        } catch (error) {
          if (error && error.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(url);
        shareActivity.textContent = '✓';
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => { shareActivity.innerHTML = shareIcon; }, 1500);
      } catch {
        window.prompt('此裝置不支援系統分享，請複製連結', url);
      }
    };

    function selectActivity(selected) {
      current = selected;
      if (!frames.has(selected)) {
        const frame = document.createElement('iframe');
        frame.title = buttons[selected].textContent;
        frame.setAttribute('allow', 'fullscreen');
        if (sources[selected]) frame.srcdoc = sources[selected];
        else frame.src = buttons[selected].dataset.source;
        frames.set(selected, frame);
        activities.append(frame);
      }
      buttons.forEach((button, index) => {
        const active = index === selected;
        button.setAttribute('aria-pressed', String(active));
        if (frames.has(index)) frames.get(index).hidden = !active;
      });
    }

    buttons.forEach((button, index) => {
      button.onclick = () => selectActivity(index);
    });
    document.addEventListener('dblclick', event => event.preventDefault(), { passive: false });
    selectActivity(0);
  </script>
</body>
</html>
