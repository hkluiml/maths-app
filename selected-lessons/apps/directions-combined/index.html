<!doctype html> <html lang="zh-HK"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"> <title>四個主要方向</title> <style>*{box-sizing:border-box}[hidden]{display:none!important}body,html{width:100%;height:100%;margin:0}body{display:flex;flex-direction:column;overflow:hidden;background:#dcefff;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#243d59}.ios-blur-fix{position:fixed;width:1px;height:1px;opacity:.001;pointer-events:none}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:6px 10px;background:#eaf5ff;border-bottom:1px solid #c2d9ec}button{min-height:36px;padding:5px 14px;border:1px solid #b6d2e8;border-radius:10px;background:#fff;color:inherit;cursor:pointer;font:inherit;font-size:clamp(12px, 2.5vw, 16px);font-weight:750;touch-action:manipulation}button[aria-pressed=true]{color:#fff;background:#31597c;border-color:#31597c}button:focus-visible{outline:2px solid #254d73;outline-offset:2px}button:active{transform:scale(.96);transition:transform .4s}main{flex:1;min-height:0}iframe{display:block;width:100%;height:100%;border:0}@media (max-width:480px){nav{gap:4px;padding-inline:4px}button{padding-inline:6px}}</style> </head> <body> <div class="ios-blur-fix" aria-hidden="true"></div> <nav aria-label="第 10 課教具"> <button type="button" aria-pressed="false" data-source="../four-directions/index.html?v=compact">方向轉轉樂</button> <button type="button" aria-pressed="false" data-source="../../../direction-treasure/index.html?v=compact">方向尋寶大賽</button> <button type="button" aria-pressed="false" data-source="../../../direction-explorers/index.html?v=compact">地圖方向探險隊</button> </nav> <main id="activities"></main> <script id="embedded-apps" type="application/json">[]</script> <script>const sources=JSON.parse(document.getElementById("embedded-apps").textContent);const activities=document.getElementById("activities");const buttons=[...document.querySelectorAll("[data-source]")];const frames=new Map;function selectActivity(selected){if(!frames.has(selected)){const frame=document.createElement("iframe");frame.title=buttons[selected].textContent;frame.setAttribute("allow","fullscreen");if(sources[selected])frame.srcdoc=sources[selected];else frame.src=buttons[selected].dataset.source;frames.set(selected,frame);activities.append(frame)}buttons.forEach((button,index)=>{const active=index===selected;button.setAttribute("aria-pressed",String(active));if(frames.has(index))frames.get(index).hidden=!active})}buttons.forEach((button,index)=>{button.onclick=()=>selectActivity(index)});document.addEventListener("dblclick",event=>event.preventDefault(),{passive:false});selectActivity(0)</script> <script>if(window.frameElement){window.frameElement.dispatchEvent(new Event("lesson-dom-ready"));}</script></body> </html>
