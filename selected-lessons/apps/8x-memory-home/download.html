<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下載八的乘法・記憶之家</title>
<style>
:root{font-family:system-ui,"PingFang HK",sans-serif;color:#40365a;background:#e7e2fb}
body{margin:0;min-height:100dvh;display:grid;place-items:center}
main{margin:20px;padding:32px 26px;text-align:center;background:#fffaf0;border:2px solid white;border-radius:24px;box-shadow:0 16px 45px #7d6d992b}
h1{margin:0 0 24px;font-size:clamp(22px,5vw,32px)}
a{display:inline-block;padding:14px 22px;color:#fff;background:#7252a0;border-radius:14px;font-weight:750;text-decoration:none}
a[aria-disabled="true"]{background:#746985}
p{margin:14px 0 0;font-size:14px}
</style>
</head>
<body>
<main>
<h1>八的乘法・記憶之家</h1>
<a id="save" aria-disabled="true">正在準備 HTML…</a>
<p id="status" role="status">下載後可離線開啟。</p>
</main>
<script>
const saveLink=document.getElementById('save');
const statusLabel=document.getElementById('status');
async function readSource(url){
  const response=await fetch(url);
  if(!response.ok)throw new Error('Download failed');
  return response.text();
}
async function prepare(){
  try{
    const source=await readSource('./');
    const engineTag=source.match(/<script src="(https:\/\/cdn\.jsdelivr\.net\/npm\/three@[^"]+)"><\/script>/);
    if(!engineTag||!source.includes('returnOutside'))throw new Error('Unexpected game file');
    const engine=await readSource(engineTag[1]);
    if(engine.length<100000)throw new Error('Unexpected engine file');
    const offline=source.replace(engineTag[0],()=>'<script>\n'+engine.replace(/<\/script/gi,'<\\/script')+'\n<\/script>');
    saveLink.href=URL.createObjectURL(new Blob([offline],{type:'text/html;charset=utf-8'}));
    saveLink.download='8x-memory-house.html';
    saveLink.removeAttribute('aria-disabled');
    saveLink.textContent='下載離線 HTML';
  }catch{
    saveLink.textContent='重新準備下載';
    saveLink.href='./download.html';
    saveLink.removeAttribute('aria-disabled');
    statusLabel.textContent='暫時未能準備檔案，請再試一次。';
  }
}
prepare();
</script>
</body>
</html>
