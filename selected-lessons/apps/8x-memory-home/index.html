<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
let renderer;
try { renderer = new THREE.WebGLRenderer({antialias:true}); }
catch { $('error').hidden = false; return; }
const T = THREE;
const scene = new T.Scene();
const detailScene=new T.Scene();
detailScene.background=new T.Color(0xc4e1d8);
detailScene.add(new T.HemisphereLight(0xfff8df,0xb3b9c9,2.1));
const detailLight=new T.DirectionalLight(0xffecd3,2.05);
detailLight.position.set(-12,28,13);
detailScene.add(detailLight);
scene.background = new T.Color(0xc4e1d8);
scene.fog = new T.Fog(0xc4e1d8,32,61);
const camera = new T.PerspectiveCamera(46,1,.1,110);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputColorSpace = T.SRGBColorSpace;
$('world').append(renderer.domElement);
const canvas = renderer.domElement;
scene.add(new T.HemisphereLight(0xfff8df,0xb3b9c9,2.1));
const sun = new T.DirectionalLight(0xffecd3,2.05);
sun.position.set(-12,28,13);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:21,bottom:-21,near:1,far:65});
sun.shadow.normalBias=.045;
scene.add(sun,sun.target);
const boxes = new T.BoxGeometry(1,1,1);
const balls = new T.SphereGeometry(.5,16,12);
const cylinders = new T.CylinderGeometry(.5,.5,1,20);
const mats = new Map();
const obstacles = [];
function material(color) {
  if (!mats.has(color)) mats.set(color,new T.MeshStandardMaterial({color,roughness:.82}));
  return mats.get(color);
}
function mesh(geometry,x,y,z,w,h,d,color,parent=scene) {
  const m = new T.Mesh(geometry,material(color));
  m.position.set(x,y,z);
  m.scale.set(w,h,d);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}
const box = (x,y,z,w,h,d,c,p) => mesh(boxes,x,y,z,w,h,d,c,p);
const ball = (x,y,z,w,h,d,c,p) => mesh(balls,x,y,z,w,h,d,c,p);
const cyl = (x,y,z,w,h,d,c,p) => mesh(cylinders,x,y,z,w,h,d,c,p);
function group(x,y,z,parent=scene) {
  const g=new T.Group();g.position.set(x,y,z);parent.add(g);return g;
}
const cream=0xffedce, wood=0xb77b53, pale=0xe6a877, leaf=0x689269, teal=0x448b83, navy=0x344e66, rose=0xd8878f;
function solid(x,z,w,d){obstacles.push({x,z,w,d});}
// The rooms follow one winding route, with an approach space in front of each exhibit.
const places=[
 {x:0,z:8.0, floor:0x86afa0, rim:0xdac194, theme:'大門'},
 {x:8.4,z:6.25, floor:0xe9aab0, rim:0xffdabb, theme:'鞋架'},
 {x:13.65,z:0.7, floor:0x99c4a4, rim:0xddebba, theme:'梳化'},
 {x:13.25,z:-7.7, floor:0x54577e, rim:0x867ea6, theme:'電視'},
 {x:6.65,z:-12.5, floor:0xe7ab6c, rim:0xffd992, theme:'飯桌'},
 {x:-1.45,z:-13.35, floor:0x9dd4dc, rim:0xe6f2ee, theme:'雪櫃'},
 {x:-9.25,z:-11.25, floor:0x77b9ab, rim:0xbce4c9, theme:'洗手盆'},
 {x:-14.55,z:-5, floor:0x6d789d, rim:0xcac2f4, theme:'書桌'},
 {x:-13.8,z:3.35, floor:0x6b699c, rim:0xb9a9cc, theme:'睡床'},
 {x:-7.35,z:7.75, floor:0xe3a7be, rim:0xf5dcaf, theme:'衣櫃'}
];
const stations = [
 {name:'大門',x:-12,z:10.8,ax:-12,az:9.25},
 {name:'鞋架',x:-7.6,z:6.8,ax:-9.3,az:6.8},
 {name:'梳化',x:-.8,z:8.1,ax:-.8,az:6.3},
 {name:'電視',x:-.7,z:1.65,ax:-.7,az:3.75},
 {name:'飯桌',x:10.75,z:5.6,ax:10.75,az:8.15},
 {name:'雪櫃',x:14.4,z:2.5,ax:14.2,az:4.06},
 {name:'洗手盆',x:-11.8,z:-9.95,ax:-11.8,az:-8.55},
 {name:'書桌',x:.15,z:-10.15,ax:.15,az:-8.6},
 {name:'睡床',x:9.6,z:-7.8,ax:9.6,az:-5.25},
 {name:'衣櫃',x:14.1,z:-9.55,ax:14.1,az:-7.85}
];
const roomGroups=places.map((p,i)=>{
  p.dx=p.x-stations[i].x;p.dz=p.z-stations[i].z;
  return group(p.dx,0,p.dz);
});
const ground=box(0,-.43,-3,150,.3,124,0x96b9a2);
ground.castShadow=false;
// One continuous floor with a curved perimeter and a shared central area.
const outline=[
 [-17,8],[-13,13],[-4,14],[5,13],[12,11],[18,5.5],[19,-1.5],
 [17.5,-10.5],[13,-15.6],[4,-17.6],[-4.5,-18.6],[-12,-15.6],
 [-18.5,-10],[-20,-3],[-19.3,3.8]
].map(([x,z])=>new T.Vector3(x,0,z));
const hallOutline=new T.CatmullRomCurve3(outline,true).getPoints(104);
function hallFloor(shapePoints,y,color){
  const shape=new T.Shape();
  shapePoints.forEach((p,i)=>{
    if(i===0)shape.moveTo(p.x,-p.z);
    else shape.lineTo(p.x,-p.z);
  });
  shape.closePath();
  const floor=mesh(new T.ShapeGeometry(shape),0,y,0,1,1,1,color);
  floor.rotation.x=-Math.PI/2;
  floor.castShadow=false;
}
hallFloor(hallOutline.map(p=>new T.Vector3(p.x*1.036,0,(p.z+2)*1.036-2)),-.046,0xbd9774);
hallFloor(hallOutline,-.024,0xe8cfaa);
const hub=cyl(0,-.004,-2,12.4,.046,9.2,0xf3dfbd);
hub.castShadow=false;
const hubTrim=new T.Mesh(new T.RingGeometry(.47,.5,64),material(0xcaa885));
hubTrim.rotation.x=-Math.PI/2;
hubTrim.position.set(0,.023,-2);
hubTrim.scale.set(11.2,8.2,1);
scene.add(hubTrim);
for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  const tile=box(Math.cos(a)*2.9,.025,-2+Math.sin(a)*2.25,.56,.012,.56,0xd6b78b);
  tile.rotation.y=Math.PI/4;
  tile.castShadow=false;
}
const sceneryScale=.61;
const sceneryGroups=places.map((p,i)=>{
  const base=stations[i];
  const g=group(p.x-base.x*sceneryScale,0,p.z-base.z*sceneryScale);
  g.scale.set(sceneryScale,1,sceneryScale);
  return g;
});
let insetLayer=0;
function ellipse(x,z,w,d,color,rim,parent){
  const y=insetLayer++*.0013;
  const outer=cyl(x,-.061+y,z,w+.45,.105,d+.45,rim,parent);
  const floor=cyl(x,-.031+y,z,w,.113,d,color,parent);
  outer.castShadow=floor.castShadow=false;
}
function tree(x,z,c,p,scale=1){
  cyl(x,1.13*scale,z,.44*scale,2.26*scale,.44*scale,wood,p);
  ball(x,2.52*scale,z,2.19*scale,2.72*scale,2.17*scale,c,p);
  solid(x*p.scale.x+p.position.x,z*p.scale.z+p.position.z,.55*scale*p.scale.x,.55*scale*p.scale.z);
}
function lamp(x,z,globe,p){
  cyl(x,.09,z,.55,.18,.55,0x7d6d6a,p);
  cyl(x,.97,z,.12,1.80,.12,0x7d6d6a,p);
  ball(x,2.02,z,.45,.50,.45,globe,p);
}
function rail(x,z,w,d,color,p){
  box(x,.43,z,w,.79,d,color,p);
  box(x,.86,z,w+.13,.14,d+.13,0xffe3b1,p);
}
function arch(x,z,w,h,color,p,turn=0){
  const g=group(x,0,z,p);
  g.rotation.y=turn;
  const r=w/2;
  const postHeight=h-r;
  for(const side of [-1,1])box(side*r,postHeight/2,0,.42,postHeight,.43,color,g);
  const points=[];
  for(let i=0;i<=16;i++){
    const a=i*Math.PI/16;
    points.push(new T.Vector3(Math.cos(a)*r,postHeight+Math.sin(a)*r,0));
  }
  mesh(new T.TubeGeometry(new T.CatmullRomCurve3(points),24,.23,7,false),0,0,0,1,1,1,color,g);
}
function tileLine(p,x,z,count,color){
  for(let i=0;i<count;i++)box(x+(i-(count-1)/2)*.63,.022,z,.52,.038,.52,color,p).castShadow=false;
}
function roomBase(i){
  const p=sceneryGroups[i], {x,z}=stations[i], {floor,rim}=places[i];
  const plate=(dx,dz,w,d,c=floor)=>ellipse(x+dx,z+dz,w,d,c,rim,p);
  const b=(dx,y,dz,w,h,d,c)=>{
    if(h>.45&&y-h/2<.2)solid((x+dx)*p.scale.x+p.position.x,(z+dz)*p.scale.z+p.position.z,w*p.scale.x,d*p.scale.z);
    return box(x+dx,y,z+dz,w,h,d,c,p);
  };
  const o=(dx,y,dz,w,h,d,c)=>{
    if(h>.50&&y-h/2<.2)solid((x+dx)*p.scale.x+p.position.x,(z+dz)*p.scale.z+p.position.z,w*.69*p.scale.x,d*.69*p.scale.z);
    return ball(x+dx,y,z+dz,w,h,d,c,p);
  };
  const c=(dx,y,dz,w,h,d,color)=>cyl(x+dx,y,z+dz,w,h,d,color,p);
  switch(i){
    case 0:
      // Shell-shaped entrance courtyard with palms and a golden arch.
      plate(0,0,13.4,12.4);plate(0,-3.5,8.8,8.1,0xa0c2ac);
      arch(0+x,z+1.4,4.2,4.3,0xd8ab72,p);
      for(const side of [-1,1]){
        tree(x+side*4.5,z-2.9,0x689377,p,1.15);
        lamp(x+side*3.2,z-.2,0xffd48d,p);
      }
      for(let j=0;j<7;j++)tileLine(p,x,z-5.8+j*.68,5,j%2?0xcbe5ca:0xe5e5c6);
      break;
    case 1:
      // Round bakery rotunda.
      plate(0,0,12.8,12.8);
      c(0,.04,0,8.0,.06,8.0,0xf6cbd0);c(0,.075,0,5.2,.045,5.2,0xffdfbf);
      for(let j=0;j<6;j++){
        const a=j*Math.PI/3;
        if(j!==0&&j!==3){
          const dx=5.1*Math.cos(a),dz=5.1*Math.sin(a);
          c(dx,1.45,dz,.48,2.9,.48,0xf9dfc8);
          o(dx,3.03,dz,.82,.53,.82,j%2?0xeec97b:0xda879d);
        }
      }
      for(let j=0;j<7;j++)b((j-3)*.55,2.82,-3.9,.52,.14,1.25,j%2?0xe88e9a:cream);
      arch(x,z-3.5,3.6,3.55,0xfadbb0,p);
      break;
    case 2:
      // Garden lounge with a crescent hedge and a curved bench.
      plate(0,0,13.1,11.2);plate(-3.4,1.5,8,8,0xa7cfac);
      for(let j=0;j<8;j++){
        const a=(.73+j*.43)*Math.PI/2;
        o(Math.cos(a)*5,.72,Math.sin(a)*4.5,2.2,1.55,2.0,j%2?0x699a76:0x84ac7a);
      }
      for(const dx of [-4.2,4.2])tree(x+dx,z-3.25,0x719571,p,1.25);
      for(const dx of [-4,-2,2,4])o(dx,.35,2.5,.66,.64,.66,0xf0ca7c);
      break;
    case 3:
      // Cinema fan, with rows of red seats widening away from the screen.
      plate(0,.75,13.1,10.1);plate(0,-3.3,8.9,6.4,0x67668f);
      for(let row=0;row<3;row++)for(const side of [-1,1]){
        for(let seat=0;seat<=row+1;seat++){
          const dx=side*(2.4+seat*.83),dz=-2.2+row*1.7;
          b(dx,.42,dz,.66,.77,.56,0xb7788e);
          b(dx,.85,dz+.21,.68,.64,.18,0x935a7b);
        }
      }
      rail(x,z-4.4,5.18,.22,0x756996,p);
      for(const dx of [-3.9,3.9])lamp(x+dx,z+3.65,0xf2a98e,p);
      break;
    case 4:
      // Long banquet hall, with a central runner and a colonnade.
      plate(0,0,12.4,13.9);plate(0,-3,8.0,10.2,0xf0bf7c);
      b(0,.019,-2,2.15,.033,8.7,0xd68b80);
      for(const dx of [-3.55,3.55])for(const dz of [-4.15,-.6,3.1]){
        c(dx,1.68,dz,.52,3.35,.52,0xf8d7aa);
        c(dx,3.38,dz,.75,.20,.75,0xe5a477);
        lamp(x+dx,z+dz+.85,0xffdc89,p);
      }
      arch(x,z-5.2,4.25,4.2,0xefce9c,p);
      break;
    case 5:
      // Ice gallery. Angular crystals and radial pale-blue flooring.
      plate(0,0,12.6,12.2);plate(0,3.4,8.9,8.1,0xc6e8eb);
      for(let j=0;j<10;j++){
        const a=j*Math.PI/5;
        const shard=mesh(new T.ConeGeometry(.58,2.22,5),x+5*Math.cos(a),1,z+4.1*Math.sin(a),1,1+(j%3)*.32,1,j%2?0xa2d7e3:0xd1edf0,p);

function digitTexture(text,foreground,background,sub=''){

  ctx.fillRect(0,0,512,256);

  }
  const texture=new T.CanvasTexture(image);
  texture.colorSpace=T.SRGBColorSpace;
  texture.anisotropy=renderer.capabilities.getMaxAnisotropy();

}

function renderEntrance(now,dt){
  const t=entryState==='entering'?(now-entryStarted)/1000:0;
  if(entryState==='outside')walkPlayer(now,dt,0,3.8,canWalkOutside);
  else{
    const startX=player.position.x,startZ=player.position.z;
    const straight=Math.abs(entryOrigin.x)<.15;
    const approach=easeEntry(T.MathUtils.clamp(t/.98,0,1));
    const walk=easeEntry(T.MathUtils.clamp((t-(straight ? .38 : .98))/(straight ? 1.83 : 1.23),0,1));
    player.position.x=T.MathUtils.lerp(entryOrigin.x,0,approach);
    player.position.z=straight?T.MathUtils.lerp(entryOrigin.z,-.36,walk):
      T.MathUtils.lerp(T.MathUtils.lerp(entryOrigin.z,3.25,approach),-.36,walk);
    const dx=player.position.x-startX,dz=player.position.z-startZ;
    const moving=Math.hypot(dx,dz)>.001;
    if(moving)player.rotation.y+=trackAngle(Math.atan2(dx,dz),player.rotation.y)*Math.min(1,dt*15);
    animateWalk(now,dt,moving);
  }
  const doorProgress=T.MathUtils.clamp((t-.10)/.93,0,1);
  entryDoor.rotation.y=easeEntry(doorProgress)*Math.PI*.56;
  if(t>=1.94)$('entryFade').classList.add('covered');
  if(t>=2.24){
    scene.add(player);
    player.position.copy(indoorStart);
    player.rotation.y=indoorHeading;
    entryState='inside';
    document.body.classList.remove('outside','entering');
    $('entryFade').classList.remove('covered');
    return false;
  }
  const push=easeEntry(T.MathUtils.clamp(t/2.0,0,1));

  renderer.render(entryScene,entryCamera);
  return true;
}

function animateWalk(now,dt,moving){
  if(moving)gait+=dt*12;
  const swing=moving?Math.sin(gait)*.64:0;
  for(let i=0;i<2;i++){
    const amount=swing*(i===0?1:-1);
    legs[i].rotation.x=T.MathUtils.lerp(legs[i].rotation.x,amount,.23);
    arms[i].rotation.x=T.MathUtils.lerp(arms[i].rotation.x,-amount*.7,.23);
  }
  body.position.y=moving?.065*Math.abs(Math.sin(gait)):.02*Math.sin(now/320);
}
function tick(now){
  const dt=Math.min(.045,(now-last)/1000);last=now;
  if(entryState!=='inside'&&renderEntrance(now,dt)){
    requestAnimationFrame(tick);
    return;
  }
  walkPlayer(now,dt,yaw,5.35,canWalk);
  const target=player.position;
  const doorDistance=Math.hypot(target.x-octopus.position.x,target.z-octopus.position.z);
  introFraming=T.MathUtils.lerp(introFraming,doorDistance<4.4?1:0,1-Math.exp(-dt*4));
  cameraTarget.set(target.x-1.65*introFraming,0,target.z+.64*introFraming);
  follow.lerp(cameraTarget,1-Math.exp(-dt*7));
  let d=(width<height?14.4:12.2)-introFraming*1.53;
  camera.position.set(follow.x+d*Math.cos(pitch)*Math.sin(yaw),1.1+d*Math.sin(pitch),follow.z+d*Math.cos(pitch)*Math.cos(yaw));
  cameraTarget.set(follow.x,1.1,follow.z);
  camera.lookAt(cameraTarget);
  camera.updateMatrixWorld();
  sun.target.position.set(follow.x,0,follow.z);
  sun.position.set(follow.x-12,28,follow.z+13);
  const region=detail?.number===1?places[0]:target;
  roomGroups.forEach((g,i)=>{
    const p=places[i];
    g.visible=(region.x-p.x)**2+(region.z-p.z)**2<32**2;
    sceneryGroups[i].visible=g.visible;
  });
  let best=1.85,newNear=null;
  for(const s of stations){
    const distance=Math.hypot(target.x-s.ax,target.z-s.az);
    if(distance<best){best=distance;newNear=s;}
    const active=distance<1.85;
    s.ring.material.color.set(active?0xffd263:visited.has(s.number-1)?0x8bbeab:0xffffd4);
    s.ring.scale.setScalar(active?1.12+.10*Math.sin(now/240):1);
    s.ring.visible=s.spark.visible=detail===null;
    s.spark.position.y=.34+Math.sin(now/290+s.number)*.08;
  }
  octopusHead.position.y=.038*Math.sin(now/470);
  if(newNear&&!visited.has(newNear.number-1)){
    visited.add(newNear.number-1);
    setGuide();
  }
  near=newNear;
  $('inspect').hidden=!near||visibleOverlay();
  let viewCamera=camera;
  if(detail){
    const f=detail.fact;
    const px=detail.detailModel?.position.x??octopus.position.x;
    const py=f?.y??.4;
    const pz=detail.detailModel?.position.z??octopus.position.z;
    const aspect=width/height;
    const half=Math.max((f?.d??4.1)*.68,(f?.w??4.2)*.61/aspect,1.7);
    detailCamera.left=-half*aspect;detailCamera.right=half*aspect;
    detailCamera.top=f?.view?half*.93:half*1.15;detailCamera.bottom=f?.view?-half*1.07:-half*.85;
    const [eyeX,eyeY,eyeZ]=f?.view??[0,10,f?1.28:-.75];
    const focusY=py+(f?.focus??0);
    detailCamera.position.set(px+eyeX,focusY+eyeY,pz+eyeZ);
    detailCamera.lookAt(px,focusY,pz);
    detailCamera.updateProjectionMatrix();
    detailCamera.updateMatrixWorld();
    viewCamera=detailCamera;
  }
  if((detail?.number===4||(!detail&&roomGroups[3].visible))&&now-lastFootballFrame>=83){
    lastFootballFrame=now;
    drawFootball(now/1000);
  }
  renderer.render(detail?.detailModel?detailScene:scene,viewCamera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();

</script>
