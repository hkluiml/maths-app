<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
let renderer;
try { renderer = new THREE.WebGLRenderer({antialias:true}); }
catch { $('error').hidden = false; return; }
const T = THREE;
const scene = new T.Scene();
const detailScene=new T.Scene();

const boxes = new T.BoxGeometry(1,1,1);

function material(color) {
  if (!mats.has(color)) mats.set(color,new T.MeshStandardMaterial({color,roughness:.82}));
  return mats.get(color);
}
function mesh(geometry,x,y,z,w,h,d,color,parent=scene) {
  const m = new T.Mesh(geometry,material(color));
  m.position.set(x,y,z);
  m.scale.set(w,h,d);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}
const box = (x,y,z,w,h,d,c,p) => mesh(boxes,x,y,z,w,h,d,c,p);

const stations = [
 {name:'大門',x:-12,z:10.8,ax:-12,az:9.25},

 {name:'梳化',x:-.8,z:8.1,ax:-.8,az:6.3},

for(const x of [-.29,.29]){
  ball(x,1.13,-.654,.23,.29,.14,0xfff4df,octopusHead);
  ball(x,1.13,-.72,.104,.154,.075,0x29394b,octopusHead);
  ball(x+.025,1.187,-.757,.046,.044,.035,0xffffff,octopusHead);
  ball(x*1.43,.92,-.624,.21,.12,.072,0xe87f87,octopusHead);
}
const smile=new T.CatmullRomCurve3([
  new T.Vector3(-.125,.943,-.735),new T.Vector3(0,.887,-.766),new T.Vector3(.125,.943,-.735)
]);
mesh(new T.TubeGeometry(smile,12,.025,7,false),0,0,0,1,1,1,0x933d52,octopusHead);
for(let i=0;i<8;i++){
  const arm=group(0,0,0,octopus);
  arm.name="octopus-arm";
  arm.rotation.y=Math.PI+i*Math.PI/4;
  const curve=new T.CatmullRomCurve3([
    new T.Vector3(0,.39,.43),new T.Vector3(-.13,.22,.81),new T.Vector3(-.16,.155,1.17),
    new T.Vector3(.05,.15,1.43),new T.Vector3(.24,.23,1.61),new T.Vector3(.17,.37,1.73)
  ]);
  const tube=new T.TubeGeometry(curve,21,.19,12,false);
  const vertices=tube.attributes.position;
  for(let j=0;j<=21;j++){
    const center=curve.getPointAt(j/21), taper=1-j/28;
    for(let k=0;k<=12;k++){
      const n=j*13+k;
      vertices.setXYZ(n,center.x+(vertices.getX(n)-center.x)*taper,
        center.y+(vertices.getY(n)-center.y)*taper,center.z+(vertices.getZ(n)-center.z)*taper);
    }
  }
  vertices.needsUpdate=true;
  tube.computeVertexNormals();
  mesh(tube,0,0,0,1,1,1,i%2===0?coral:0xec7f6e,arm);
  ball(.17,.37,1.73,.105,.105,.105,coral,arm);
  for(const t of [.42,.58,.74]){
    const p=curve.getPointAt(t);
    cyl(p.x,p.y+.105,p.z,.14,.045,.14,0xffb49b,arm);
    cyl(p.x,p.y+.13,p.z,.066,.011,.066,0xe99181,arm);
  }
}
solid(-12.15,8.64,1.45,1.45);
const shoes=furniture(1);
for(const x of [-.65,.65])box(x,.59,0,.14,1.18,2.28,wood,shoes);
for(const y of [.2,.61,1.06])box(0,y,0,1.35,.14,2.23,pale,shoes);

solid(-7.6,6.8,1.35,2.23);
const sofa=furniture(2);
box(0,.46,0,4.1,.58,1.62,teal,sofa);
box(0,.96,.66,4.08,.95,.47,teal,sofa);
for(const x of [-1.8,1.8])box(x,.80,0,.42,.61,1.58,0x56978c,sofa);
for(const x of [-1.05,0,1.05])box(x,.78,-.12,.98,.24,1.12,0x8cb3a1,sofa);
for(const x of [-1.28,1.2]){const p=box(x,1.1,.44,.62,.55,.27,x<0?0xf2c180:rose,sofa);p.rotation.z=x/6;}
solid(-.8,8.1,4.1,1.75);
const tv=furniture(3);
box(0,.36,0,3.7,.64,.79,wood,tv);
box(0,1.57,0,3.3,1.72,.24,navy,tv);
box(0,1.57,.134,3.02,1.43,.045,0x83bdb8,tv);
box(0,.76,0,1,.13,.62,navy,tv);
solid(-.7,1.65,3.7,.86);
const table=furniture(4);

for(const x of [-1.65,1.65])for(const z of [-.97,.97])box(x,.57,z,.21,1.16,.21,wood,table);


for(const x of [-2.47,2.47]){

const fridge=furniture(5);
box(0,1.26,0,1.7,2.52,1.32,0xd0e4e2,fridge);

solid(14.4,2.5,1.72,1.42);
const sink=furniture(6);
box(0,.51,0,2.7,1.02,1.4,0x7ca5a3,sink);

ball(0,1.21,.15,1.65,.12,1.02,0xb4c8c7,sink);
box(0,1.45,-.43,.13,.59,.14,0x81969d,sink);box(0,1.7,-.24,.13,.14,.52,0x81969d,sink);
box(0,2.14,-.54,1.76,1.2,.13,0xdee8dc,sink);box(0,2.14,-.45,1.56,1,.08,0xa8c8cd,sink);
solid(-11.8,-9.95,2.87,1.55);
const desk=furniture(7);
box(0,1.19,.23,3.94,.20,2.61,pale,desk);

function digitTexture(text,foreground,background,sub=''){
  const image=document.createElement('canvas');
  image.width=512;image.height=256;
  const ctx=image.getContext('2d');
  ctx.fillStyle=background;
  ctx.fillRect(0,0,512,256);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=foreground;
  ctx.font='950 '+(sub?'166':'207')+'px system-ui,sans-serif';
  ctx.fillText(text,256,sub?109:128,476);
  if(sub){
    ctx.font='850 42px system-ui,sans-serif';
    ctx.fillText(sub,256,220,466);
  }
  const texture=new T.CanvasTexture(image);
  texture.colorSpace=T.SRGBColorSpace;
  texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return texture;
}
function numberPlate(parent, text, x,y,z,w,d,fg,bg,sub=''){
  const panel=new T.Mesh(new T.PlaneGeometry(w,d),new T.MeshBasicMaterial({map:digitTexture(text,fg,bg,sub)}));
  panel.rotation.x=-Math.PI/2;
  panel.position.set(x,y,z);
  parent.add(panel);
  return panel;
}
function makeStarGeometry(){
  const outline=new T.Shape();
  for(let i=0;i<10;i++){
    const a=Math.PI/2+i*Math.PI/5,r=i%2?.23:.5;
    if(i===0)outline.moveTo(Math.cos(a)*r,Math.sin(a)*r);
    else outline.lineTo(Math.cos(a)*r,Math.sin(a)*r);
  }
  outline.closePath();
  return new T.ExtrudeGeometry(outline,{depth:.13,steps:1,bevelEnabled:false});
}
function starConstellation(parent){
  box(0,.018,0,2.58,.06,2.28,0x253960,parent);
  // Eight strokes of nine stars trace “72” with clear spaces at the joints.
  const strokes=[
    [-1.13,-.79,-.24,-.79],[-.24,-.79,-.24,0],[-.24,0,-.24,.79],
    [.22,-.79,1.11,-.79],[1.11,-.79,1.11,0],[1.11,0,.22,0],
    [.22,0,.22,.79],[.22,.79,1.11,.79]
  ];
  const stars=new T.InstancedMesh(makeStarGeometry(),material(0xffd66c),72);
  const item=new T.Object3D();
  item.rotation.x=-Math.PI/2;
  item.scale.setScalar(.088);
  strokes.forEach(([x1,z1,x2,z2],row)=>{
    for(let i=0;i<9;i++){
      const t=(i+1)/10;
      item.position.set(x1+(x2-x1)*t,.17,z1+(z2-z1)*t);
      item.updateMatrix();
      stars.setMatrixAt(row*9+i,item.matrix);
    }
  });
  parent.add(stars);
}
function modelFact(fact,total){
  const m=group(fact.x,fact.y,fact.z);
  m.name=fact.kind+'-display';
  m.userData={product:8*total,stars:fact.kind==='stars'?72:0};
  const b=(x,y,z,w,h,d,c)=>box(x,y,z,w,h,d,c,m);
  const c=(x,y,z,w,h,d,color)=>cyl(x,y,z,w,h,d,color,m);
  const o=(x,y,z,w,h,d,color)=>ball(x,y,z,w,h,d,color,m);
  const sign=(text,x,y,z,w,d,fg,bg,sub)=>numberPlate(m,text,x,y,z,w,d,fg,bg,sub);
  switch(fact.kind){
    case 'cake':
      c(0,.055,0,1.54,.11,1.54,0xddd7f5);
      c(0,.26,0,1.36,.38,1.36,0xe7a474);
      c(0,.47,0,1.38,.15,1.38,0xf2a6ba);
      for(let a=0;a<12;a++){
        const angle=a*Math.PI/6;
        o(.58*Math.sin(angle),.55,.58*Math.cos(angle),.125,.13,.125,0xffeee0);
      }
      for(const x of [-.24,.24]){
        b(x,.64,.07,.35,.23,.48,0xfff4d6);
        o(x,.88,-.09,.105,.22,.14,0xffaa46);
      }
      sign('16',0,.759,.07,.69,.40,'#a03965','#fff4d6');
      break;
    case 'clock':
      c(0,.085,0,1.49,.17,1.49,0x477c76);
      c(0,.174,0,1.35,.025,1.35,0xffe9c0);
      for(let a=0;a<12;a++){
        const angle=a*Math.PI/6;
        o(.554*Math.sin(angle),.203,.554*Math.cos(angle),.061,.039,.061,0x477c76);
      }
      sign('24',0,.204,0,.81,.54,'#254c54','#ffe9c0','小時');
      break;
    case 'shirt':
      b(0,.14,-.20,1.28,.23,1.19,0x3e7cb2);
      for(const x of [-.78,.78]) {
        const sleeve=b(x,.135,-.48,.53,.21,.57,0x3e7cb2);
        sleeve.rotation.y=x>0?.38:-.38;
        b(x,.252,-.43,.39,.022,.105,0xe9e9d9);
      }
      c(0,.267,-.727,.34,.035,.23,0x244e73);
      sign('32',0,.261,-.065,.91,.59,'#fff4cd','#3e7cb2');
      break;
    case 'fishball':
      c(-.39,.06,.04,1.34,.11,1.34,0xffe7c6);
      c(-.39,.114,.04,1.13,.035,1.13,0xfff8e7);
      o(-.39,.36,.04,.76,.64,.76,0xd7883b);
      b(.53,.35,.05,1.16,.20,.69,0xfad25e);
      sign('$40',.53,.452,.05,1.08,.63,'#684334','#fad25e');
      break;
    case 'bus':
      b(0,.32,0,1.08,.63,1.87,0xf0ae56);
      b(0,.646,0,1.13,.065,1.88,0xf6c66d);
      b(0,.36,.974,.85,.35,.031,0x487388);
      for(const x of [-.565,.565]) {
        for(const z of [-.58,0,.58])b(x,.46,z,.065,.31,.42,0x5a96af);
        for(const z of [-.64,.64])o(x,.17,z,.28,.30,.34,0x354358);
      }
      sign('48',0,.681,0,.91,1.17,'#394e5d','#f6c66d');
      break;
    case 'bubble':
      o(0,.679,0,1.43,1.30,1.43,0x77cecf);
      o(-.36,1.045,-.34,.46,.34,.29,0xb1e6e4);
      sign('56',0,1.355,0,.73,.41,'#275970','#94dddb');
      break;
    case 'console':
      b(0,.16,0,2.15,.29,1.47,0x7ea99c);
      b(0,.321,-.175,1.62,.035,.73,0x223b4d);
      sign('64',0,.344,-.175,1.51,.64,'#b6f0a4','#223b4d','最高分');
      c(.68,.356,.414,.19,.095,.19,0xf28991);
      c(.40,.356,.414,.19,.095,.19,0xf0c376);
      b(-.54,.353,.41,.31,.051,.113,0x426074);
      b(-.54,.354,.41,.113,.051,.31,0x426074);
      break;
    case 'stars':
      starConstellation(m);
      break;
    case 'balloon': {
      const balloon=o(0,.83,-.12,1.64,1.33,1.88,0xd779ab);
      balloon.rotation.y=.12;
      o(-.43,1.125,-.43,.50,.34,.34,0xeb9bc6);
      o(0,.47,.89,.23,.24,.23,0xd779ab);
      const string=new T.CatmullRomCurve3([new T.Vector3(0,.46,.93),new T.Vector3(.14,.26,1.04),new T.Vector3(.28,.15,1.17)]);
      mesh(new T.TubeGeometry(string,12,.016,6),0,0,0,1,1,1,0x8f587b,m);
      sign('80',0,1.509,-.09,.91,.56,'#592f62','#e88fbd');
      break;
    }
  }
  return m;
}
for(let i=1;i<facts.length;i++){
  const f=facts[i];
  stations[i].fact=f;
  if([3,5,6,9].includes(i)){
    const support=group(f.x,f.y,f.z);
    box(0,-.09,0,f.w+.16,.16,f.d+.15,pale,support);
    box(0,-f.y*.51,0,f.w*.80,f.y*.83,f.d*.8,wood,support);
    solid(f.x,f.z,f.w+.16,f.d+.15);
    stations[i].ax=f.x;
    stations[i].az=f.z+f.d/2+.47;
  }
  const exhibit=modelFact(f,i+1);
  stations[i].exhibit=exhibit;
  const detailModel=exhibit.clone();
  detailModel.visible=false;
  detailScene.add(detailModel);
  
  stations[i].detailModel=detailModel;
}

const player=group(-9.3,0,8.42);
player.rotation.y=-1.25;
const body=group(0,0,0,player);
const avatarGold=0xf3c884, avatarMint=0x437f77, skin=0xf5ccaa, hair=0x37475b;
const coat=mesh(new T.CylinderGeometry(.32,.47,.58,14),0,.88,0,1,1,1,avatarMint,body);
box(0,1.03,-.32,.56,.49,.23,0xbd9363,body);
box(0,1.10,-.45,.47,.13,.04,avatarGold,body);
ball(0,1.43,0,.70,.76,.67,skin,body);
ball(0,1.59,-.11,.77,.58,.73,hair,body);
ball(-.28,1.48,.07,.20,.43,.22,hair,body);
ball(.26,1.47,.05,.16,.35,.24,hair,body);
for(const x of [-.124,.124]){
  ball(x,1.46,.310,.08,.117,.05,navy,body);
  ball(x-.014,1.481,.337,.028,.034,.015,0xffffff,body);
}
cyl(0,1.79,0,.92,.08,.92,0x639e92,body);
ball(0,1.86,-.05,.71,.38,.67,avatarMint,body);
ball(.36,1.83,.04,.18,.20,.16,avatarGold,body);
cyl(0,1.18,0,.55,.11,.48,avatarGold,body);
const scarf=box(.23,.99,-.28,.12,.43,.08,avatarGold,body);scarf.rotation.z=.43;
const legs=[], arms=[];
for(const sign of [-1,1]){
  const leg=group(sign*.19,.60,0,body);legs.push(leg);
  box(0,-.19,0,.22,.40,.22,navy,leg);
  ball(0,-.44,.055,.27,.24,.40,0x546078,leg);
  const arm=group(sign*.405,1.02,0,body);arms.push(arm);
  ball(0,-.13,0,.24,.56,.22,avatarMint,arm);
  ball(0,-.37,.015,.165,.18,.16,skin,arm);
}
function ring(x,z,color,radius){
  const g=new T.Mesh(new T.RingGeometry(radius-.045,radius,45),new T.MeshBasicMaterial({color,side:T.DoubleSide,transparent:true,opacity:.84}));
  g.rotation.x=-Math.PI/2;g.position.set(x,.074,z);scene.add(g);return g;
}
stations.forEach((s,i)=>{
  s.number=i+1;
  s.ring=ring(s.ax,s.az,0xffffb8,.64);
  s.spark=ball(s.ax,.32,s.az,.13,.23,.13,0xffcf70);
});
const arrow=mesh(new T.ConeGeometry(.19,.47,4),0,.12,0,1,1,1,0xffdf7b);
arrow.material= new T.MeshBasicMaterial({color:0xffdf7b});
arrow.rotation.order='YXZ';
arrow.rotation.x=Math.PI/2;
const initialYaw=Math.PI;
const detailCamera=new T.OrthographicCamera(-1,1,1,-1,.1,90);
let detail=null;
let selected=0, near=null, yaw=initialYaw, pitch=.98, drag=null, pointerStick=null;
const visited=new Set([0]);
const keys=new Set();
let joyX=0,joyY=0;
function visibleOverlay(){return detail!==null || !$('mapPanel').hidden;}
function trackAngle(next,old){return Math.atan2(Math.sin(next-old),Math.cos(next-old));}
function focusButton(id){$(id).focus({preventScroll:true});}
function setGuide(){
  $('progress').textContent='已探索 '+visited.size+'／10 站';
  $('guide').textContent=selected===null?'十站完成！可開地圖重溫。':(selected===0?'從大門開始探索':'前往第 '+(selected+1)+' 站 · '+stations[selected].name);
}
function clearControls(){
  keys.clear();joyX=joyY=0;pointerStick=null;drag=null;
  $('knob').style.transform='';
}
function openStation(station){
  if(!station)return;
  clearControls();
  detail=station;
  if(station.detailModel)station.detailModel.visible=true;
  const count=station.number;
  document.body.classList.add('detail');
  $('detailPanel').hidden=false;
  visited.add(count-1);
  setGuide();
  focusButton('closeDetail');
}
function closeStation(){
  if(detail?.detailModel)detail.detailModel.visible=false;
  detail=null;
  document.body.classList.remove('detail');
  $('detailPanel').hidden=true;
  focusButton('mapButton');
}
function closeMap(){$('mapPanel').hidden=true;focusButton('mapButton');}
$('inspect').onclick=()=>openStation(near);
$('closeDetail').onclick=closeStation;
$('closeMap').onclick=closeMap;
$('mapButton').onclick=()=>{
  if(visibleOverlay())return;
  clearControls();
  $('mapGrid').replaceChildren(...stations.map((s,i)=>{
    const b=document.createElement('button');
    b.className='secondary';
    b.textContent=s.name;
    b.onclick=()=>{closeMap();openStation(s);};
    return b;
  }));
  $('mapPanel').hidden=false;
  focusButton('closeMap');
};
$('resetCamera').onclick=()=>{yaw=initialYaw;pitch=.98;};
$('full').onclick=async()=>{
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();
  }catch{}
};
if(!document.fullscreenEnabled)$('full').hidden=true;
window.addEventListener('keydown',e=>{
  if(e.code==='Escape'){
    if(detail)closeStation();
    else if(!$('mapPanel').hidden)closeMap();
    return;
  }
  if(visibleOverlay()) return;
  if(e.code==='KeyE'&&!e.repeat){openStation(near);return;}
  if(/^(Arrow|Key[WASD]$)/.test(e.code)){e.preventDefault();keys.add(e.code);}
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',clearControls);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearControls();});
canvas.onpointerdown=e=>{
  if(visibleOverlay()||drag||e.button!==0)return;
  canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY};
};
canvas.onpointermove=e=>{
  if(drag?.id!==e.pointerId)return;
  yaw-=(e.clientX-drag.x)*.009;
  pitch=Math.max(.49,Math.min(1.27,pitch+(e.clientY-drag.y)*.008));
  drag.x=e.clientX;drag.y=e.clientY;
};
canvas.onpointercancel=canvas.onpointerup=canvas.onlostpointercapture=e=>{if(drag?.id===e.pointerId)drag=null;};
const stick=$('stick');
function updateStick(e){
  const b=stick.getBoundingClientRect();
  let x=(e.clientX-b.left-b.width/2)/(b.width*.32);
  let y=(e.clientY-b.top-b.height/2)/(b.height*.32);
  const l=Math.max(1,Math.hypot(x,y));
  joyX=x/l;joyY=y/l;
  $('knob').style.transform='translate('+joyX*29+'px,'+joyY*29+'px)';
}
stick.onpointerdown=e=>{
  if(pointerStick!==null||visibleOverlay())return;
  pointerStick=e.pointerId;stick.setPointerCapture(e.pointerId);updateStick(e);
};
stick.onpointermove=e=>{if(pointerStick===e.pointerId)updateStick(e);};
stick.onpointercancel=stick.onpointerup=stick.onlostpointercapture=e=>{
  if(pointerStick!==e.pointerId)return;
  joyX=joyY=0;pointerStick=null;$('knob').style.transform='';
};
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
let width=1,height=1;
function resize(){
  width=innerWidth;height=innerHeight;
  camera.aspect=width/height;
  camera.updateProjectionMatrix();
  renderer.setSize(width,height);
}
window.addEventListener('resize',resize);resize();setGuide();
const cameraTarget=new T.Vector3();
const follow=player.position.clone();
let introFraming=1;
function canWalk(x,z){
  return Math.abs(x)<16 && Math.abs(z)<11.65 &&
    !obstacles.some(o=>Math.abs(x-o.x)<o.w/2+.22&&Math.abs(z-o.z)<o.d/2+.22);
}
let last=performance.now(), gait=0;
function tick(now){
  const dt=Math.min(.045,(now-last)/1000);last=now;
  const x=joyX+Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft'));
  const z=joyY+Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));
  const moving=!visibleOverlay()&&Math.hypot(x,z)>.08;
  if(moving){
    const norm=Math.max(1,Math.hypot(x,z));
    const dx=(x*Math.cos(yaw)+z*Math.sin(yaw))/norm;
    const dz=(-x*Math.sin(yaw)+z*Math.cos(yaw))/norm;
    const nx=player.position.x+dx*5.35*dt,nz=player.position.z+dz*5.35*dt;
    if(canWalk(nx,player.position.z))player.position.x=nx;
    if(canWalk(player.position.x,nz))player.position.z=nz;
    player.rotation.y+=trackAngle(Math.atan2(dx,dz),player.rotation.y)*Math.min(1,dt*13);
    gait+=dt*12;
  }
  const swing=moving?Math.sin(gait)*.64:0;
  for(let i=0;i<2;i++){
    const amount=swing*(i===0?1:-1);
    legs[i].rotation.x=T.MathUtils.lerp(legs[i].rotation.x,amount,.23);
    arms[i].rotation.x=T.MathUtils.lerp(arms[i].rotation.x,-amount*.7,.23);
  }
  body.position.y=moving?.065*Math.abs(Math.sin(gait)):.02*Math.sin(now/320);
  const target=player.position;
  const doorDistance=Math.hypot(target.x-octopus.position.x,target.z-octopus.position.z);
  introFraming=T.MathUtils.lerp(introFraming,doorDistance<4.4?1:0,1-Math.exp(-dt*4));
  cameraTarget.set(target.x-1.65*introFraming,0,target.z+.64*introFraming);
  follow.lerp(cameraTarget,1-Math.exp(-dt*7));
  let d=(width<height?14.4:12.2)-introFraming*1.53;
  camera.position.set(follow.x+d*Math.cos(pitch)*Math.sin(yaw),1.1+d*Math.sin(pitch),follow.z+d*Math.cos(pitch)*Math.cos(yaw));
  cameraTarget.set(follow.x,1.1,follow.z);
  camera.lookAt(cameraTarget);
  camera.updateMatrixWorld();
  let best=1.47,newNear=null;
  for(const s of stations){
    const distance=Math.hypot(target.x-s.ax,target.z-s.az);
    if(distance<best){best=distance;newNear=s;}
    const active=s.number-1===selected;
    s.ring.material.color.set(active?0xffd263:visited.has(s.number-1)?0x8bbeab:0xffffd4);
    s.ring.scale.setScalar(active?1.12+.10*Math.sin(now/240):1);
    s.ring.visible=s.spark.visible=detail===null;
    s.spark.position.y=.34+Math.sin(now/290+s.number)*.08;
  }
  octopusHead.position.y=.038*Math.sin(now/470);
  near=newNear;
  $('inspect').hidden=!near||visibleOverlay();
  arrow.visible=selected!==null;
  if(selected!==null){
    const goal=stations[selected];
    const ax=goal.ax-target.x,az=goal.az-target.z;
    const n=Math.hypot(ax,az);
    arrow.visible=detail===null && n>1.55 && !(selected===0 && doorDistance<4.4);
    if(n>1.55){
      arrow.position.set(target.x+ax*.88/n,.13,target.z+az*.88/n);
      arrow.rotation.y=Math.atan2(ax,az);
    }
  }
  let viewCamera=camera;
  if(detail){
    const f=detail.fact;
    const px=f?.x??octopus.position.x;
    const py=f?.y??.4;
    const pz=f?.z??octopus.position.z;
    const aspect=width/height;
    const half=Math.max((f?.d??4.1)*.68,(f?.w??4.2)*.61/aspect,1.7);
    detailCamera.left=-half*aspect;detailCamera.right=half*aspect;
    detailCamera.top=half*1.15;detailCamera.bottom=-half*.85;
    detailCamera.position.set(px,py+10,pz+(f?1.28:-.75));
    detailCamera.lookAt(px,py,pz);
    detailCamera.updateProjectionMatrix();
    detailCamera.updateMatrixWorld();
    viewCamera=detailCamera;
  }
  renderer.render(detail?.detailModel?detailScene:scene,viewCamera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
