<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>乘法分步教學</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,'Microsoft JhengHei',sans-serif;background:#faf8f2;color:#294258}button,select{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:16px;min-height:54px;padding:9px 18px;font-size:24px;font-weight:700;background:#dceaf6;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #6796b7}.app{height:100dvh;padding:16px;max-width:1550px;margin:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px}header{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{font-size:32px;margin:0}.headright{display:flex;align-items:center;gap:12px}.progress{font-size:22px;color:#657b89}select{background:#eee9f4;font-size:22px}.content{min-height:0;display:flex;flex-direction:column;gap:12px}.prompt{text-align:center;font-size:clamp(27px,3.3vw,42px);font-weight:750;margin:0;padding:12px;background:#fff0cf;border-radius:22px}.board{min-height:0;flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;padding:20px;border-radius:25px;background:#eaf4ec}.group{min-height:0;background:#fffdf8;border-radius:20px;padding:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #d2e2d4}.group svg{width:100%;height:100%;max-width:210px}.group.new{animation:in .25s ease-out}.big{font-size:clamp(36px,5.2vw,64px);font-weight:800;text-align:center}.line{border-radius:22px;padding:10px 15px;background:#e7eff8;min-height:80px;display:flex;align-items:center;justify-content:center}.addition{font-size:clamp(25px,3.4vw,42px);font-weight:750;white-space:nowrap}.a{color:#2e739d}.b{color:#946518}.result{color:#397955}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px}.navigation{display:flex;gap:10px}.controls{display:flex;align-items:center;gap:12px}.controls button{background:#ffe3a7;min-width:60px}.controls .small{background:#ebe6f3;font-size:21px}.n{font-size:27px;font-weight:750;min-width:85px;text-align:center}.tablewrap{flex:1;min-height:0;display:grid;place-items:center;background:#edf5ed;border-radius:25px;padding:20px}.table{width:100%;border-collapse:separate;border-spacing:5px;table-layout:fixed;font-size:clamp(23px,3.7vw,46px);text-align:center}.table th,.table td{padding:16px 0;border-radius:12px;background:white}.table th{background:#dceaf7}.table td:first-child{background:#fff0c9;font-weight:750}.cell{display:block;min-height:54px;padding:0;width:100%;background:transparent;font-size:inherit}.selected{background:#fff0bb!important;outline:3px solid #e8bd67}.tablehint{text-align:center;font-size:clamp(30px,4vw,50px);font-weight:750;min-height:60px}.example{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px}.example .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr;align-items:center;padding:20px;min-height:0}.example .group{height:65%;min-height:100px}.work{border-radius:25px;background:#e7eef9;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:20px;text-align:center}.answertext{font-size:clamp(26px,3vw,36px);font-weight:750}.vertical{font-size:clamp(44px,6vw,80px);font-weight:800;border-collapse:collapse;margin:auto;table-layout:fixed}.vertical td,.vertical th{width:75px;text-align:center;padding:3px 8px}.vertical th{font-size:25px;color:#687e8c;font-weight:600}.vertical tr.answer td{border-top:4px solid #446477}.vertical .focus{background:#fff0c9}.reveal{background:#ffe3a7}.muted{color:#718497}.empty{visibility:hidden}@keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@media(max-height:650px){.app{padding:10px;gap:9px}.prompt{padding:8px}.line{min-height:66px;padding:6px}.board{padding:12px;gap:10px}.table th,.table td{padding:10px 0}button,select{min-height:48px}.vertical td{padding:0 8px}.work{gap:10px;padding:12px}}
@media(max-width:700px){.app{padding:10px;gap:9px}h1{font-size:22px}.headright{gap:5px}.progress{font-size:16px}select{font-size:17px;padding:7px;min-height:42px}header{gap:5px}.prompt{font-size:24px}.board{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));padding:10px;gap:8px}.group{padding:5px;border-radius:12px}.line{min-height:64px}.big{font-size:37px}.footer{flex-wrap:wrap;justify-content:center;gap:8px}.controls{width:100%;justify-content:center;gap:8px}button{font-size:19px;padding:8px 14px;min-height:46px}.navigation{width:100%;justify-content:space-between}.tablewrap{padding:10px}.table{border-spacing:4px;font-size:27px}.table th,.table td{padding:4px 0}.cell{min-height:35px}.tablehint{font-size:33px}.example{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px}.example .board{padding:10px;gap:8px}.example .group{height:90%;min-height:0}.work{gap:8px;padding:10px}.answertext{font-size:25px}.vertical{font-size:48px}.vertical td,.vertical th{width:52px}.vertical th{font-size:18px}}

.table .productnotes td{background:transparent!important;padding:0;height:90px;position:relative;outline:none;vertical-align:top}
.productnote{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:max-content;max-width:230%;padding:10px 12px;border-radius:13px;background:#e1d7ed;color:#65517e;font-size:clamp(18px,2.1vw,26px);font-weight:750;white-space:nowrap}
.productnote:before{content:"";position:absolute;left:50%;top:-24px;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:25px solid #e1d7ed}
.vertical .rolecell{width:auto;padding-left:28px;text-align:left;border-top:0!important;white-space:nowrap}
.rolelabel{position:relative;display:inline-block;padding:7px 15px;border-radius:13px;font-size:clamp(24px,3vw,36px);line-height:1.2;background:var(--rolebg);color:var(--rolefg)}
.rolelabel:before{content:"";position:absolute;top:50%;left:-17px;transform:translateY(-50%);border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:18px solid var(--rolebg)}
.role-a{--rolebg:#ffe0b7;--rolefg:#975719}.role-b{--rolebg:#d9edcd;--rolefg:#437345}.role-product{--rolebg:#e1d7ed;--rolefg:#65517e}
@media(max-width:700px){.productnote{font-size:18px;padding:7px 9px}.table .productnotes td{height:75px}.vertical .rolecell{padding-left:20px}.rolelabel{font-size:23px;padding:6px 10px}}

.vertical{--cell:clamp(58px,10vh,82px);font-size:clamp(42px,7vh,64px);border-collapse:collapse}
.vertical td:not(.rolecell){width:var(--cell);min-width:var(--cell);height:var(--cell);padding:0;background:#fff;border:1.5px solid #7cb5cb;text-align:center;vertical-align:middle;line-height:1}
.vertical th{width:var(--cell);padding:0 0 9px;font-size:clamp(20px,3.4vh,28px);line-height:1.1}
.vertical tr.answer td:not(.rolecell){border-top:3px solid #263d4e}
.vertical .rolecell{background:transparent;border:0!important;padding-left:28px;vertical-align:middle}
@media(max-width:700px){.vertical{--cell:55px;font-size:43px}.vertical th{font-size:21px;padding-bottom:8px}.vertical .rolecell{padding-left:20px}}
</style></head><body><main class="app"><header><h1 id="title"></h1><div class="headright"><span class="progress" id="progress"></span><select id="base" aria-label="選擇乘法"><option value="10">10的乘法</option><option value="5">5的乘法</option><option value="reminder-5" disabled>　鞏固</option><option value="2">2的乘法</option><option value="3">3的乘法</option><option value="reminder-3" disabled>　鞏固</option><option value="4">4的乘法</option><option value="reminder-4" disabled>　鞏固</option></select></div></header><section class="content" id="content"></section><footer class="footer"><div class="controls" id="controls"></div><div class="navigation"><button id="prev">‹ 上一部分</button><button id="next">下一部分 ›</button></div></footer></main><script>
const $=id=>document.getElementById(id);let a=10,n=1,stage=0,step=0,tableOpen=false,selected=0;const titles=['逐組認識數量','同數相加與乘式','乘法表','應用題：寫橫式','寫直式'];
function icon(){let art='';if(a===2){for(let j=0;j<2;j++){let x=47+j*57;art+=`<rect x="${x-20}" y="39" width="41" height="41" rx="12" fill="#fafafa" stroke="#b7c1c1" stroke-width="2"/><path d="M${x-20} 51 Q${x} 32 ${x+21} 51 L${x+21} 63 Q${x} 51 ${x-20} 63Z" fill="#ee9a7c"/><path d="M${x-12} 47 l8 10 m6 -14 l8 12" stroke="#fff0e6" stroke-width="4"/>`}}else if(a===3){art='<ellipse cx="80" cy="61" rx="70" ry="45" fill="#f4ddb8" stroke="#b79063" stroke-width="3"/>';for(let j=0;j<3;j++){let x=38+j*42;art+=`<path d="M${x-17} 66 Q${x-15} 32 ${x} 35 Q${x+17} 35 ${x+17} 66 Q${x} 82 ${x-17} 66" fill="#fff9df" stroke="#d3b887" stroke-width="2"/><path d="M${x-9} 47 l5 13 m5 -18 l0 17 m7 -12 l-4 13" stroke="#ddcba7" stroke-width="2"/>`}}else if(a===4){art='<rect x="51" y="5" width="58" height="108" rx="7" fill="#f6c5be" stroke="#be6d65" stroke-width="2"/>';['學','業','進','步'].forEach((v,j)=>art+=`<text x="80" y="${29+j*25}" text-anchor="middle" font-size="21" font-weight="700" fill="#764740">${v}</text>`)}else if(a===5){let points=[];for(let j=0;j<10;j++){let t=-Math.PI/2+j*Math.PI/5,r=j%2?22:49;points.push(`${80+Math.cos(t)*r},${60+Math.sin(t)*r}`)}art=`<polygon points="${points.join(' ')}" fill="#f6cc7e" stroke="#c79649" stroke-width="3"/>`;for(let j=0;j<5;j++){let t=-Math.PI/2+j*2*Math.PI/5;art+=`<circle cx="${80+Math.cos(t)*35}" cy="${60+Math.sin(t)*35}" r="3" fill="#bd914f"/>`}}else{for(let j=0;j<10;j++){let x=26+j%5*27,y=10+Math.floor(j/5)*52;let c=['#eb9d9f','#efc465','#95bf9c','#88b5d5','#b5a3cf'][j%5];art+=`<rect x="${x}" y="${y+10}" width="14" height="34" rx="3" fill="${c}"/><path d="M${x} ${y+10} L${x+7} ${y} L${x+14} ${y+10}" fill="#d4b992"/><path d="M${x+4} ${y+4} L${x+7} ${y} L${x+10} ${y+4}" fill="#566270"/>`}}return `<svg viewBox="0 0 160 120" aria-hidden="true">${art}</svg>`}

function groups(count,added=false){return Array.from({length:count},(_,i)=>`<div class="group ${added&&i===count-1?'new':''}">${icon()}</div>`).join('')}
function equation(count,result=true){return `<span class="a">${a}</span> × <span class="b">${count}</span>${result?` ＝ <span class="result">${a*count}</span>`:''}`}
function parts(){return a===10?[0,1,2,3,4]:a===5?[0,2]:[0]}
function render(added=false){const available=parts(),position=available.indexOf(stage);$('title').textContent=a===10?titles[stage]:stage===0?`${a}的乘法`:`${a}的乘法表`;$('progress').textContent=`${position+1} / ${available.length}`;$('prev').disabled=position===0;$('next').disabled=position===available.length-1;document.querySelector('.navigation').style.display=available.length===1?'none':'';let html='',controls='';if(stage===0||stage===1){html=`<p class="prompt"><span class="b">${n}</span> 個 <span class="a">${a}</span> 是 <span class="result">${a*n}</span></p><div class="board">${groups(n,added)}</div>`;if(a!==10&&stage===0){html+=`<div class="line big">${equation(n)}</div>`}if(stage===1){html=html.replace(/<p class="prompt">.*?<\/p>/,'');html+=`<div class="line addition" id="addition">${Array(n).fill(`<span class="a">${a}</span>`).join(' ＋ ')}</div><div class="line big">${equation(n)}</div>`}controls=`<button id="minus" ${n===1?'disabled':''}>−</button><span class="n">${n} 組</span><button id="plus" ${n===10?'disabled':''}>＋</button><button id="reset" class="small">重來</button>`}else if(stage===2){html=`<div class="tablewrap"><div style="width:100%"><div id="table"></div><div class="tablehint" id="hint">點一下格子</div></div></div>`;controls=`<button id="tableReveal">${tableOpen?'隱藏答案':'顯示全部'}</button><button id="reset" class="small">重來</button>`}else {let unit={10:['枝顏色筆','盒'],5:['粒糖','袋'],2:['件壽司','碟'],3:['隻餃子','籠'],4:['個字','張揮春']}[a];if(stage===3){html=`<p class="prompt">每${unit[1]}有${a}${unit[0]}，3${unit[1]}共有多少？</p><div class="example"><div class="board">${groups(3)}</div><div class="work"><div class="big ${step<1?'empty':''}">${equation(3,false)}</div><div class="big ${step<2?'empty':''}">＝ <span class="result">${a*3}</span>（${unit[0].replace(/^枝|^粒|^件|^隻|^個/,'').length===unit[0].length?'個':unit[0][0]}）</div></div></div>`}else{const top=String(a).padStart(2,' '),ans=String(a*3).padStart(2,' ');html=`<p class="prompt">${equation(3,false)}</p><div class="work" style="flex:1;min-height:0"><table class="vertical"><tr><th></th><th>十<br>位</th><th>個<br>位</th><th></th></tr><tr><td></td><td>${top[0]}</td><td>${top[1]}</td><td class="rolecell"><span class="rolelabel role-a">被乘數</span></td></tr><tr><td><span class="${step<1?'empty':''}">×</span></td><td></td><td><span class="${step<1?'empty':''}">3</span></td><td class="rolecell"><span class="rolelabel role-b ${step<1?'empty':''}">乘數</span></td></tr><tr class="answer"><td></td><td><span class="${step<2?'empty':''}">${ans[0]}</span></td><td><span class="${step<2?'empty':''}">${ans[1]}</span></td><td class="rolecell"><span class="rolelabel role-product ${step<2?'empty':''}">積</span></td></tr></table></div>`}controls=`<button id="reveal" ${step===2?'disabled':''}>${step===0?(stage===3?'列橫式':'放入乘數'):'顯示答案'}</button><button id="reset" class="small">重來</button>`}
$('content').innerHTML=html;$('controls').innerHTML=controls;if(stage===2)drawTable();if($('minus'))$('minus').onclick=()=>{n--;render()};if($('plus'))$('plus').onclick=()=>{n++;render(true)};if($('reveal'))$('reveal').onclick=()=>{step++;render()};if($('tableReveal'))$('tableReveal').onclick=()=>{tableOpen=!tableOpen;selected=0;render()};$('reset').onclick=()=>{n=1;step=0;tableOpen=false;selected=0;render()};fitAddition()}
function drawTable(){let narrow=innerWidth<700;let rows=narrow?[Array.from({length:5},(_,i)=>i+1),Array.from({length:5},(_,i)=>i+6)]:[Array.from({length:10},(_,i)=>i+1)];$('table').innerHTML=rows.map(r=>`<table class="table"><tr><th>×</th>${r.map(i=>`<th>${i}</th>`).join('')}</tr><tr><td>${a}</td>${r.map(i=>`<td class="${selected===i?'selected':''}"><button class="cell" data-i="${i}" aria-label="${a}乘以${i}，點擊顯示答案">${tableOpen||selected===i?a*i:'？'}</button></td>`).join('')}</tr>${a===10?`<tr class="productnotes"><td></td>${r.map(i=>`<td>${i===4||i===9?`<span class="productnote">10 × ${i} 的積</span>`:''}</td>`).join('')}</tr>`:''}</table>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;drawTable()});$('hint').innerHTML=selected?equation(selected):'點一下格子'}
function fitAddition(){if($('addition'))$('addition').style.fontSize=Math.min(42,Math.max(14,($('addition').clientWidth-32)/(n*(a===10?1.35:.7)+(n-1)*1.2)))+'px'}
$('prev').onclick=()=>{stage=parts()[parts().indexOf(stage)-1];n=1;step=0;selected=0;tableOpen=false;render()};$('next').onclick=()=>{stage=parts()[parts().indexOf(stage)+1];n=1;step=0;selected=0;tableOpen=false;render()};$('base').onchange=e=>{a=+e.target.value;stage=0;n=1;step=0;selected=0;tableOpen=false;render()};window.addEventListener('resize',()=>{if(stage===2)drawTable();fitAddition()});render();
</script></body></html>
