const tabs=Array.from(document.querySelectorAll('.tabs button'));
function select(i){frames.forEach((f,j)=>f.hidden=i!==j);tabs.forEach((t,j)=>{t.setAttribute('aria-selected',String(i===j));t.tabIndex=i===j?0:-1;});if(!frames[i].hasAttribute('srcdoc'))frames[i].srcdoc=new TextDecoder().decode(Uint8Array.from(atob(documents[i]),c=>c.charCodeAt(0)));}
