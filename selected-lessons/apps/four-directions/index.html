ive")}else{arrow.classList.remove("highlight-left");btn.classList.remove("active")}}else if(side==="right"){isRightHighlighted=!isRightHighlighted;const arrow=document.getElementById("right-arrow");const btn=document.getElementById("btn-hl-right");if(isRightHighlighted){arrow.classList.add("highlight-right");btn.classList.add("active")}else{arrow.classList.remove("highlight-right");btn.classList.remove("active")}}}</script> </body> </html>
