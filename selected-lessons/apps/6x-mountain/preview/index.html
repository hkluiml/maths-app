'use strict';
const $=s=>document.getElementById(s), KEY='six-mountain-preview';
const STAGES=[['山腳學習',1,5,false,[0],true],['自己爬',1,5,false,[0]],['加快腳步',1,5,false,[5,3]],['森林岔路',1,5,true,[0,3]],['高山學習',6,10,false,[0],true],['高山快步',6,10,false,[5,3]],['高山岔路',6,10,true,[0,3]],['全山探索',1,10,true,[0]],['登頂挑戰',1,10,true,[3]]];
let s={stage:0,phase:0,counts:{},queue:[],n:1,attempt:0,hinted:false,recover:false,answer:'',steps:0,weak:{},completed:false,unlocked:0},active=false,locked=false,deadline=0,remaining=0,token=0;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Number.isInteger(saved.stage)&&saved.stage>=0&&saved.stage<9)s={...s,...saved};}catch(e){}
delete s.adventure;
let playClock=null;
if(typeof s.elapsedMs!=='number'){s.elapsedMs=0;s.timingPartial=s.steps>0;}
function syncTime(){const now=performance.now();if(playClock!==null)s.elapsedMs+=Math.max(0,now-playClock);playClock=active&&!s.completed?now:null;}

function sceneryView(){const zone=s.stage<3?0:s.stage<5?1:s.stage<7?2:3;document.querySelector('.scene').setAttribute('data-zone',zone);$('zoneBadge').textContent=['🌿 草原','🌸 櫻花林','☁️ 雲海','🌙 星空'][zone];}
function save(){syncTime();try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){$('saveLabel').textContent='此瀏覽器未能儲存進度';}}
function cfg(){return STAGES[s.stage]}function limit(){return cfg()[4][s.phase]}function target(){return cfg()[5]?1:2}function facts(){return Array.from({length:cfg()[2]-cfg()[1]+1},(_,i)=>i+cfg()[1])}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQueue(){let a=facts().filter(n=>(s.counts[n]||0)<target());return cfg()[3]?shuffle(a):a}
let routeNow=null,routeTarget=0,lastMotion=0,camera=null;
const reduceMotion=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function position(){let before=STAGES.slice(0,s.stage).reduce((a,c)=>a+c[4].length,0);let total=STAGES.reduce((a,c)=>a+c[4].length,0);let earned=facts().reduce((a,n)=>a+Math.min(target(),s.counts[n]||0),0)/(facts().length*target());routeTarget=s.completed?1:(before+s.phase+earned)/total;if(routeNow===null)routeNow=routeTarget;$('height').textContent=`${Math.round(routeTarget*1800)} m`;$('land').classList.toggle('summited',s.completed);}
function motion(now){const dt=Math.min(.06,lastMotion?(now-lastMotion)/1000:.016);lastMotion=now;if(routeNow===null)return;routeNow=reduceMotion?routeTarget:routeNow+(routeTarget-routeNow)*Math.min(1,dt*5);const p=$('trail').getPointAtLength($('trail').getTotalLength()*routeNow);$('climber').setAttribute('transform',`translate(${p.x} ${p.y})`);let rect=$('land').getBoundingClientRect();if(!rect.width||!rect.height)return;let vh=rect.height<400?360:570,vw=vh*rect.width/rect.height;let tx=Math.max(-50,Math.min(750-vw,p.x-vw*.5)),ty=Math.max(30,Math.min(820-vh,p.y-vh*.65));if(!camera||reduceMotion)camera={x:tx,y:ty};else{camera.x+=(tx-camera.x)*Math.min(1,dt*2.5);camera.y+=(ty-camera.y)*Math.min(1,dt*2.5)}$('land').setAttribute('viewBox',`${camera.x} ${camera.y} ${vw} ${vh}`);}
function celebrate(){const p=$('trail').getPointAtLength($('trail').getTotalLength()*routeTarget);$('sparks').setAttribute('transform',`translate(${p.x} ${p.y-55})`);$('sparks').innerHTML=Array.from({length:12},(_,i)=>{let a=i*Math.PI/6;return `<g class="spark burst" style="--sx:${Math.cos(a)*90}px;--sy:${Math.sin(a)*85-30}px"><path d="M0-8 2-2 8 0 2 2 0 8-2 2-8 0-2-2Z" fill="${['#ffdf63','#ff86b2','#fff','#70e5dc'][i%4]}"/></g>`}).join('');let game=document.querySelector('.game');game.classList.remove('hit');void game.offsetWidth;game.classList.add('hit');}

function render(){const c=cfg();$('stageTag').textContent=`第 ${s.stage+1} / 9 關 · ${c[3]?'隨機出題':'順序練習'}${c[4].length>1?' · 第'+(s.phase+1)+'/2輪':''}`;$('stageTitle').textContent=c[0];$('track').innerHTML=STAGES.map((_,i)=>`<span class="${i<s.stage?'done':i===s.stage?'current':''}"></span>`).join('');$('mastery').innerHTML=facts().map(n=>`<div class="fact ${(s.counts[n]||0)>=target()?'ok':''} ${n===s.n?'now':''}"><strong>×${n}</strong>${Math.min(s.counts[n]||0,target())}/${target()}</div>`).join('');$('factor').textContent=s.n;$('answer').textContent=s.answer||'?';position();sceneryView();}
// silent-climb-v7
function startQuestion(){token++;locked=false;s.answer='';s.attempt=0;s.hinted=false;s.recover=false;$('climber').classList.remove('tired');$('tiredMark').textContent='';$('feedback').textContent='';$('sceneTitle').textContent='一步一步，你做得到。';$('sceneCaption').textContent=cfg()[3]?'這段山路有岔路，試試不按次序也能回答。':'沿路每一題都會練習，熟習了才去下一站。';remaining=limit()*1000;deadline=active&&remaining?performance.now()+remaining:0;$('timeLabel').textContent=limit()?`⏱ ${limit()} 秒`:'慢慢想';$('timerFill').style.width='100%';render();save();}
function next(){if(!s.queue.length)s.queue=makeQueue();if(!s.queue.length){checkpoint();return}s.n=s.queue.shift();startQuestion();}
function fail(timeout){if(locked||!active)return;s.recover=true;s.attempt++;s.weak[s.n]=(s.weak[s.n]||0)+1;deadline=0;s.answer='';$('climber').classList.add('tired');$('tiredMark').textContent='呼…';$('sceneTitle').textContent='累了，休息一下再出發。';$('sceneCaption').textContent='高度保留，再試一次。';$('timeLabel').textContent='慢慢想';$('timerFill').style.width='100%';$('feedback').textContent=timeout?'💤 休息一下':'💡 再試試';render();save();}
function submit(){if(!active||locked||!s.answer)return;if(Number(s.answer)!==s.n*6){fail(false);return}locked=true;deadline=0;const clean=!s.recover&&!s.hinted;const qualifies=clean||!!cfg()[5];if(qualifies)s.counts[s.n]=(s.counts[s.n]||0)+1;else{const idx=Math.min(2,s.queue.length);if(!s.queue.slice(0,3).includes(s.n))s.queue.splice(idx,0,s.n)}s.steps++;$('climber').classList.remove('tired');$('climber').classList.add('step');$('tiredMark').textContent='';$('feedback').textContent='✨ 答對！';$('sceneTitle').textContent='做到了！繼續向上爬。';render();celebrate();save();let t=++token;setTimeout(()=>{if(t!==token||!active)return;$('climber').classList.remove('step');next()},1000);}
function digit(d){if(!active||locked)return;if(deadline&&performance.now()>=deadline){fail(true);return}s.answer=(s.answer+d).slice(-2);$('answer').textContent=s.answer;if(Number(s.answer)===s.n*6)submit();else if(s.answer.length===2)submit();}
function pause(){syncTime();playClock=null;if(deadline)remaining=Math.max(0,deadline-performance.now());deadline=0;active=false;token++;save()}
function resume(){if(s.completed){showResults();return}active=true;syncTime();$('dialog').close();if(locked){locked=false;next()}else{if(limit()&&!s.hinted&&!s.recover)deadline=performance.now()+remaining;render()}}
function modal(html){$('dialog').innerHTML=html;if(!$('dialog').open)$('dialog').showModal()}
// seamless-stages-v8
function checkpoint(){if(s.stage===8){pause();s.completed=true;locked=true;$('climber').classList.remove('step');$('feedback').textContent='🏆 登頂了！';$('sceneTitle').textContent='登頂了！';render();celebrate();save();showResults();return}if(s.phase+1<cfg()[4].length)s.phase++;else{s.stage++;s.phase=0}s.unlocked=Math.max(s.unlocked||0,s.stage);s.counts={};s.queue=[];s.answer='';s.recover=false;active=true;next();}

function freshClimb(){s={stage:0,phase:0,counts:{},queue:[],n:1,attempt:0,hinted:false,recover:false,answer:'',steps:0,weak:{},completed:false,unlocked:0,elapsedMs:0,timingPartial:false};playClock=null;routeNow=0;active=true;locked=false;$('dialog').close();next();}
function showResults(){const retries=Object.values(s.weak).reduce((a,n)=>a+n,0);const seconds=Math.floor((s.elapsedMs||0)/1000),time=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;modal(`<section class="summit-result"><div class="result-confetti" aria-hidden="true">${Array.from({length:18},(_,i)=>`<i style="--x:${i*5.6}%;--d:-${(i*.37).toFixed(1)}s;--c:${['#ffcd70','#b5a0ee','#8de3d4','#ffadc5'][i%4]}"></i>`).join('')}</div><svg class="summit-art" viewBox="0 0 700 380" role="img" aria-label="遊戲人物站在山頂，舉起雙手開心跳躍"><g class="summit-burst" fill="#fff"><path transform="rotate(0 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(30 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(60 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(90 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(120 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(150 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(180 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(210 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(240 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(270 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(300 350 240)" d="M344 210 330 10 370 10 356 210Z"/><path transform="rotate(330 350 240)" d="M344 210 330 10 370 10 356 210Z"/></g><g fill="#fff" opacity=".8"><ellipse cx="110" cy="250" rx="100" ry="20"/><ellipse cx="585" cy="230" rx="100" ry="22"/><ellipse cx="570" cy="215" rx="45" ry="24"/></g><path d="M40 375 180 170 320 375Z" fill="#bdc9f9"/><path d="M410 375 540 140 675 375Z" fill="#d0b9ee"/><path d="M115 380 350 155 590 380Z" fill="#a29cde"/><path d="m350 155-67 64 32-3 35 24 28-24 31 5Z" fill="#fff"/><path d="M170 380Q228 310 350 310T540 380Z" fill="#83d9bf"/><path d="M198 365Q350 289 506 365" fill="none" stroke="#c7f3d7" stroke-width="10" stroke-linecap="round"/><path d="M455 320V115" stroke="#7b78ad" stroke-width="6" stroke-linecap="round"/><path class="flag-party" d="M458 118 540 140 458 167Z" fill="#ff9dbb" stroke="#fff" stroke-width="3"/><path d="m476 143 6 6 13-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><ellipse class="happy-shadow" cx="350" cy="326" rx="48" ry="11" fill="#5f9f9f55"/><g class="happy-jump"><g transform="translate(350 320) scale(1.8)"><g class="happy-arm" fill="none" stroke="#efc29c" stroke-width="9" stroke-linecap="round"><path d="M-9-49-28-69-34-86M10-49 30-68 35-88"/></g><g stroke="#485e98" stroke-width="10" stroke-linecap="round"><path class="leg-a" d="m-7-24-7 29"/><path class="leg-b" d="m13-24 6 26"/></g><rect x="-22" y="-61" width="23" height="33" rx="9" fill="#ff839d"/><path d="M-9-54Q0-63 11-54L13-23H-12Z" fill="#ffb64c" stroke="#e58a3d" stroke-width="2"/><circle cy="-76" r="18" fill="#f6d3ad"/><path d="M-19-80Q-18-103 3-100 22-97 19-79Z" fill="#8c7be0"/><path d="M-23-79H25" stroke="#6653b6" stroke-width="7" stroke-linecap="round"/><path d="m-8-72q3-5 6 0m8 0q3-5 6 0" fill="none" stroke="#395356" stroke-width="2.5" stroke-linecap="round"/><path d="M-2-67 Q5-58 12-67" fill="#fff" stroke="#bf8b71" stroke-width="2"/></g></g><g fill="#ffd978"><path class="happy-spark" d="m220 122 5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/><path class="happy-spark" d="m415 90 4 11 11 4-11 4-4 11-4-11-11-4 11-4Z"/><path class="happy-spark" d="m530 200 4 11 11 4-11 4-4 11-4-11-11-4 11-4Z"/></g></svg><h2>成功登頂！</h2><p class="result-sub">6 的乘法 · 完成</p><div class="result-stats"><div class="result-stat"><b>${s.steps}</b>答對題數</div><div class="result-stat"><b>${retries}</b>重試次數</div><div class="result-stat"><b>${time}</b>${s.timingPartial?'本次用時':'遊玩時間'}</div></div><button class="primary" id="replaySummit">再玩一次</button><button class="secondary" id="summitMenu">⛺ 營地</button></section>`);$('replaySummit').onclick=freshClimb;$('summitMenu').onclick=menu;}

function menu(){pause();modal(`<h2>⛺ 營地</h2><div class="camps">${STAGES.map((c,i)=>`<button class="camp" data-stage="${i}" ${i>Math.max(s.unlocked||0,s.stage)&&!s.completed?'disabled':''}><b>${i<s.stage||s.completed?'✓ ':''}${i+1} ${c[0]}</b><span class="small">6×${c[1]}至${c[2]}</span></button>`).join('')}</div><button class="primary" id="continue">繼續爬！</button><button class="hint-btn" id="restart">重新開始</button>`);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{s.stage=+b.dataset.stage;s.phase=0;s.counts={};s.queue=[];s.completed=false;active=true;$('dialog').close();next()});$('continue').onclick=resume;$('restart').onclick=()=>{modal('<h2>重新開始？</h2><p>進度會清除。</p><button class="primary" id="yes">重新出發</button><button class="soft" id="no">返回</button>');$('no').onclick=menu;$('yes').onclick=()=>{s={stage:0,phase:0,counts:{},queue:[],n:1,attempt:0,hinted:false,recover:false,answer:'',steps:0,weak:{},completed:false,elapsedMs:0,timingPartial:false};playClock=null;active=true;$('dialog').close();next()}};}
$('menu').onclick=menu;$('dialog').addEventListener('cancel',e=>{e.preventDefault();resume()});
$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'確認'].map(k=>`<button class="key ${k==='⌫'?'del':k==='確認'?'enter':''}" data-key="${k}">${k}</button>`).join('');function key(k){if(!active||locked)return;if(k==='⌫'){s.answer=s.answer.slice(0,-1);$('answer').textContent=s.answer||'?'}else if(k==='確認')submit();else digit(k)}$('keypad').onclick=e=>{let b=e.target.closest('[data-key]');if(b)key(b.dataset.key)};document.addEventListener('keydown',e=>{if($('dialog').open)return;if(/^\d$/.test(e.key)){e.preventDefault();key(e.key)}else if(e.key==='Backspace'){e.preventDefault();key('⌫')}else if(e.key==='Enter'){e.preventDefault();key('確認')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){pause();modal('<h2>休息一下</h2><p></p><button class="primary" id="back">繼續爬！</button>');$('back').onclick=resume}});
function tick(now){motion(now);if(active&&deadline&&!locked){let left=deadline-now;$('timerFill').style.width=Math.max(0,left/(limit()*1000)*100)+'%';$('timerFill').style.background=left<1000?'#e6a078':'#75b6a0';$('timeLabel').textContent=`⏱ ${(Math.max(0,left)/1000).toFixed(1)}`;if(left<=0)fail(true)}requestAnimationFrame(tick)}
active=false;s.stage=8;s.phase=0;s.n=10;s.answer='60';s.completed=true;s.steps=140;s.weak={7:2,8:1};s.elapsedMs=492000;s.timingPartial=false;routeNow=1;render();showResults();requestAnimationFrame(tick);
</script></html>
