:root{font-family:'PingFang HK','Microsoft JhengHei',system-ui,sans-serif;color:#294852;background:#dff3f0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;color:inherit}button:disabled{opacity:.4;cursor:default}button:active{transform:scale(.94);filter:brightness(.93)}button{transition:transform .15s,filter .4s}#app{height:100dvh;display:grid;grid-template-columns:1.1fr 1fr;max-width:1600px;margin:auto;overflow:hidden}header{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;z-index:2}h1{font-size:22px;margin:0}.pill{background:#ffffffd9;padding:9px 15px;border-radius:30px;font-weight:800}.scene{position:relative;overflow:hidden;background:linear-gradient(#a7dbe7,#e8f5d9)}#land{width:100%;height:100%;position:absolute}.scene-note{position:absolute;bottom:24px;left:22px;right:22px;background:#fff9;padding:14px 18px;border:2px solid #fff9;border-radius:22px}.scene-note b{font-size:24px}.scene-note p{margin:5px 0 0;font-size:14px}.game{background:#fffcf4;display:flex;flex-direction:column;gap:12px;padding:24px;min-height:0;z-index:3}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.soft{background:#edf1e9;border-radius:14px;padding:10px 14px;font-weight:700}.tag{font-size:13px;letter-spacing:1px;color:#607c73}.stage-title{font-size:clamp(22px,2.5vw,35px);margin:3px 0}.track{display:flex;gap:5px}.track span{height:7px;background:#e0e7dd;flex:1;border-radius:9px}.track .done{background:#65a58c}.track .current{background:#f1b45d}.mastery{display:flex;justify-content:center;gap:8px}.fact{border:2px solid #e1e8de;padding:5px 10px;border-radius:14px;text-align:center;min-width:35px;font-size:13px}.fact strong{display:block;font-size:17px}.fact.ok{background:#d8efdf;border-color:#85b99c}.fact.now{border-color:#dfa342}.question{flex:1;min-height:0;display:flex;flex-direction:column;just px 25px;font-size:20px;font-weight:bold;width:100%;margin-top:10px}.camps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.camp{background:#edf1e7;padding:12px 5px;border-radius:12px}.camp b{display:block}.small{font-size:13px;color:#71867d}#startInfo{padding:13px;background:#edf4e6;border-radius:15px;line-height:1.7}.sun{animation:glow 4s ease-in-out infinite alternate}@keyframes glow{to{opacity:.7}}@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:35% 65%}header{padding:10px 14px}h1{font-size:17px}.pill{font-size:12px}.scene-note{bottom:8px;left:14px;right:14px;padding:8px 12px}.scene-note b{font-size:18px}.scene-note p{font-size:11px;margin:0}.game{padding:12px 16px;gap:7px}.stage-title{font-size:23px}.question{gap:3px}.equation{font-size:48px}.hint{font-size:15px;padding:6px}.groups{margin:3px auto}.key{min-height:43px;font-size:23px;border-radius:12px}.mastery{gap:4px}.fact{padding:2px 7px;font-size:10px;min-width:23px}.fact strong{font-size:13px}.keypad{gap:5px}.feedback{font-size:14px;min-height:20px}.tag{font-size:11px}.foot{font-size:10px}.soft{padding:7px 10px}.time-label{font-size:12px;min-height:15px}}@media(max-height:650px) and (min-width:701px){.game{padding:14px;gap:6px}.key{min-height:44px}.equation{font-size:55px}.hint{font-size:15px;padding:6px}.groups{margin:3px}.question{gap:3px}}
</style><div class="ios-blur-fix" aria-hidden="true"></div><main id="app"><section class="scene"><header><h1>6的乘法・登山隊</h1><span class="pill" id="height">山腳 · 0 m</span></header><svg id="land" viewBox="0 0 700 800" preserveAspectRatio="xMidYMid slice" aria-label="登山路線"><defs><linearGradient id="mount" x2="0" y2="1"><stop stop-color="#7ca9a0"/><stop offset="1" stop-color="#c2d7ac"/></linearGradient></defs><circle class="sun" cx="530" cy="160" r="55" fill="#fff1a8"/><g fill="#fff" opacity=".65"><ellipse cx="140" cy="180" rx="100" ry="22"/><ellipse cx="115" cy="164" rx="38" ry="28"/><ellipse cx="570" cy="290" rx="110" ry="25"/></g><path d="M-150 690 160 290 360 630 560 240 850 700Z" fill="#b7d6ce"/><path d="M-80 820 360 110 820 820Z" fill="url(#mount)"/><path d="m360 110-76 122 46-12 30 24 30-34 52 29Z" fill="#f4faf3"/><path d="M-50 760Q130 590 295 720T780 680V850H-50" fill="#88b5a0"/><path id="trail" d="M180 710 Q530 660 425 600 T230 495 T410 390 T350 250" fill="none" stroke="#f5e5b8" stroke-width="24" stroke-linecap="round"/><path d="M180 710 Q530 660 425 600 T230 495 T410 390 T350 250" fill="none" stroke="#d3bb89" stroke-width="2" stroke-dasharray="3 10"/><g id="flags"></g><g transform="translate(350 250)"><path d="M0 0V-52" stroke="#547365" stroke-width="5"/><path d="M3-52 50-40 3-26" fill="#e99a72"/></g><g id="climber"><ellipse cy="8" rx="23" ry="7" fill="#496d5b33"/><g id="person"><path d="m-7-24-7 29m20-29 13 26" stroke="#4a5a67" stroke-width="10" stroke-linecap="round"/><rect x="-22" y="-61" width="23" height="33" rx="9" fill="#c58d66"/><path d="M-9-54Q0-63 11-54L13-23H-12Z" fill="#f4bf60" stroke="#d9a24a" stroke-width="2"/><path d="m9-49 15 19 7-15M-8-49-18-34" fill="none" stroke="#efc29c" stroke-width="8" stroke-linecap="round"/><path d="m31-44-4 52" stroke="#6f8870" stroke-width="3"/><circle cy="-76" r="18" fill="#f6d3ad"/><path d="M-19-80Q-18-103 3-100 22-97 19-79Z" fill="#6fa69b"/><path d="M-23-79H25" stroke="#4c8c82" stroke-width="7" stroke-linecap="round"/><circle cx="7" cy="-73" r="2" fill="#395356"/><path d="m5-65 6-1" stroke="#bf8b71" stroke-width="2"/></g><text id="tiredMark" x="15" y="-112" font-size="26" fill="#54796e"></text></g><g fill="#4f8e76"><path d="m80 670-30 75h60Z"/><path d="m605 580-28 78h56Z"/><path d="m610 690-35 90h70Z"/></g></svg><div class="scene-note"><b id="sceneTitle">今天，一起爬上山頂。</b><p id="sceneCaption">每答對一步，就離山頂近一步。</p></div></section><section class="game"><div class="top"><div><div class="tag" id="stageTag">循序漸進 · 九個營地</div><h2 class="stage-title" id="stageTitle">準備出發</h2></div><button class="soft" id="menu">營地 ☰</button></div><div class="track" id="track"></div><div class="mastery" id="mastery"></div><div class="question"><div class="time-label" id="timeLabel">不限時間，慢慢想</div><div class="timer"><i id="timerFill"></i></div><div class="equation">6 × <span id="factor">1</span> = <span class="answer" id="answer">?</span></div><div id="hint" class="hint" hidden></div><div class="feedback" id="feedback" aria-live="polite">準備好就出發吧！</div></div><div class="keypad" id="keypad"></div><div class="foot"><span id="saveLabel">進度會儲存在這部裝置</span><button class="hint-btn" id="help">看看提示</button></div></section></main><dialog id="dialog"></dialog><script>
'use strict';
const $=s=>document.getElementById(s), KEY='six-mountain-v1';
const STAGES=[['山腳學習',1,5,false,[0],true],['自己爬',1,5,false,[0]],['加快腳步',1,5,false,[5,3]],['森林岔路',1,5,true,[0,3]],['高山學習',6,10,false,[0],true],['高山快步',6,10,false,[5,3]],['高山岔路',6,10,true,[0,3]],['全山探索',1,10,true,[0]],['登頂挑戰',1,10,true,[3]]];
let s={stage:0,phase:0,counts:{},queue:[],n:1,attempt:0,hinted:false,recover:false,answer:'',steps:0,weak:{},completed:false,unlocked:0},active=false,locked=false,deadline=0,remaining=0,token=0;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Number.isInteger(saved.stage)&&saved.stage>=0&&saved.stage<9)s={...s,...saved};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){$('saveLabel').textContent='此瀏覽器未能儲存進度';}}
function cfg(){return STAGES[s.stage]}function limit(){return cfg()[4][s.phase]}function target(){return cfg()[5]?1:2}function facts(){return Array.from({length:cfg()[2]-cfg()[1]+1},(_,i)=>i+cfg()[1])}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQueue(){let a=facts().filter(n=>(s.counts[n]||0)<target());return cfg()[3]?shuffle(a):a}
function position(){const p=$('trail'),total=16,completed=s.stage*2+s.phase;let earned=facts().reduce((a,n)=>a+Math.min(target(),s.counts[n]||0),0)/(facts().length*target());let ratio=s.completed?1:Math.min(.97,(completed+earned)/(18));const point=p.getPointAtLength(p.getTotalLength()*ratio);$('climber').setAttribute('transform',`translate(${point.x} ${point.y})`);$('height').textContent=`${s.completed?'山頂':'第'+(s.stage+1)+'營地'} · ${Math.round(ratio*1800)} m`;}
function render(){const c=cfg();$('stageTag').textContent=`第 ${s.stage+1} / 9 關 · ${c[3]?'隨機出題':'順序練習'}${c[4].length>1?' · 第'+(s.phase+1)+'/2輪':''}`;$('stageTitle').textContent=c[0];$('track').innerHTML=STAGES.map((_,i)=>`<span class="${i<s.stage?'done':i===s.stage?'current':''}"></span>`).join('');$('mastery').innerHTML=facts().map(n=>`<div class="fact ${(s.counts[n]||0)>=target()?'ok':''} ${n===s.n?'now':''}"><strong>×${n}</strong>${Math.min(s.counts[n]||0,target())}/${target()}</div>`).join('');$('factor').textContent=s.n;$('answer').textContent=s.answer||'?';$('help').disabled=locked||s.recover||!!cfg()[5];position();}
function hintHtml(){let n=s.n,groups=Array.from({length:n},()=>'<span class="group">'+('<i></i>'.repeat(6))+'</span>').join('');let rule=n===1?'1組6，就是6。':n<=5?`已有 ${n-1} 組6：${6*(n-1)}＋6＝${6*n}`:n===6?'5組6是30，再加1組6：30＋6＝36':`6 × ${n-1}＝${6*(n-1)}，再加6是 ${6*n}`;return `<p>${n}組，每組6粒</p><div class="groups">${groups}</div><p>${rule}</p><p><b>6 × ${n}＝${6*n}</b></p>`;}
function showHint(){s.hinted=true;$('hint').hidden=false;$('hint').innerHTML=hintHtml();deadline=0;$('timeLabel').textContent='學習時間 · 看完提示再輸入答案';$('timerFill').style.width='100%';save();}
function startQuestion(){token++;locked=false;s.answer='';s.attempt=0;s.hinted=!!cfg()[5];s.recover=false;$('climber').classList.remove('tired');$('tiredMark').textContent='';$('hint').hidden=!cfg()[5];if(cfg()[5])$('hint').innerHTML=hintHtml();$('feedback').textContent=cfg()[5]?'看看每組6粒，再輸入答案。':'輸入正確答案便會自動前進。';$('sceneTitle').textContent='一步一步，你做得到。';$('sceneCaption').textContent=cfg()[3]?'這段山路有岔路，試試不按次序也能回答。':'沿路每一題都會練習，熟習了才去下一站。';remaining=limit()*1000;deadline=active&&remaining?performance.now()+remaining:0;$('timeLabel').textContent=limit()?`每題 ${limit()} 秒`:'不限時間，慢慢想';$('timerFill').style.width='100%';render();save();}
function next(){if(!s.queue.length)s.queue=makeQueue();if(!s.queue.length){checkpoint();return}s.n=s.queue.shift();startQuestion();}
function fail(timeout){if(locked||!active)return;s.recover=true;s.attempt++;s.weak[s.n]=(s.weak[s.n]||0)+1;deadline=0;s.answer='';$('climber').classList.add('tired');$('tiredMark').textContent='呼…';$('sceneTitle').textContent='累了，休息一下再出發。';$('sceneCaption').textContent='高度保留！看一看提示，幫登山隊補充力氣。';showHint();$('feedback').textContent=timeout?'時間到了，看看方法，再試一次。':'再想一想，看完提示再試一次。';render();save();}
function submit(){if(!active||locked||!s.answer)return;if(Number(s.answer)!==s.n*6){fail(false);return}locked=true;deadline=0;const clean=!s.recover&&!s.hinted;const qualifies=clean||!!cfg()[5];if(qualifies)s.counts[s.n]=(s.counts[s.n]||0)+1;else{const idx=Math.min(2,s.queue.length);if(!s.queue.slice(0,3).includes(s.n))s.queue.splice(idx,0,s.n)}s.steps++;$('climber').classList.remove('tired');$('climber').classList.add('step');$('tiredMark').textContent='';$('hint').hidden=true;$('feedback').textContent=qualifies?'答對了！向上一步。':'答對了！稍後再試一次，看看能否自己答出來。';$('sceneTitle').textContent='做到了！繼續向上爬。';render();save();let t=++token;setTimeout(()=>{if(t!==token)return;$('climber').classList.remove('step');next()},650);}
function digit(d){if(!active||locked)return;if(deadline&&performance.now()>=deadline){fail(true);return}s.answer=(s.answer+d).slice(-2);$('answer').textContent=s.answer;if(Number(s.answer)===s.n*6)submit();else if(s.answer.length===2)submit();}
function pause(){if(deadline)remaining=Math.max(0,deadline-performance.now());deadline=0;active=false;token++}
function resume(){active=true;$('dialog').close();if(locked){locked=false;next()}else{if(limit()&&!s.hinted&&!s.recover)deadline=performance.now()+remaining;render()}}
function modal(html){$('dialog').innerHTML=html;if(!$('dialog').open)$('dialog').showModal()}
function checkpoint(){pause();let final=s.stage===8;modal(`<div class="tag">${final?'完成登山':'抵達補給站'}</div><h2>${final?'成功登頂！':'這一段學會了！'}</h2><p>${final?'你已完成6×1至10的學習與限時挑戰。下次再來挑戰，讓記憶更牢固。':'每一道題都完成了，喝口水，再走下一段。'}</p><button class="primary" id="advance">${final?'完成登山':'前往下一段'}</button>`);if(final){s.completed=true;save();render()}$('advance').onclick=()=>{if(final){menu();return}if(s.phase+1<cfg()[4].length)s.phase++;else{s.stage++;s.phase=0}s.unlocked=Math.max(s.unlocked||0,s.stage);s.counts={};s.queue=[];s.answer='';s.recover=false;active=true;$('dialog').close();next()};}
function menu(){pause();modal(`<h2>登山營地</h2><p class="small">綠色營地已完成。可以回去重練，尚未到達的營地會逐步開放。</p><div class="camps">${STAGES.map((c,i)=>`<button class="camp" data-stage="${i}" ${i>Math.max(s.unlocked||0,s.stage)&&!s.completed?'disabled':''}><b>${i<s.stage||s.completed?'✓ ':''}${i+1} ${c[0]}</b><span class="small">6×${c[1]}至${c[2]}</span></button>`).join('')}</div><button class="primary" id="continue">繼續登山</button><button class="hint-btn" id="restart">清除進度，重新開始</button>`);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{s.stage=+b.dataset.stage;s.phase=0;s.counts={};s.queue=[];s.completed=false;active=true;$('dialog').close();next()});$('continue').onclick=resume;$('restart').onclick=()=>{modal('<h2>重新開始？</h2><p>這部裝置的登山進度會被清除。</p><button class="primary" id="yes">確定重新開始</button><button class="soft" id="no">保留進度</button>');$('no').onclick=menu;$('yes').onclick=()=>{s={stage:0,phase:0,counts:{},queue:[],n:1,attempt:0,hinted:false,recover:false,answer:'',steps:0,weak:{},completed:false};active=true;$('dialog').close();next()}};}
$('menu').onclick=menu;$('help').onclick=()=>{if(active&&!locked)showHint()};$('dialog').addEventListener('cancel',e=>{e.preventDefault();resume()});
$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'確認'].map(k=>`<button class="key ${k==='⌫'?'del':k==='確認'?'enter':''}" data-key="${k}">${k}</button>`).join('');function key(k){if(!active||locked)return;if(k==='⌫'){s.answer=s.answer.slice(0,-1);$('answer').textContent=s.answer||'?'}else if(k==='確認')submit();else digit(k)}$('keypad').onclick=e=>{let b=e.target.closest('[data-key]');if(b)key(b.dataset.key)};document.addEventListener('keydown',e=>{if($('dialog').open)return;if(/^\d$/.test(e.key)){e.preventDefault();key(e.key)}else if(e.key==='Backspace'){e.preventDefault();key('⌫')}else if(e.key==='Enter'){e.preventDefault();key('確認')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){pause();modal('<h2>休息一下</h2><p>已暫停計時，準備好再繼續。</p><button class="primary" id="back">繼續登山</button>');$('back').onclick=resume}});
function tick(now){if(active&&deadline&&!locked){let left=deadline-now;$('timerFill').style.width=Math.max(0,left/(limit()*1000)*100)+'%';$('timerFill').style.background=left<1000?'#e6a078':'#75b6a0';$('timeLabel').textContent=`餘下 ${(Math.max(0,left)/1000).toFixed(1)} 秒`;if(left<=0)fail(true)}requestAnimationFrame(tick)}
render();modal(`<div class="tag">從第一步，到山頂</div><h2>6的乘法・登山隊</h2><p>先學會，再加快；先順序，再隨機。</p><div id="startInfo">① 答對便向上爬，答案會自動提交。<br>② 累倒時看看提示，答對再出發。<br>③ 每一題都練熟，才會開放下一段山路。</div><p class="small">不限時學習 → 5秒練習 → 3秒挑戰<br>進度只儲存在目前的瀏覽器，適合個人練習。</p><button class="primary" id="go">${s.steps?'繼續上次登山':'開始登山'}</button>`);$('go').onclick=()=>{active=true;$('dialog').close();if(s.completed){menu();return}if((s.counts[s.n]||0)>=target()){next()}else if(s.steps||s.queue.length){startQuestion()}else next()};requestAnimationFrame(tick);
</script></html>
