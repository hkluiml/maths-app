function stopChant(){audioGeneration++;if(currentChant){currentChant.onended=null;currentChant.onerror=null;currentChant.pause();currentChant.currentTime=0;currentChant=null}if('speechSynthesis' in window)window.speechSynthesis.cancel();}
function speakChant(n,done){stopChant();const generation=audioGeneration,begun=performance.now();let finished=false;const finish=()=>{if(finished||generation!==audioGeneration)return;finished=true;setTimeout(()=>{if(generation===audioGeneration)done()},Math.max(0,1000-(performance.now()-begun)))};let audio=new Audio(CHANT_AUDIO[n]);currentChant=audio;audio.preload='auto';audio.onended=finish;const fallback=()=>{if(finished||generation!==audioGeneration)return;audio.onerror=null;speakBrowserChant(n,finish)};audio.onerror=fallback;try{audio.play().catch(fallback)}catch(e){fallback()}setTimeout(()=>{if(!finished&&generation===audioGeneration){audio.pause();finish()}},10000);}
function speakBrowserChant(n,done){const begun=performance.now();let ended=false;const finish=()=>{if(ended)return;ended=true;setTimeout(done,Math.max(0,1000-(performance.now()-begun)))};const voice=loadCantonese();if(!voice){$('feedback').textContent='🔇 粵語語音未可用';setTimeout(finish,1200);return}const synth=window.speechSynthesis;const u=new SpeechSynthesisUtterance(SPOKEN[n]);u.voice=voice;u.lang=voice.lang;u.rate=.85;u.pitch=1.05;u.volume=1;u.onend=finish;u.onerror=()=>{$('feedback').textContent='🔇 請檢查聲音';finish()};synth.cancel();synth.resume();synth.speak(u);setTimeout(()=>{if(!ended){synth.cancel();finish()}},6500);}
function startQuestion(){token++;locked=false;s.answer='';s.attempt=0;s.hinted=false;s.recover=false;$('climber').classList.remove('tired');$('tiredMark').textContent='';$('feedback').textContent='';$('sceneTitle').textContent='一步一步，你做得到。';$('sceneCaption').textContent=cfg()[3]?'這段山路有岔路，試試不按次序也能回答。':'沿路每一題都會練習，熟習了才去下一站。';remaining=limit()*1000;deadline=active&&remaining?performance.now()+remaining:0;$('timeLabel').textContent=limit()?`⏱ ${limit()} 秒`:'慢慢想';$('timerFill').style.width='100%';render();save();}
function next(){if(!s.queue.length)s.queue=makeQueue();if(!s.queue.length){checkpoint();return}s.n=s.queue.shift();startQuestion();}
function fail(timeout){if(locked||!active)return;s.recover=true;s.attempt++;s.weak[s.n]=(s.weak[s.n]||0)+1;deadline=0;s.answer='';$('climber').classList.add('tired');$('tiredMark').textContent='呼…';$('sceneTitle').textContent='累了，休息一下再出發。';$('sceneCaption').textContent='高度保留，再試一次。';$('timeLabel').textContent='慢慢想';$('timerFill').style.width='100%';$('feedback').textContent=timeout?'💤 休息一下':'💡 再試試';render();save();}
function submit(){if(!active||locked||!s.answer)return;if(Number(s.answer)!==s.n*6){fail(false);return}locked=true;deadline=0;const clean=!s.recover&&!s.hinted;const qualifies=clean||!!cfg()[5];if(qualifies)s.counts[s.n]=(s.counts[s.n]||0)+1;else{const idx=Math.min(2,s.queue.length);if(!s.queue.slice(0,3).includes(s.n))s.queue.splice(idx,0,s.n)}s.steps++;$('climber').classList.remove('tired');$('climber').classList.add('step');$('tiredMark').textContent='';$('feedback').textContent='🔊 '+CHANTS[s.n];$('sceneTitle').textContent='做到了！繼續向上爬。';render();celebrate();save();let t=++token;speakChant(s.n,()=>{if(t!==token||!active)return;$('climber').classList.remove('step');next()});}
function digit(d){if(!active||locked)return;if(deadline&&performance.now()>=deadline){fail(true);return}s.answer=(s.answer+d).slice(-2);$('answer').textContent=s.answer;if(Number(s.answer)===s.n*6)submit();else if(s.answer.length===2)submit();}
function pause(){stopChant();if(deadline)remaining=Math.max(0,deadline-performance.now());deadline=0;active=false;token++}
function resume(){active=true;$('dialog').close();if(locked){locked=false;next()}else{if(limit()&&!s.hinted&&!s.recover)deadline=performance.now()+remaining;render()}}
function modal(html){$('dialog').innerHTML=html;if(!$('dialog').open)$('dialog').showModal()}
function checkpoint(){pause();let final=s.stage===8;modal(`<div class="dialog-icon">${final?'🏆':'⛺'}</div><h2>${final?'登頂了！':'過關！'}</h2><button class="primary" id="advance">${final?'🏆 完成':'繼續爬！'}</button>`);if(final){s.completed=true;save();render()}$('advance').onclick=()=>{if(final){menu();return}if(s.phase+1<cfg()[4].length)s.phase++;else{s.stage++;s.phase=0}s.unlocked=Math.max(s.unlocked||0,s.stage);s.counts={};s.queue=[];s.answer='';s.recover=false;active=true;$('dialog').close();next()};}
function menu(){pause();modal(`<h2>⛺ 營地</h2><div class="camps">${STAGES.map((c,i)=>`<button class="camp" data-stage="${i}" ${i>Math.max(s.unlocked||0,s.stage)&&!s.completed?'disabled':''}><b>${i<s.stage||s.completed?'✓ ':''}${i+1} ${c[0]}</b><span class="small">6×${c[1]}至${c[2]}</span></button>`).join('')}</div><button class="primary" id="continue">繼續爬！</button><button class="hint-btn" id="restart">重新開始</button>`);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{s.stage=+b.dataset.stage;s.phase=0;s.counts={};s.queue=[];s.completed=false;active=true;$('dialog').close();next()});$('continue').onclick=resume;$('restart').onclick=()=>{modal('<h2>重新開始？</h2><p>進度會清除。</p><button class="primary" id="yes">重新出發</button><button class="soft" id="no">返回</button>');$('no').onclick=menu;$('yes').onclick=()=>{s={stage:0,phase:0,counts:{},queue:[],n:1,attempt:0,hinted:false,recover:false,answer:'',steps:0,weak:{},completed:false};active=true;$('dialog').close();next()}};}
$('menu').onclick=menu;$('dialog').addEventListener('cancel',e=>{e.preventDefault();resume()});
$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'確認'].map(k=>`<button class="key ${k==='⌫'?'del':k==='確認'?'enter':''}" data-key="${k}">${k}</button>`).join('');function key(k){if(!active||locked)return;if(k==='⌫'){s.answer=s.answer.slice(0,-1);$('answer').textContent=s.answer||'?'}else if(k==='確認')submit();else digit(k)}$('keypad').onclick=e=>{let b=e.target.closest('[data-key]');if(b)key(b.dataset.key)};document.addEventListener('keydown',e=>{if($('dialog').open)return;if(/^\d$/.test(e.key)){e.preventDefault();key(e.key)}else if(e.key==='Backspace'){e.preventDefault();key('⌫')}else if(e.key==='Enter'){e.preventDefault();key('確認')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){pause();modal('<h2>休息一下</h2><p></p><button class="primary" id="back">繼續爬！</button>');$('back').onclick=resume}});
function tick(now){motion(now);if(active&&deadline&&!locked){let left=deadline-now;$('timerFill').style.width=Math.max(0,left/(limit()*1000)*100)+'%';$('timerFill').style.background=left<1000?'#e6a078':'#75b6a0';$('timeLabel').textContent=`⏱ ${(Math.max(0,left)/1000).toFixed(1)}`;if(left<=0)fail(true)}requestAnimationFrame(tick)}
render();modal(`<div class="dialog-icon">⛰️</div><h2>6 × 登山冒險</h2><button class="primary" id="go">${s.steps?'繼續爬！':'出發！'}</button>`);$('go').onclick=()=>{loadCantonese();if('speechSynthesis' in window)window.speechSynthesis.resume();active=true;$('dialog').close();if(s.completed){menu();return}if((s.counts[s.n]||0)>=target()){next()}else if(s.steps||s.queue.length){startQuestion()}else next()};requestAnimationFrame(tick);
