,.48);overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 0 14px rgba(244,114,182,.25)}.prog-fill{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,#38bdf8 0,#34d399 36%,#f472b6 72%,#fde047 100%);transition:width .24s cubic-bezier(.22, 1, .36, 1);border-radius:999px;box-shadow:0 0 14px rgba(244,114,182,.6)}.prog-segments{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent,transparent calc(10% - 1px),rgba(255,255,255,.2) calc(10% - 1px),rgba(255,255,255,.2) 10%);pointer-events:none}.prog-phase-mark{position:absolute;top:0;bottom:0;width:3px;background:#fde047;box-shadow:0 0 8px rgba(253,224,71,.95);pointer-events:none}.prog-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;letter-spacing:.6px;text-shadow:0 1px 4px rgba(0,0,0,.92);pointer-events:none}.teacher-slider{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:5;display:none}.teacher-mode .prog-bar-outer{overflow:visible;border-color:#fde047;box-shadow:0 0 16px rgba(253,224,71,.4)}.teacher-mode .prog-fill{transition:none}.teacher-mode .teacher-slider{display:block}.teacher-thumb{position:absolute;top:50%;left:0;width:18px;height:18px;border-radius:50%;background:#fde047;border:2.5px solid #fff;box-shadow:0 0 12px rgba(253,224,71,.95);transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:4}.teacher-mode .teacher-thumb{display:block}.icon-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}.icon-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid rgba(255,255,255,.26);background:rgba(30,41,59,.8);color:var(--text-main);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .1s;padding:0}.icon-btn:hover{background:rgba(244,114,182,.22)}.icon-btn:active{transform:scale(.92)}.icon-btn svg{width:18px;height:18px;stroke:currentColor;fil
