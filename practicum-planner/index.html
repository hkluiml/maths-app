&lt;tr data-minutes=&quot;60&quot; style=&quot;height:240px&quot;&gt;&lt;th scope=&quot;row&quot; style=&quot;grid-column:1;grid-row:20 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;&lt;/span&gt;&lt;/th&gt;&lt;td class=&quot;time&quot; style=&quot;grid-column:2;grid-row:20 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;15:30–16:30&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;grid-column:3;grid-row:20 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;grid-column:4;grid-row:20 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;grid-column:5;grid-row:20 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;grid-column:6;grid-row:20 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;yellow&quot; style=&quot;grid-column:7;grid-row:20 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;校務會議&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-minutes=&quot;60&quot; style=&quot;height:240px&quot;&gt;&lt;th scope=&quot;row&quot; style=&quot;grid-column:1;grid-row:21 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;&lt;/span&gt;&lt;/th&gt;&lt;td class=&quot;time&quot; style=&quot;grid-column:2;grid-row:21 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;16:30–17:30&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;grid-column:3;grid-row:21 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;grid-column:4;grid-row:21 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;grid-column:5;grid-row:21 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td style=&quot;grid-column:6;grid-row:21 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;yellow&quot; style=&quot;grid-column:7;grid-row:21 / span 1&quot; data-duration=&quot;60&quot;&gt;&lt;span class=&quot;cell-content&quot;&gt;校務會議&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;now-line&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;/div&gt;

&lt;/main&gt;

&lt;div class=&quot;edit-overlay&quot; id=&quot;edit-overlay&quot; hidden&gt;
 &lt;section class=&quot;edit-panel&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;edit-title&quot;&gt;
  &lt;h2 id=&quot;edit-title&quot;&gt;臨時代堂／事項&lt;/h2&gt;
  &lt;p class=&quot;edit-context&quot; id=&quot;edit-context&quot;&gt;&lt;/p&gt;
  &lt;textarea id=&quot;edit-text&quot; aria-label=&quot;臨時事項&quot; placeholder=&quot;例如：2A 代堂・課室 205&quot; maxlength=&quot;120&quot;&gt;&lt;/textarea&gt;
  &lt;div class=&quot;edit-actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;restore-edit&quot;&gt;恢復原本&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;cancel-edit&quot;&gt;取消&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;save-edit&quot; id=&quot;save-edit&quot;&gt;儲存&lt;/button&gt;&lt;/div&gt;
  &lt;p class=&quot;edit-note&quot; id=&quot;edit-note&quot;&gt;只改所選日期；下星期不會重複。&lt;/p&gt;
 &lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
function fitText(){
 document.querySelectorAll(&#x27;tbody th,tbody td&#x27;).forEach(cell=&gt;{
  const h=cell.getBoundingClientRect().height;
  const w=cell.getBoundingClientRect().width;
  const lines=cell.querySelector(&#x27;small&#x27;)||cell.querySelector(&#x27;br&#x27;)?2:1;
  const size=Math.max(3,Math.min(12,w/5.3,(h-1)/(lines*1.18)));
  cell.style.setProperty(&#x27;--cell-font&#x27;,size+&#x27;px&#x27;);
  cell.style.setProperty(&#x27;--time-font&#x27;,Math.max(3,Math.min(10,w/11.5,h-1))+&#x27;px&#x27;);
 });
}
new ResizeObserver(()=&gt;{fitText();updateNowLine();}).observe(document.querySelector(&#x27;.wrap&#x27;));
window.addEventListener(&#x27;resize&#x27;,fitText);window.addEventListener(&#x27;beforeprint&#x27;,fitText);fitText();


const alternateScheduleDates=new Set([&#x27;2026-10-14&#x27;,&#x27;2026-11-18&#x27;]);
const hongKongDate=new Intl.DateTimeFormat(&#x27;en-CA&#x27;,{timeZone:&#x27;Asia/Hong_Kong&#x27;,year:&#x27;numeric&#x27;,month:&#x27;2-digit&#x27;,day:&#x27;2-digit&#x27;});
function hongKongDateKey(date){
 const p=Object.fromEntries(hongKongDate.formatToParts(date).map(x=&gt;[x.type,x.value]));
 return p.year+&#x27;-&#x27;+p.month+&#x27;-&#x27;+p.day;
}
let selectedWeekDate=null;
function viewDate(){return selectedWeekDate?new Date(selectedWeekDate+&#x27;T12:00:00+08:00&#x27;):new Date();}
function viewingCurrentWeek(){return weekDateForColumn(viewDate(),3)===weekDateForColumn(new Date(),3);}
function updateWeekControls(){
 const start=weekDateForColumn(viewDate(),3),end=weekDateForColumn(viewDate(),7);
 document.querySelector(&#x27;#week-picker&#x27;).value=start;
 document.querySelector(&#x27;#week-range&#x27;).textContent=start.slice(5).replace(&#x27;-&#x27;,&#x27;/&#x27;)+&#x27;–&#x27;+end.slice(5).replace(&#x27;-&#x27;,&#x27;/&#x27;);
 document.querySelector(&#x27;#current-week&#x27;).disabled=viewingCurrentWeek();
 for(const [i,cell] of [...document.querySelectorAll(&#x27;thead th&#x27;)].slice(2).entries()){
  let span=cell.querySelector(&#x27;.column-date&#x27;);if(!span){span=document.createElement(&#x27;span&#x27;);span.className=&#x27;column-date&#x27;;cell.querySelector(&#x27;.cell-content&#x27;).append(span);}
  const date=weekDateForColumn(viewDate(),i+3);span.textContent=Number(date.slice(5,7))+&#x27;/&#x27;+Number(date.slice(8));
 }
}
function setViewedWeek(value){selectedWeekDate=value;updateWeekControls();updateNowLine();}
function moveWeek(days){const d=new Date(weekDateForColumn(viewDate(),3)+&#x27;T12:00:00+08:00&#x27;);d.setUTCDate(d.getUTCDate()+days);setViewedWeek(hongKongDateKey(d));}
function usesFridaySchedule(date){
 // Show the exception for the whole displayed week, including advance viewing.
 const base=new Date(hongKongDateKey(date)+&#x27;T00:00:00Z&#x27;);
 const mondayOffset=(base.getUTCDay()+6)%7;
 base.setUTCDate(base.getUTCDate()-mondayOffset+2);
 return alternateScheduleDates.has(base.toISOString().slice(0,10));
}
// Only the 08:45–15:05 rows change. Morning meetings and dismissal remain unchanged.
const alternateCells=[];
let rowStart=465;
for(const row of document.querySelectorAll(&#x27;tbody tr&#x27;)){
 const duration=Number(row.dataset.minutes);
 if(rowStart&gt;=525 &amp;&amp; rowStart&lt;905){
  const cells=[...row.querySelectorAll(&#x27;td&#x27;)];
  const target=cells.find(c=&gt;Number(c.style.gridColumnStart)===5);
  const friday=cells.find(c=&gt;Number(c.style.gridColumnStart)===7);
  if(target &amp;&amp; friday){
   let fridayHTML=friday.innerHTML;
   let fridayClass=friday.className;
   alternateCells.push({cell:target,normalHTML:target.innerHTML,normalClass:target.className,fridayHTML,fridayClass});
  }
 }
 rowStart+=duration;
}
let displayedSchedule=null;
function updateDailySchedule(date=new Date()){
 const special=usesFridaySchedule(date);
 if(displayedSchedule===special)return;
 for(const item of alternateCells){
  item.cell.innerHTML=special?item.fridayHTML:item.normalHTML;
  item.cell.className=special?item.fridayClass:item.normalClass;
 }
 displayedSchedule=special;
 fitText();
}

const hongKongClock=new Intl.DateTimeFormat(&#x27;en-GB&#x27;,{
 timeZone:&#x27;Asia/Hong_Kong&#x27;,weekday:&#x27;short&#x27;,hour:&#x27;2-digit&#x27;,minute:&#x27;2-digit&#x27;,second:&#x27;2-digit&#x27;,hourCycle:&#x27;h23&#x27;
});
function currentTimePosition(date){
 const parts=Object.fromEntries(hongKongClock.formatToParts(date).map(p=&gt;[p.type,p.value]));
 const minutes=Number(parts.hour)*60+Number(parts.minute)+Number(parts.second)/60;
 if(![&#x27;Mon&#x27;,&#x27;Tue&#x27;,&#x27;Wed&#x27;,&#x27;Thu&#x27;,&#x27;Fri&#x27;].includes(parts.weekday)||minutes&lt;465||minutes&gt;=1050)return null;
 return {minutes,weekday:parts.weekday};
}
function updateToday(date=new Date()){
 const weekday=hongKongClock.formatToParts(date).find(p=&gt;p.type===&#x27;weekday&#x27;).value;
 const names={Mon:&#x27;星期一&#x27;,Tue:&#x27;星期二&#x27;,Wed:&#x27;星期三&#x27;,Thu:&#x27;星期四&#x27;,Fri:&#x27;星期五&#x27;,Sat:&#x27;星期六&#x27;,Sun:&#x27;星期日&#x27;};
 document.querySelector(&#x27;#today-date&#x27;).textContent=&#x27;今天 &#x27;+names[weekday]+(alternateScheduleDates.has(hongKongDateKey(date))?&#x27;（星期五安排）&#x27;:&#x27;&#x27;);
 const dayIndex=[&#x27;Mon&#x27;,&#x27;Tue&#x27;,&#x27;Wed&#x27;,&#x27;Thu&#x27;,&#x27;Fri&#x27;].indexOf(weekday);
 document.querySelectorAll(&#x27;thead th&#x27;).forEach((cell,index)=&gt;{
  const active=viewingCurrentWeek() &amp;&amp; dayIndex&gt;=0 &amp;&amp; index===dayIndex+2;
  cell.classList.toggle(&#x27;today-column&#x27;,active);
  const old=cell.querySelector(&#x27;.today-badge&#x27;);
  if(active&amp;&amp;!old){const badge=document.createElement(&#x27;span&#x27;);badge.className=&#x27;today-badge&#x27;;badge.textContent=&#x27;今天&#x27;;cell.querySelector(&#x27;.cell-content&#x27;).appendChild(badge);}
  if(!active&amp;&amp;old)old.remove();
  if(active)cell.setAttribute(&#x27;aria-current&#x27;,&#x27;date&#x27;);else cell.removeAttribute(&#x27;aria-current&#x27;);
 });
 document.querySelectorAll(&#x27;tbody td&#x27;).forEach(cell=&gt;{
  cell.classList.toggle(&#x27;today-column&#x27;,viewingCurrentWeek()&amp;&amp;dayIndex&gt;=0&amp;&amp;Number(cell.style.gridColumnStart)===dayIndex+3);
 });
}
function updateNowLine(){
 renderSchedule();
 updateToday();
 const line=document.querySelector(&#x27;.now-line&#x27;);
 const current=currentTimePosition(new Date());
 if(!current||!viewingCurrentWeek()){line.style.display=&#x27;none&#x27;;return;}
 const wrap=document.querySelector(&#x27;.wrap&#x27;);
 const parent=wrap.getBoundingClientRect();
 const rows=[...document.querySelectorAll(&#x27;tbody tr&#x27;)];
 let start=465;
 for(const row of rows){
  const duration=Number(row.dataset.minutes);
  if(current.minutes&lt;start+duration){
   const r=row.querySelector(&#x27;th&#x27;).getBoundingClientRect();
   const first=document.querySelector(&#x27;thead th:nth-child(3)&#x27;).getBoundingClientRect();
   const last=document.querySelector(&#x27;thead th:last-child&#x27;).getBoundingClientRect();
   line.style.left=(first.left-parent.left-wrap.clientLeft)+&#x27;px&#x27;;
   line.style.width=(last.right-first.left)+&#x27;px&#x27;;
   line.style.top=(r.top-parent.top-wrap.clientTop+r.height*(current.minutes-start)/duration)+&#x27;px&#x27;;
   line.style.display=&#x27;block&#x27;;
   line.title=&#x27;香港時間 &#x27;+hongKongClock.format(new Date());
   return;
  }
  start+=duration;
 }
 line.style.display=&#x27;none&#x27;;
}

const editStorageKey=&#x27;hk-practicum-timetable-temporary-v1&#x27;;
const defaultScheduleEdits={&#x27;2026-11-24|12&#x27;:&#x27;1F 後半&#x27;,&#x27;2026-11-27|7&#x27;:&#x27;2D 數學&#x27;,&#x27;2026-11-30|17&#x27;:&#x27;火警演習&#x27;};
function effectiveEdit(key){return Object.hasOwn(temporaryEdits,key)?temporaryEdits[key]:defaultScheduleEdits[key];}
let temporaryEdits={};
let persistentEdits=true;
try{const saved=JSON.parse(localStorage.getItem(editStorageKey)||&#x27;{}&#x27;);if(saved&amp;&amp;typeof saved===&#x27;object&#x27;&amp;&amp;!Array.isArray(saved))temporaryEdits=saved;}catch{persistentEdits=false;}
const editableCells=[...document.querySelectorAll(&#x27;tbody td:not(.time)&#x27;)].map(cell=&gt;({
 cell,html:cell.innerHTML,classes:cell.className,row:cell.style.gridRowStart,column:Number(cell.style.gridColumnStart)
}));
function weekDateForColumn(date,column){
 const key=hongKongDateKey(date);
 const base=new Date(key+&#x27;T00:00:00Z&#x27;);
 const mondayOffset=(base.getUTCDay()+6)%7;
 base.setUTCDate(base.getUTCDate()-mondayOffset+(column-3));
 return base.toISOString().slice(0,10);
}
function editKey(dateKey,row){return dateKey+&#x27;|&#x27;+row;}
function renderSchedule(date=viewDate()){
 for(const item of editableCells){item.cell.innerHTML=item.html;item.cell.className=item.classes;}
 displayedSchedule=null;
 updateDailySchedule(date);
 for(const item of editableCells){
  const key=editKey(weekDateForColumn(date,item.column),item.row);
  const value=effectiveEdit(key);
  if(typeof value===&#x27;string&#x27;){
   const text=document.createElement(&#x27;span&#x27;);text.className=&#x27;cell-content&#x27;;text.textContent=value;
   item.cell.replaceChildren(text);item.cell.classList.add(&#x27;temporary-edit&#x27;);
  }
 }
 fitText();
}
let openedEdit=null;
const editOverlay=document.querySelector(&#x27;#edit-overlay&#x27;);
const editText=document.querySelector(&#x27;#edit-text&#x27;);
function openCellEditor(item){
 const dateKey=weekDateForColumn(viewDate(),item.column);
 const key=editKey(dateKey,item.row);
 openedEdit={item,key};
 const time=item.cell.parentElement.querySelector(&#x27;.time&#x27;).textContent;
 document.querySelector(&#x27;#edit-context&#x27;).textContent=dateKey+&#x27; &#x27;+[&#x27;星期一&#x27;,&#x27;星期二&#x27;,&#x27;星期三&#x27;,&#x27;星期四&#x27;,&#x27;星期五&#x27;][item.column-3]+&#x27;・&#x27;+time;
 editText.value=item.cell.textContent.trim();
 document.querySelector(&#x27;#edit-note&#x27;).textContent=persistentEdits?&#x27;只改所選日期；下星期不會重複。&#x27;:&#x27;此瀏覽器無法保留紀錄，關閉後可能需要重新輸入。&#x27;;
 editOverlay.hidden=false;editText.focus();editText.select();
}
function closeCellEditor(){editOverlay.hidden=true;if(openedEdit)openedEdit.item.cell.focus();openedEdit=null;}
function saveEdits(){
 try{localStorage.setItem(editStorageKey,JSON.stringify(temporaryEdits));}catch{persistentEdits=false;}
 updateNowLine();
 if(!persistentEdits){document.querySelector(&#x27;#edit-note&#x27;).textContent=&#x27;已顯示，但此瀏覽器無法保留紀錄，關閉後可能需要重新輸入。&#x27;;return;}
 closeCellEditor();
}
for(const item of editableCells){
 item.cell.tabIndex=0;item.cell.title=&#x27;點擊編輯此日期的臨時事項&#x27;;
 item.cell.addEventListener(&#x27;click&#x27;,()=&gt;openCellEditor(item));
 item.cell.addEventListener(&#x27;keydown&#x27;,event=&gt;{if(event.key===&#x27;Enter&#x27;||event.key===&#x27; &#x27;){event.preventDefault();openCellEditor(item);}});
}
document.querySelector(&#x27;#cancel-edit&#x27;).addEventListener(&#x27;click&#x27;,closeCellEditor);
document.querySelector(&#x27;#save-edit&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
 if(!openedEdit)return;
 temporaryEdits[openedEdit.key]=editText.value.trim();saveEdits();
});
document.querySelector(&#x27;#restore-edit&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
 if(!openedEdit)return;
 if(Object.hasOwn(defaultScheduleEdits,openedEdit.key))temporaryEdits[openedEdit.key]=null;else delete temporaryEdits[openedEdit.key];saveEdits();
});
editOverlay.addEventListener(&#x27;click&#x27;,event=&gt;{if(event.target===editOverlay)closeCellEditor();});
document.addEventListener(&#x27;keydown&#x27;,event=&gt;{if(event.key===&#x27;Escape&#x27;&amp;&amp;!editOverlay.hidden)closeCellEditor();});

document.querySelector(&#x27;#previous-week&#x27;).onclick=()=&gt;moveWeek(-7);
document.querySelector(&#x27;#next-week&#x27;).onclick=()=&gt;moveWeek(7);
document.querySelector(&#x27;#current-week&#x27;).onclick=()=&gt;setViewedWeek(null);
document.querySelector(&#x27;#week-picker&#x27;).onchange=e=&gt;{if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value))setViewedWeek(e.target.value);};
updateWeekControls();
setInterval(()=&gt;{updateWeekControls();updateNowLine();},15000);
window.addEventListener(&#x27;resize&#x27;,updateNowLine);
window.addEventListener(&#x27;pageshow&#x27;,updateNowLine);
document.addEventListener(&#x27;visibilitychange&#x27;,()=&gt;{if(!document.hidden)updateNowLine();});
updateNowLine();
&lt;/script&gt;
&lt;script&gt;
(function(){
 let lastTap=0,lastTarget=null,lastX=0,lastY=0;
 document.addEventListener(&#x27;touchend&#x27;,function(event){
  if(event.touches.length||event.changedTouches.length!==1){lastTap=0;return;}
  const target=event.target;
  if(target.closest(&#x27;input,textarea,select,button,a,[role=&quot;button&quot;],[contenteditable=&quot;true&quot;]&#x27;)){lastTap=0;return;}
  const t=event.changedTouches[0],now=Date.now();
  if(lastTarget===target&amp;&amp;now-lastTap&lt;300&amp;&amp;Math.abs(t.clientX-lastX)&lt;24&amp;&amp;Math.abs(t.clientY-lastY)&lt;24){event.preventDefault();lastTap=0;return;}
  lastTap=now;lastTarget=target;lastX=t.clientX;lastY=t.clientY;
 },{passive:false});
})();
&lt;/script&gt;&lt;/body&gt;

<iframe id="panel-1"  title="功課記錄" class="app-frame" aria-hidden="true" srcdoc="&lt;!doctype html&gt;
&lt;html lang=&quot;zh-Hant&quot;&gt;

&lt;script&gt;
&#x27;use strict&#x27;;
const KEY=&#x27;hk-p2-homework-v1&#x27;,TYPES=[&#x27;鞏工&#x27;,&#x27;作業&#x27;,&#x27;補充&#x27;,&#x27;綠工&#x27;];
let model={version:3,lessons:[],customHomework:[],records:{&#x27;2C&#x27;:{},&#x27;2D&#x27;:{}}},editing=null,timer;
const $=id=&gt;document.getElementById(id);
function validDate(s){if(s===&#x27;&#x27;)return true;if(typeof s!==&#x27;string&#x27;||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+&#x27;T00:00:00Z&#x27;);return !isNaN(d)&amp;&amp;d.toISOString().slice(0,10)===s;}
function isAssessment(l){return [&#x27;assessment&#x27;,&#x27;supplement-assessment&#x27;,&#x27;workbook-test-2&#x27;,&#x27;green-problem-solving&#x27;].includes(l.kind);}
function pageCount(l){return l.kind===&#x27;green-problem-solving&#x27;?4:l.kind===&#x27;workbook-test-2&#x27;?2:l.kind===&#x27;supplement-assessment&#x27;?4:l.kind===&#x27;assessment&#x27;?5:8;}
function pageNumber(l,index){return l.kind===&#x27;supplement-assessment&#x27;?30+index:isAssessment(l)?index+1:index%2+1;}
function taskType(l,index){return l.kind===&#x27;green-problem-solving&#x27;?&#x27;綠工・綜合解難&#x27;:l.kind===&#x27;workbook-test-2&#x27;?&#x27;作業・綜合測試&#x27;:l.kind===&#x27;supplement-assessment&#x27;?&#x27;補充・進展性評估2&#x27;:l.kind===&#x27;assessment&#x27;?&#x27;作業綜合測驗&#x27;:TYPES[Math.floor(index/2)];}
function blankDates(l){return Array(pageCount(l)).fill(&#x27;&#x27;);}
function validate(v){
 if(!v||![1,2,3].includes(v.version)||!Array.isArray(v.lessons)||v.lessons.length&gt;1000||!v.records)throw Error(&#x27;格式不正確&#x27;);
 const ids=new Set(),clean={version:3,initialBackupRevision:typeof v.initialBackupRevision===&#x27;string&#x27;?v.initialBackupRevision:&#x27;&#x27;,customHomework:[],presetVersion:v.presetVersion===1?1:0,lessons:[],records:{&#x27;2C&#x27;:{},&#x27;2D&#x27;:{}}};
 for(const l of v.lessons){
  if(!l||typeof l.id!==&#x27;string&#x27;||!/^[\w-]{1,100}$/.test(l.id)||ids.has(l.id)||typeof l.name!==&#x27;string&#x27;||!l.name.trim()||l.name.length&gt;100)throw Error(&#x27;課題格式不正確&#x27;);
  ids.add(l.id);const lesson={id:l.id,name:l.name,...(isAssessment(l)?{kind:l.kind}:{})};clean.lessons.push(lesson);
  for(const c of [&#x27;2C&#x27;,&#x27;2D&#x27;]){
   let values=v.records[c]?.[l.id]??(v.version===1?Array(4).fill(&#x27;&#x27;):blankDates(lesson));
   if(!Array.isArray(values)||!values.every(validDate))throw Error(&#x27;日期格式不正確&#x27;);
   if(v.version===1){if(values.length!==4)throw Error(&#x27;日期格式不正確&#x27;);values=values.flatMap(value=&gt;[value,&#x27;&#x27;]);}
   if(values.length!==pageCount(lesson))throw Error(&#x27;頁數不正確&#x27;);clean.records[c][l.id]=values.slice();
  }
 }
 if(v.customHomework!==undefined){
  if(!Array.isArray(v.customHomework)||v.customHomework.length&gt;5000)throw Error(&#x27;自訂功課格式不正確&#x27;);
  const customIds=new Set();
  for(const x of v.customHomework){
   if(!x||typeof x.id!==&#x27;string&#x27;||!/^[\w-]{1,100}$/.test(x.id)||customIds.has(x.id)||![&#x27;2C&#x27;,&#x27;2D&#x27;].includes(x.className)||!x.date||!validDate(x.date)||typeof x.text!==&#x27;string&#x27;||!x.text.trim()||x.text.length&gt;300)throw Error(&#x27;自訂功課格式不正確&#x27;);
   customIds.add(x.id);clean.customHomework.push({id:x.id,className:x.className,date:x.date,text:x.text.trim()});
  }
 }
 ensureAssessment(clean);ensureWorkbookTest(clean);ensureSupplementAssessment(clean);ensureGreenProblemSolving(clean);return clean;
}
function ensureAssessment(data){
 if(data.lessons.some(l=&gt;l.kind===&#x27;assessment&#x27;))return;
 const lesson={id:&#x27;workbook-assessment&#x27;,name:&#x27;作業・綜合測驗&#x27;,kind:&#x27;assessment&#x27;};
 const index=data.lessons.findIndex(l=&gt;l.id===&#x27;preset-10&#x27;||/^(?:第\s*)?10(?:\s*課|[ .、：:])/.test(l.name)||l.name===&#x27;四個主要方向&#x27;);
 data.lessons.splice(index&lt;0?data.lessons.length:index+1,0,lesson);
 for(const c of [&#x27;2C&#x27;,&#x27;2D&#x27;])data.records[c][lesson.id]=blankDates(lesson);
}
function ensureWorkbookTest(data){
 if(data.lessons.some(l=&gt;l.kind===&#x27;workbook-test-2&#x27;))return;
 const lesson={id:&#x27;workbook-test-2&#x27;,name:&#x27;作業・綜合測試&#x27;,kind:&#x27;workbook-test-2&#x27;};
 const index=data.lessons.findIndex(l=&gt;l.id===&#x27;preset-12&#x27;||/^(?:第\s*)?12(?:\s*課|[ .、：:])/.test(l.name)||l.name===&#x27;乘法的計算（一）&#x27;);
 data.lessons.splice(index&lt;0?data.lessons.length:index+1,0,lesson);
 for(const c of [&#x27;2C&#x27;,&#x27;2D&#x27;])data.records[c][lesson.id]=blankDates(lesson);
}
function ensureSupplementAssessment(data){
 if(data.lessons.some(l=&gt;l.kind===&#x27;supplement-assessment&#x27;))return;
 const lesson={id:&#x27;supplement-progress-2&#x27;,name:&#x27;補充・進展性評估2&#x27;,kind:&#x27;supplement-assessment&#x27;};
 const index=data.lessons.findIndex(l=&gt;l.id===&#x27;preset-12&#x27;||/^(?:第\s*)?12(?:\s*課|[ .、：:])/.test(l.name)||l.name===&#x27;乘法的計算（一）&#x27;);
 const workbookIndex=data.lessons.findIndex(l=&gt;l.kind===&#x27;workbook-test-2&#x27;);
 data.lessons.splice(workbookIndex&gt;=0?workbookIndex+1:index&lt;0?data.lessons.length:index+1,0,lesson);
 for(const c of [&#x27;2C&#x27;,&#x27;2D&#x27;])data.records[c][lesson.id]=blankDates(lesson);
}
function ensureGreenProblemSolving(data){
 if(data.lessons.some(l=&gt;l.kind===&#x27;green-problem-solving&#x27;))return;
 const lesson={id:&#x27;green-problem-solving&#x27;,name:&#x27;綠工・綜合解難&#x27;,kind:&#x27;green-problem-solving&#x27;};
 const index=data.lessons.findIndex(l=&gt;l.kind===&#x27;supplement-assessment&#x27;);
 data.lessons.splice(index&lt;0?data.lessons.length:index+1,0,lesson);
 for(const c of [&#x27;2C&#x27;,&#x27;2D&#x27;])data.records[c][lesson.id]=blankDates(lesson);
}
